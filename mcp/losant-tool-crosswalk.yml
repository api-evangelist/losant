      The repo's OpenAPI covers 237 operations. The provider's own Bravado schema at https://api.losant.com/
      (info.version 1.30.2) publishes 375. The 138-operation shortfall is a gap in this repo's derived
      OpenAPI, not in the provider's API - it is recorded here rather than papered over, and several
      losant_query/losant_write resource types below bind to operations that exist upstream but are not yet
      captured in openapi/ (marked binding: upstream-only).
