notes: |
  The Losant MCP server is a THIN, GENERIC facade over the Platform REST API: three tools, each of which
  fans out across many REST operations by (operation x resourceType) rather than exposing one tool per
  operation. Binding is therefore one-to-many and mechanical - losant_query{operation:list,resourceType:X}
  is the REST collection GET for X, and losant_query{operation:get,...} is the item GET. Confidence is
  recorded per row against the fan-out, and the live tools/list is OAuth-gated so no live inputSchema was
  observed (see surfaces.mcp).
