mcp_only:
  - tool: losant_write
    reason: |
      The MCP server exposes authoring guides and JSON Schemas as MCP RESOURCES (losant://guides/...,
      losant://schemas/{resourceType}Post, losant://authoring/flows/flow with 90 node specs and 35 trigger
      specs). Those are server-side documentation composites with no REST equivalent - the REST API returns
      no such authoring guide.
rest_only:
  - capability: Device telemetry ingestion
    operations: [device.setConnectionStatus, device.removeData]
    note: 'no MCP tool writes device state or sends commands; state ingestion is MQTT-first (broker.losant.com) and device.sendState/sendCommand are not exposed as tools'
  - capability: Enterprise Instance administration
    operations: [instances.get, instance.patch, instanceOrgs.get, instanceOrgs.post, instanceMembers.get, instanceApiTokens.post, instanceCustomNodes.get, instanceNotificationRules.get, instanceAuditLogs.get, instanceSandboxes.get]
    note: 'the entire self-hosted/dedicated instance-manager surface has no MCP tool'
  - capability: Auth, tokens and account
    operations: [auth.authenticateUserSaml, auth.ssoDomain, userApiTokens.post, userApiToken.delete, orgs.get, orgs.post, org.inviteMember, me.transferResources]
    note: 'deliberate - the MCP server authenticates via OAuth and does not re-expose credential issuance'
  - capability: Application lifecycle and bulk data
    operations: [application.import, applications.import, application.globals, data.export, events.export, embeddedDeployments.export, applicationJobLogs.get, auditLogs.get]
