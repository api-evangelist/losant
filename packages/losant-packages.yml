  https://docs.losant.com/rest-api/overview/, https://github.com/Losant
notes: |
  Losant publishes first-party clients in two families: REST clients for the Platform API (generated from
  the Losant "bravado" API schema at https://api.losant.com/) and MQTT clients for device connectivity to
  broker.losant.com. The REST family is actively maintained - losant-rest (npm) shipped 4.2.2 on
  2026-08-25 and the Python/Ruby REST clients both shipped on 2026-07-22, tracking the live Platform API.
  The MQTT family has decayed: the JavaScript MQTT client last published 5.0.0 in August 2021 and the
  Python/Ruby MQTT clients last published in April 2024, while the platform itself shipped its most
  recent update in August 2026.
  The MCP server is NOT distributed on npm - it is distributed as source (GitHub) and as a Docker Hub
  image, and the published image (1.0.0, 2026-06-05) trails the source CHANGELOG (1.1.0, 2026-08-25) by
  a minor version, so a Docker-based install today does not get the losant_write tool.
