notes: 'Entity graph derived from the id-reference fields on the OpenAPI schemas. Losant is a strict hierarchy: an Organization
  (or a user Sandbox) owns Applications, and an Application is the tenancy boundary for every other resource - devices,
  data tables, workflows, experiences, dashboards, files, webhooks, integrations, credentials and deployments all carry
  applicationId and none can be reached across applications. Every id is a 24-character hex ObjectId with no type prefix,
  so an id alone does not tell an agent what it points at; the _type discriminator on each response object does.'
