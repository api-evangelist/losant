rate_limit_errors:
  http: 429 Too Many Requests on throttled REST endpoints
  mqtt: exceeding MQTT message limits disconnects and bans the client for 30 seconds, doubling on each repeat violation
    up to 1 hour; resets after 15 minutes of compliant traffic
  source: https://docs.losant.com/mqtt/overview/
