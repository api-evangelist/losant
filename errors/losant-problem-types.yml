notes: 'Losant does NOT use RFC 9457 application/problem+json. Every error response is application/json carrying the
  `error` schema: {"type": "<ErrorName>", "message": "<human readable>"}. The same envelope is returned by the API host
  for routing failures - an unmapped path answers 405 {"type":"MethodNotAllowed","message":"GET is not allowed"}, which
  is how this envelope was confirmed live rather than only from the spec.'
envelope:
  media_type: application/json
  schema: '#/components/schemas/error'
  fields:
  - name: type
    type: string
    description: Machine-readable error name, e.g. MethodNotAllowed, Validation, NotFound.
  - name: message
    type: string
    description: Human-readable explanation.
  observed_example:
    type: MethodNotAllowed
    message: GET is not allowed
  observed_at: https://api.losant.com/openapi.json (GET, HTTP 405, probed 2026-08-26)
