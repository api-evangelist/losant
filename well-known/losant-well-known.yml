notes: |
  Losant serves a real RFC 8414 OAuth 2.0 Authorization Server Metadata document from the Platform API
  host, and the hosted MCP server (mcp.losant.com) serves both RFC 8414 and RFC 9728 (OAuth 2.0
  Protected Resource Metadata) documents. These are the documents an MCP client discovers when it hits
  the 401 challenge on https://mcp.losant.com/mcp.

  The Platform API host answers every unmapped path with HTTP 405 {"type":"MethodNotAllowed"} rather
  than 404, so a 405 here is a genuine "this path is not served" result, not a soft block. The marketing
  site (www.losant.com) and the Docusaurus docs host both answer unmapped /.well-known/ paths with an
  HTML 404 page.
