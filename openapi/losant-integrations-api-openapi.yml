          properties:
            clientId:
              type: string
              minLength: 1
              maxLength: 1024
            username:
              type: string
              minLength: 1
              maxLength: 1024
            password:
              type: string
              minLength: 1
              maxLength: 1024
            clean:
              type: boolean
            port:
              type: number
              minimum: 1
              maximum: 65535
            protocol:
              type: string
              enum:
              - mqtt
              - mqtts
              - ws
              - wss
            host:
              type: string
              minLength: 1
              maxLength: 1024
            privateKey:
              type: string
              maxLength: 32767
              minLength: 4
            certificate:
              type: string
              maxLength: 32767
              minLength: 4
            caCertificate:
              type: string
              maxLength: 32767
              minLength: 4
            disableSSLVerification:
              type: boolean
            protocolVersion:
              type: string
              enum:
              - 3.1.1
              - '5'
          additionalProperties: false
          required:
          - port
          - protocol
          - host
        particleConfig:
          type: object
          properties:
            accessToken:
              type: string
              minLength: 1
              maxLength: 1024
            productSlugOrId:
              type: string
              minLength: 1
              maxLength: 1024
            orgSlugOrId:
              type: string
              minLength: 1
              maxLength: 1024
            deviceNameOrId:
              type: string
              minLength: 1
              maxLength: 1024
          additionalProperties: false
          required:
          - accessToken
        sqsConfig:
          type: object
          properties:
            accessKeyId:
              type: string
              minLength: 4
              maxLength: 128
            secretAccessKey:
              type: string
              minLength: 4
              maxLength: 128
            region:
              type: string
              minLength: 4
              maxLength: 128
            queueUrl:
              type: string
              minLength: 1
              maxLength: 256
          additionalProperties: false
          required:
          - queueUrl
        websocketConfig:
          type: object
          properties:
            url:
              type: string
              minLength: 1
              maxLength: 1024
            disableSSLVerification:
              type: boolean
            username:
              type: string
              minLength: 1
              maxLength: 1024
            password:
              type: string
              minLength: 1
              maxLength: 1024
            privateKey:
              type: string
              maxLength: 32767
              minLength: 4
            certificate:
              type: string
              maxLength: 32767
              minLength: 4
            caCertificate:
              type: string
              maxLength: 32767
              minLength: 4
            headers:
              type: array
              maxItems: 50
              items:
                type: object
                properties:
                  headerKey:
                    type: string
                    minLength: 1
                    maxLength: 1024
                  headerValue:
                    type: string
                    minLength: 1
                    maxLength: 1024
                additionalProperties: false
                required:
                - headerKey
                - headerValue
          additionalProperties: false
          required:
          - url
        status:
          type: object
          properties:
            lastKeepAlive:
              type: number
            nextAttempt:
              type: number
            connectInfo:
              type: object
              properties:
                ts:
                  type:
                  - number
                  - 'null'
            disconnectInfo:
              type: object
              properties:
                ts:
                  type:
                  - number
                  - 'null'
                error:
                  type: string
