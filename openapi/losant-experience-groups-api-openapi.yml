                maxLength: 255
            additionalProperties: false
          maxItems: 100
        deviceQueryJson:
          type:
          - string
          - 'null'
          maxLength: 8192
        parentId:
          oneOf:
          - type: string
            pattern: ^[A-Fa-f\d]{24}$
