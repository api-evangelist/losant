openapi: 3.2.0
info:
  title: Platform Device Attributes API
  version: 1.31.0
  description: User API for accessing platform data
servers:
- url: https://api.losant.com
security:
- bearerAuth: []
tags:
- name: Device Attributes
paths:
  /applications/{applicationId}/devices/{deviceId}/attributes:
    get:
      operationId: deviceAttributes.get
      summary: Returns the attributes for a device
      tags:
      - Device Attributes
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: deviceId
        in: path
        required: true
        description: ID associated with the device
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ecf887ae143cd83dc4aa2
      - name: sortField
        in: query
        required: false
        description: Field to sort the results by
        schema:
          type: string
          enum:
          - name
          - dataType
          default: name
        example: status
      - name: sortDirection
        in: query
        required: false
        description: Direction to sort the results by
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        example: asc
      - name: filterField
        in: query
        required: false
        description: Field to filter the results by. Blank or not provided means no filtering.
        schema:
          type: string
          enum:
          - name
          - dataType
        example: status
      - name: filter
        in: query
        required: false
        description: Filter to apply against the filtered field. Supports globbing. Blank or not provided means no filtering.
        schema:
          type: string
        example: number
      responses:
        '200':
          description: Collection of device attributes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deviceAttributes'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if device was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - deviceAttributes.get
    post:
      operationId: deviceAttributes.post
      summary: Adds a new attribute to a device
      tags:
      - Device Attributes
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: deviceId
        in: path
        required: true
        description: ID associated with the device
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ecf887ae143cd83dc4aa2
      responses:
        '201':
          description: Successfully created device attribute
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deviceAttribute'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if device was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/deviceAttributePost'
        description: Device attribute information
      x-losant-auth-scopes:
      - deviceAttributes.post
  /applications/{applicationId}/devices/{deviceId}/attributes/{name}:
    get:
      operationId: deviceAttribute.get
      summary: Retrieves information on a device attribute
      tags:
      - Device Attributes
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: deviceId
        in: path
        required: true
        description: ID associated with the device
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ecf887ae143cd83dc4aa2
      - name: name
        in: path
        required: true
        description: Name of the attribute
        schema:
          type: string
          pattern: ^[0-9a-zA-Z_-]{1,255}$
        example: voltage
      responses:
        '200':
          description: Device attribute information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deviceAttribute'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if device attribute was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - deviceAttribute.get
    patch:
      operationId: deviceAttribute.patch
      summary: Updates an attribute on a device
      tags:
      - Device Attributes
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: deviceId
        in: path
        required: true
        description: ID associated with the device
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ecf887ae143cd83dc4aa2
      - name: name
        in: path
        required: true
        description: Name of the attribute
        schema:
          type: string
          pattern: ^[0-9a-zA-Z_-]{1,255}$
        example: voltage
      responses:
        '200':
          description: Updated device attribute information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deviceAttribute'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if device attribute was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/deviceAttributePatch'
        description: Object containing new properties of the device attribute
      x-losant-auth-scopes:
      - deviceAttribute.patch
    delete:
      operationId: deviceAttribute.delete
      summary: Removes an attribute from a device
      tags:
      - Device Attributes
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: deviceId
        in: path
        required: true
        description: ID associated with the device
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ecf887ae143cd83dc4aa2
      - name: name
        in: path
        required: true
        description: Name of the attribute
        schema:
          type: string
          pattern: ^[0-9a-zA-Z_-]{1,255}$
        example: voltage
      responses:
        '200':
          description: If device attribute was successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if device attribute was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - deviceAttribute.delete
components:
  schemas:
    deviceAttributes:
      title: Device Attributes
      description: Schema for a collection of Device Attributes
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/deviceAttribute'
        count:
          type: integer
        totalCount:
          type: integer
        filter:
          type: string
        filterField:
          type: string
        sortField:
          type: string
        sortDirection:
          type: string
          enum:
          - asc
          - desc
          - ASC
          - DESC
          - ''
        applicationId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        deviceId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
    error:
      title: Error
      description: Schema for errors returned by the API
      type: object
      properties:
        type:
          type: string
        message:
          type: string
        validationErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              validationMessage:
                type: string
    success:
      title: Success
      description: Schema for reporting a successful operation
      type: object
      properties:
        success:
          type: boolean
          enum:
