openapi: 3.2.0
info:
  title: Platform Application Certificates API
  version: 1.31.0
  description: User API for accessing platform data
servers:
- url: https://api.losant.com
security:
- bearerAuth: []
tags:
- name: Application Certificates
paths:
  /applications/{applicationId}/certificates:
    get:
      operationId: applicationCertificates.get
      summary: Returns the application certificates for an application
      tags:
      - Application Certificates
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: sortField
        in: query
        required: false
        description: Field to sort the results by
        schema:
          type: string
          enum:
          - name
          - certificateInfo.commonName
          - status
          - id
          - creationDate
          - lastUpdated
          default: certificateInfo.commonName
        example: status
      - name: sortDirection
        in: query
        required: false
        description: Direction to sort the results by
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        example: asc
      - name: page
        in: query
        required: false
        description: Which page of results to return
        schema:
          type: string
          default: 0
        example: 0
      - name: perPage
        in: query
        required: false
        description: How many items to return per page
        schema:
          type: string
          default: 100
        example: 10
      - name: filterField
        in: query
        required: false
        description: Field to filter the results by. Blank or not provided means no filtering.
        schema:
          type: string
          enum:
          - name
          - certificateInfo.commonName
          - status
        example: status
      - name: filter
        in: query
        required: false
        description: Filter to apply against the filtered field. Supports globbing. Blank or not provided means no filtering.
        schema:
          type: string
        example: the*status
      - name: query
        in: query
        required: false
        description: Application certificate filter JSON object which overrides the filterField and filter parameters.
        schema:
          $ref: '#/components/schemas/advancedApplicationCertQuery'
      responses:
        '200':
          description: Collection of application certificates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationCertificates'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - applicationCertificates.get
    post:
      operationId: applicationCertificates.post
      summary: Create a new application certificate for an application
      tags:
      - Application Certificates
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '201':
          description: Successfully created application certificate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationCertificate'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/applicationCertificatePost'
        description: Application certificate information
      x-losant-auth-scopes:
      - applicationCertificates.post
  /applications/{applicationId}/certificates/{applicationCertificateId}:
    get:
      operationId: applicationCertificate.get
      summary: Retrieves information on an application certificate
      tags:
      - Application Certificates
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: applicationCertificateId
        in: path
        required: true
        description: ID associated with the application certificate
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec76c7ae143cd83dc4a96
      responses:
        '200':
          description: Application certificate information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationCertificate'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application certificate was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - applicationCertificate.get
    patch:
      operationId: applicationCertificate.patch
      summary: Updates information about an application certificate
      tags:
      - Application Certificates
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: applicationCertificateId
        in: path
        required: true
        description: ID associated with the application certificate
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec76c7ae143cd83dc4a96
      responses:
        '200':
          description: Updated application certificate information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationCertificate'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application certificate was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/applicationCertificatePatch'
        description: Object containing new properties of the application certificate
      x-losant-auth-scopes:
      - applicationCertificate.patch
    delete:
      operationId: applicationCertificate.delete
      summary: Deletes an application certificate
      tags:
      - Application Certificates
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: applicationCertificateId
        in: path
        required: true
        description: ID associated with the application certificate
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec76c7ae143cd83dc4a96
      responses:
        '200':
          description: If application certificate was successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application certificate was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - applicationCertificate.delete
components:
  schemas:
    error:
      title: Error
      description: Schema for errors returned by the API
      type: object
      properties:
        type:
          type: string
        message:
          type: string
        validationErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              validationMessage:
                type: string
    applicationCertificatePost:
      title: Application Certificate Post
      description: Schema for the body of an Application Certificate creation request
      type: object
      properties:
        status:
          type: string
          enum:
          - active
          - inactive
        description:
          type: string
          maxLength: 32767
        name:
          type: string
          minLength: 1
          maxLength: 255
        filterType:
          oneOf:
          - type: string
            enum:
            - all
            - whitelist
            - blacklist
          - type: string
            enum:
            - none
        pubTopics:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 1024
        subTopics:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 1024
        addressFilterType:
          type: string
          enum:
          - all
          - whitelist
          - blacklist
        addresses:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 48
        deviceId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        certificate:
          type: string
          maxLength: 32767
          minLength: 50
      required:
      - certificate
      additionalProperties: false
    success:
      title: Success
      description: Schema for reporting a successful operation
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
