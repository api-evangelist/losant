                - boolean
                - 'null'
              $lte:
                type:
                - string
                - number
                - boolean
                - 'null'
              $startsWith:
                type: string
                minLength: 1
              $endsWith:
                type: string
                minLength: 1
              $contains:
                type: string
                minLength: 1
              $ci:
                type: boolean
              $in:
                type: array
                maxItems: 100
                items:
                  type:
                  - string
                  - number
                  - boolean
              $nin:
                type: array
                maxItems: 100
                items:
                  type:
                  - string
                  - number
                  - boolean
            additionalProperties: false
        gatewayId:
          oneOf:
          - oneOf:
            - type: string
              pattern: ^[A-Fa-f\d]{24}$
            - type: 'null'
          - type: object
            properties:
              $eq:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $ne:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $gt:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $lt:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $gte:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $lte:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $in:
                type: array
                maxItems: 100
                items:
                  type: string
                  pattern: ^[A-Fa-f\d]{24}$
              $nin:
                type: array
                maxItems: 100
                items:
                  type: string
                  pattern: ^[A-Fa-f\d]{24}$
            additionalProperties: false
            minProperties: 1
            maxProperties: 1
        parentId:
          oneOf:
          - oneOf:
            - type: string
              pattern: ^[A-Fa-f\d]{24}$
            - type: 'null'
          - type: object
            properties:
              $eq:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $ne:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $gt:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $lt:
                oneOf:
