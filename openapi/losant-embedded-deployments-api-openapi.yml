openapi: 3.2.0
info:
  title: Platform Embedded Deployments API
  version: 1.31.0
  description: User API for accessing platform data
servers:
- url: https://api.losant.com
security:
- bearerAuth: []
tags:
- name: Embedded Deployments
paths:
  /applications/{applicationId}/embedded/deployments:
    get:
      operationId: embeddedDeployments.get
      summary: Returns the embedded deployments for an application
      tags:
      - Embedded Deployments
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: sortField
        in: query
        required: false
        description: Field to sort the results by
        schema:
          type: string
          enum:
          - id
          - creationDate
          - lastUpdated
          default: lastUpdated
        example: creationDate
      - name: sortDirection
        in: query
        required: false
        description: Direction to sort the results by
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        example: asc
      - name: page
        in: query
        required: false
        description: Which page of results to return
        schema:
          type: string
          default: 0
        example: 0
      - name: perPage
        in: query
        required: false
        description: How many items to return per page
        schema:
          type: string
          default: 1000
        example: 10
      - name: deviceId
        in: query
        required: false
        description: Filter deployments to the given Device ID
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ecf887ae143cd83dc4aa2
      - name: version
        in: query
        required: false
        description: Filter deployments to the given Workflow Version (matches against both current and desired)
        schema:
          type: string
        example: myFlowVersion
      - name: flowId
        in: query
        required: false
        description: Filter deployments to the given Workflow ID
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed18f7ae143cd83dc4aa6
      responses:
        '200':
          description: Collection of embedded deployments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/embeddedDeployments'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application or device was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - embeddedDeployments.get
  /applications/{applicationId}/embedded/deployments/export:
    post:
      operationId: embeddedDeployments.export
      summary: Request an export of the compiled WASM files for a current deployment
      tags:
      - Embedded Deployments
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '202':
          description: If generation of export was successfully started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobEnqueuedResult'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if deployment was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/embeddedDeploymentExport'
        description: Export options for embedded deployment
      x-losant-auth-scopes:
      - embeddedDeployments.export
  /applications/{applicationId}/embedded/deployments/release:
    post:
      operationId: embeddedDeployments.release
      summary: Deploy an embedded workflow version to one or more embedded devices.
      tags:
      - Embedded Deployments
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '202':
          description: If deployment release has been accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/embeddedDeploymentRelease'
        description: Deployment release information
      x-losant-auth-scopes:
      - embeddedDeployments.release
  /applications/{applicationId}/embedded/deployments/remove:
    post:
      operationId: embeddedDeployments.remove
      summary: Remove all embedded deployments from a device, remove all embedded deployments…
      tags:
      - Embedded Deployments
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '202':
          description: If deployment removal has been accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/embeddedDeploymentRemove'
        description: Deployment removal information
      x-losant-auth-scopes:
      - embeddedDeployments.remove
  /applications/{applicationId}/embedded/deployments/replace:
    post:
      operationId: embeddedDeployments.replace
      summary: Replace deployments of an embedded workflow version with a new version.
      tags:
      - Embedded Deployments
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '202':
          description: If deployment replacement has been accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/embeddedDeploymentReplace'
        description: Deployment replacement information
      x-losant-auth-scopes:
      - embeddedDeployments.replace
  /applications/{applicationId}/embedded/deployments/{embeddedDeploymentId}:
    get:
      operationId: embeddedDeployment.get
      summary: Retrieves information on an embedded deployment
      tags:
      - Embedded Deployments
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: embeddedDeploymentId
        in: path
        required: true
        description: ID associated with the embedded deployment
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed78e7ae143cd83dc4aab
      responses:
        '200':
          description: Embedded deployment information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/embeddedDeployment'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if embedded deployment was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - embeddedDeployment.get
components:
  schemas:
    embeddedDeployments:
      title: Embedded Deployments
      description: Schema for a collection of Embedded Deployments
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/embeddedDeployment'
        count:
          type: integer
        totalCount:
          type: integer
        perPage:
          type: integer
        page:
          type: integer
        filter:
          type: string
        filterField:
          type: string
        sortField:
          type: string
        sortDirection:
          type: string
          enum:
          - asc
          - desc
          - ASC
          - DESC
          - ''
        applicationId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        deviceId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        flowId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        version:
          type: string
          minLength: 1
          maxLength: 255
    error:
      title: Error
      description: Schema for errors returned by the API
      type: object
      properties:
        type:
          type: string
        message:
          type: string
        validationErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              validationMessage:
                type: string
    success:
      title: Success
      description: Schema for reporting a successful operation
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
    jobEnqueuedResult:
      title: Job Enqueued API Result
      description: Schema for the result of a job being queued
      type: object
      properties:
        jobQueued:
          type: boolean
          enum:
          - true
        jobId:
          type: string
          maxLength: 24
        success:
          type: boolean
          enum:
          - true
    embeddedDeployment:
      title: Embedded Deployment
      description: Schema for a single deployment of embedded workflows to embedded devices
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        embeddedDeploymentId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        applicationId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        creationDate:
          type: string
          format: date-time
        lastUpdated:
          type: string
          format: date-time
        deviceId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        deviceName:
          type: string
          minLength: 1
          maxLength: 255
        deviceConnectionInfo:
          type: object
          properties:
            time:
              type: string
              format: date-time
            connected:
              enum:
              - 1
              - 0
              - null
        flows:
          type: object
          patternProperties:
            ^[A-Fa-f\d]{24}$:
              type: object
              properties:
                flowName:
                  type: string
                  minLength: 1
                  maxLength: 255
                currentVersion:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 255
                desiredVersion:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 255
          additionalProperties: false
        currentBundleVersion:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
        desiredBundleVersion:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
        unknownBundle:
          type: boolean
        logs:
          type: array
          items:
            type: object
            properties:
              sourceType:
                type: string
                enum:
                - flow
                - user
                - device
                - apiToken
                - notebook
              sourceId:
                type: string
                pattern: ^[A-Fa-f\d]{24}$
              date:
                type: string
                format: date-time
              changeType:
                type: string
                enum:
                - current
                - desired
              updateType:
                type: string
                enum:
                - newFlow
                - replaceFlow
                - removeFlow
                - clear
                - globals
                - device
                - unknownBundle
                - knownBundle
              updateFlowId:
                type: string
                pattern: ^[A-Fa-f\d]{24}$
              desiredVersion:
                type:
                - string
                - 'null'
                minLength: 1
                maxLength: 255
              newBundle:
                type:
                - string
                - 'null'
                minLength: 1
                maxLength: 255
              attemptedBundle:
                type:
                - string
                - 'null'
                minLength: 1
                maxLength: 255
              error:
                type: string
    embeddedDeploymentRemove:
      title: Embedded Deployment Remove
      description: Schema for removing embedded deployments. Can remove a specific workflow from a specific device, can remove all workflows from a specific device, or can remove a specific workflow from all devices.
      type: object
      properties:
        flowId:
          type:
          - string
          - 'null'
          pattern: ^[A-Fa-f\d]{24}$
        deviceId:
          type:
          - string
          - 'null'
          pattern: ^[A-Fa-f\d]{24}$
      additionalProperties: false
      required:
      - flowId
      - deviceId
    embeddedDeploymentRelease:
      title: Embedded Deployment Release
      description: Schema for deploying an embedded workflow to one or more embedded devices
      type: object
      properties:
        flowId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        version:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
        deviceIds:
          type: array
          items:
            type: string
            pattern: ^[A-Fa-f\d]{24}$
          maxItems: 1000
        deviceTags:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                pattern: ^[0-9a-zA-Z_-]{1,255}$
              value:
                type: string
                minLength: 1
                maxLength: 255
            additionalProperties: false
          maxItems: 100
        deviceQuery:
          $ref: '#/components/schemas/advancedDeviceQuery'
        releaseTag:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
      additionalProperties: false
      required:
      - flowId
      - version
    advancedDeviceQuery:
      title: Advanced Device Query
      description: Schema for advanced device queries
      type: object
      properties:
        $and:
          type: array
          items:
            $ref: '#/components/schemas/advancedDeviceQuery'
          maxItems: 100
        $or:
          type: array
          items:
            $ref: '#/components/schemas/advancedDeviceQuery'
          maxItems: 100
        $nor:
          type: array
          items:
            $ref: '#/components/schemas/advancedDeviceQuery'
          maxItems: 100
        id:
          oneOf:
          - oneOf:
            - type: string
              pattern: ^[A-Fa-f\d]{24}$
            - type: 'null'
          - type: object
            properties:
              $eq:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $ne:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $gt:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $lt:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $gte:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $lte:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $in:
                type: array
                maxItems: 100
                items:
                  type: string
                  pattern: ^[A-Fa-f\d]{24}$
              $nin:
                type: array
                maxItems: 100
                items:
                  type: string
                  pattern: ^[A-Fa-f\d]{24}$
            additionalProperties: false
            minProperties: 1
            maxProperties: 1
        creationDate:
          oneOf:
          - type:
            - string
            - number
            - boolean
            - 'null'
          - type: object
            properties:
              $eq:
                type:
                - string
                - number
                - boolean
                - 'null'
              $ne:
                type:
                - string
                - number
                - boolean
                - 'null'
              $gt:
                type:
                - string
                - number
                - boolean
                - 'null'
              $lt:
                type:
                - string
                - number
                - boolean
                - 'null'
              $gte:
                type:
                - string
                - number
                - boolean
                - 'null'
              $lte:
                type:
                - string
                - number
                - boolean
                - 'null'
              $startsWith:
                type: string
                minLength: 1
              $endsWith:
                type: string
                minLength: 1
              $contains:
                type: string
                minLength: 1
              $ci:
                type: boolean
              $in:
                type: array
                maxItems: 100
                items:
                  type:
                  - string
                  - number
                  - boolean
              $nin:
                type: array
                maxItems: 100
                items:
                  type:
                  - string
                  - number
                  - boolean
            additionalProperties: false
        lastUpdated:
          oneOf:
          - type:
            - string
            - number
            - boolean
            - 'null'
          - type: object
            properties:
              $eq:
                type:
                - string
                - number
                - boolean
                - 'null'
              $ne:
                type:
                - string
                - number
                - boolean
                - 'null'
              $gt:
                type:
                - string
                - number
                - boolean
                - 'null'
              $lt:
                type:
                - string
                - number
                - boolean
                - 'null'
              $gte:
                type:
                - string
                - number
                - boolean
                - 'null'
              $lte:
                type:
                - string
                - number
                - boolean
                - 'null'
              $startsWith:
                type: string
                minLength: 1
              $endsWith:
                type: string
                minLength: 1
              $contains:
                type: string
                minLength: 1
              $ci:
                type: boolean
              $in:
                type: array
                maxItems: 100
                items:
                  type:
                  - string
                  - number
                  - boolean
              $nin:
                type: array
                maxItems: 100
                items:
                  type:
                  - string
                  - number
                  - boolean
            additionalProperties: false
        deletedAt:
          oneOf:
          - type:
            - string
            - number
            - boolean
            - 'null'
          - type: object
            properties:
              $eq:
                type:
                - string
                - number
                - boolean
                - 'null'
              $ne:
                type:
                - string
                - number
                - boolean
                - 'null'
              $gt:
                type:
                - string
                - number
                - boolean
                - 'null'
              $lt:
                type:
                - string
                - number
                - boolean
                - 'null'
              $gte:
                type:
                - string
                - number
                - boolean
                - 'null'
              $lte:
                type:
                - string
                - number
                - boolean
                - 'null'
              $startsWith:
                type: string
                minLength: 1
              $endsWith:
                type: string
                minLength: 1
              $contains:
                type: string
                minLength: 1
              $ci:
                type: boolean
              $in:
                type: array
                maxItems: 100
                items:
                  type:
                  - string
                  - number
                  - boolean
              $nin:
                type: array
                maxItems: 100
                items:
                  type:
                  - string
                  - number
                  - boolean
            additionalProperties: false
        name:
          oneOf:
          - type:
            - string
            - number
            - boolean
            - 'null'
          - type: object
            properties:
              $eq:
                type:
                - string
                - number
                - boolean
                - 'null'
              $ne:
                type:
                - string
                - number
                - boolean
                - 'null'
              $gt:
                type:
                - string
                - number
                - boolean
                - 'null'
              $lt:
                type:
                - string
                - number
                - boolean
                - 'null'
              $gte:
                type:
                - string
                - number
                - boolean
                - 'null'
              $lte:
                type:
                - string
                - number
                - boolean
                - 'null'
              $startsWith:
                type: string
                minLength: 1
              $endsWith:
                type: string
                minLength: 1
              $contains:
                type: string
                minLength: 1
              $ci:
                type: boolean
              $in:
                type: array
                maxItems: 100
                items:
                  type:
                  - string
                  - number
                  - boolean
              $nin:
                type: array
                maxItems: 100
                items:
                  type:
                  - string
                  - number
                  - boolean
            additionalProperties: false
        deviceClass:
          oneOf:
          - type:
            - string
            - number
            - boolean
