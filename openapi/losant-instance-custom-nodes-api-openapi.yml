        customNodeSupports:
          $ref: '#/components/schemas/instanceCustomNodePost/properties/customNodeSupports'
      additionalProperties:
        oneOf:
        - type: array
          maxItems: 0
        - type: string
          maxLength: 1024
        - type: boolean
      maxProperties: 25
