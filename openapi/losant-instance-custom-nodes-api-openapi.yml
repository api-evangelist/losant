openapi: 3.2.0
info:
  title: Platform Instance Custom Nodes API
  version: 1.31.0
  description: User API for accessing platform data
servers:
- url: https://api.losant.com
security:
- bearerAuth: []
tags:
- name: Instance Custom Nodes
paths:
  /instances/{instanceId}/nodes:
    get:
      operationId: instanceCustomNodes.get
      summary: Returns the Custom Nodes for an instance
      tags:
      - Instance Custom Nodes
      parameters:
      - name: instanceId
        in: path
        required: true
        description: ID associated with the instance
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec7417ae143cd83dc4a96
      - name: sortField
        in: query
        required: false
        description: Field to sort the results by
        schema:
          type: string
          enum:
          - name
          - id
          - creationDate
          - lastUpdated
          default: name
        example: name
      - name: sortDirection
        in: query
        required: false
        description: Direction to sort the results by
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        example: asc
      - name: page
        in: query
        required: false
        description: Which page of results to return
        schema:
          type: string
          default: 0
        example: 0
      - name: perPage
        in: query
        required: false
        description: How many items to return per page
        schema:
          type: string
          default: 100
        example: 10
      - name: filterField
        in: query
        required: false
        description: Field to filter the results by. Blank or not provided means no filtering.
        schema:
          type: string
          enum:
          - name
        example: key
      - name: filter
        in: query
        required: false
        description: Filter to apply against the filtered field. Supports globbing. Blank or not provided means no filtering.
        schema:
          type: string
        example: my*node
      responses:
        '200':
          description: Collection of Custom Nodes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/instanceCustomNodes'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - instanceCustomNodes.get
    post:
      operationId: instanceCustomNodes.post
      summary: Create a new Custom Node for an instance
      tags:
      - Instance Custom Nodes
      parameters:
      - name: instanceId
        in: path
        required: true
        description: ID associated with the instance
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec7417ae143cd83dc4a96
      responses:
        '201':
          description: The successfully created Custom Node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/instanceCustomNode'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/instanceCustomNodePost'
        description: Custom Node information
      x-losant-auth-scopes:
      - instanceCustomNodes.post
  /instances/{instanceId}/nodes/{instanceCustomNodeId}:
    get:
      operationId: instanceCustomNode.get
      summary: Retrieves information on a Custom Node
      tags:
      - Instance Custom Nodes
      parameters:
      - name: instanceId
        in: path
        required: true
        description: ID associated with the instance
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec7417ae143cd83dc4a96
      - name: instanceCustomNodeId
        in: path
        required: true
        description: ID associated with the Custom Node
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec7417ae143cd83dc4a95
      responses:
        '200':
          description: Custom Node information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/instanceCustomNode'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if Custom Node was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - instanceCustomNode.get
    patch:
      operationId: instanceCustomNode.patch
      summary: Updates information about a Custom Node
      tags:
      - Instance Custom Nodes
      parameters:
      - name: instanceId
        in: path
        required: true
        description: ID associated with the instance
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec7417ae143cd83dc4a96
      - name: instanceCustomNodeId
        in: path
        required: true
        description: ID associated with the Custom Node
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec7417ae143cd83dc4a95
      responses:
        '200':
          description: Updated Custom Node information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/instanceCustomNode'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if Custom Node was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/instanceCustomNodePatch'
        description: Object containing new properties of the Custom Node
      x-losant-auth-scopes:
      - instanceCustomNode.patch
    delete:
      operationId: instanceCustomNode.delete
      summary: Deletes a Custom Node
      tags:
      - Instance Custom Nodes
      parameters:
      - name: instanceId
        in: path
        required: true
        description: ID associated with the instance
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec7417ae143cd83dc4a96
      - name: instanceCustomNodeId
        in: path
        required: true
        description: ID associated with the Custom Node
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec7417ae143cd83dc4a95
      responses:
        '200':
          description: If Custom Node was successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if Custom Node was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - instanceCustomNode.delete
  /instances/{instanceId}/nodes/{instanceCustomNodeId}/errors:
    get:
      operationId: instanceCustomNode.errors
      summary: Get information about errors that occurred during runs of this Custom Node
      tags:
      - Instance Custom Nodes
      parameters:
      - name: instanceId
        in: path
        required: true
        description: ID associated with the instance
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec7417ae143cd83dc4a96
      - name: instanceCustomNodeId
        in: path
        required: true
        description: ID associated with the Custom Node
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec7417ae143cd83dc4a95
      - name: duration
        in: query
        required: false
        description: Duration of time range in milliseconds
        schema:
          type: string
          default: 86400000
        example: 86400000
      - name: end
        in: query
        required: false
        description: End of time range in milliseconds since epoch
        schema:
          type: string
          default: 0
        example: 0
      - name: limit
        in: query
        required: false
        description: Maximum number of errors to return
        schema:
          type: string
          default: 25
        example: 25
      - name: sortDirection
        in: query
        required: false
        description: Direction to sort the results by
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        example: desc
      responses:
        '200':
          description: Custom Node error information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/flowErrors'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if Custom Node was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - instanceCustomNode.errors
  /instances/{instanceId}/nodes/{instanceCustomNodeId}/stats:
    get:
      operationId: instanceCustomNode.stats
      summary: Get statistics about runs for this Custom Node
      tags:
      - Instance Custom Nodes
      parameters:
      - name: instanceId
        in: path
        required: true
        description: ID associated with the instance
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec7417ae143cd83dc4a96
      - name: instanceCustomNodeId
        in: path
        required: true
        description: ID associated with the Custom Node
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec7417ae143cd83dc4a95
      - name: duration
        in: query
        required: false
        description: Duration of time range in milliseconds
        schema:
          type: string
          default: 86400000
        example: 86400000
      - name: end
        in: query
        required: false
        description: End of time range in milliseconds since epoch
        schema:
          type: string
          default: 0
        example: 0
      - name: resolution
        in: query
        required: false
        description: Resolution in milliseconds
        schema:
          type: string
          default: 3600000
        example: 3600000
      responses:
        '200':
          description: Statistics for Custom Node runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/flowStats'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if Custom Node was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - instanceCustomNode.stats
components:
  schemas:
    instanceCustomNodePost:
      title: Instance Custom Node Post
      description: Schema for the body of an Instance Custom Node creation request
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 32767
        shortDescription:
          type: string
          maxLength: 1024
        iconData:
          $ref: '#/components/schemas/flowPost/properties/iconData'
        docsUrl:
          type: string
          maxLength: 1024
        category:
          $ref: '#/components/schemas/flowPost/properties/category'
        minimumAgentVersion:
          type: string
          pattern: ^(0|([1-9]\d*))\.(0|([1-9]\d*))\.(0|([1-9]\d*))$
        triggers:
          type: array
          items:
            type: object
            discriminator:
              propertyName: type
            oneOf:
            - type: object
              properties:
                key:
                  type: string
                  maxLength: 1024
                type:
                  type: string
                  enum:
                  - customNodeStart
                  - deviceCreate
                  - deviceCommand
                  - deviceIdConnect
                  - deviceTagConnect
                  - deviceIdDisconnect
                  - deviceTagDisconnect
                  - inboundEmail
                  - notebook
                  - onBoot
                  - onConnect
                  - onDisconnect
                  - resourceJobComplete
                  - resourceJobIteration
                  - resourceJobIterationTimeout
                  - udp
                  - webhook
                config:
                  type: object
                  additionalProperties: false
                meta:
                  type: object
                  properties:
                    category:
                      type: string
                      enum:
                      - trigger
                    name:
                      type: string
                      enum:
                      - customNodeStart
                      - deviceCreate
                      - deviceCommand
                      - deviceIdsTagsConnect
                      - deviceIdsTagsDisconnect
                      - eeaInit
                      - flowError
                      - inboundEmail
                      - notebook
                      - onBoot
                      - onConnect
                      - onDisconnect
                      - resourceJobComplete
                      - resourceJobIteration
                      - resourceJobIterationTimeout
                      - udp
                      - webhook
                    label:
                      type: string
                      minLength: 1
                      maxLength: 255
                    x:
                      type: number
                    y:
                      type: number
                    uiId:
                      type: string
                      maxLength: 48
                    description:
                      type: string
                      maxLength: 32767
                    icon:
                      type: string
                      maxLength: 1024
                    color:
                      type: string
                      maxLength: 1024
                    inputCount:
                      type: number
                    outputCount:
                      type: number
                    triggerId:
                      type: string
                      maxLength: 48
                    id:
                      type: string
                      maxLength: 48
                  additionalProperties: false
                  required:
                  - category
                  - name
                outputIds:
                  type: array
                  items:
                    type: array
                    items:
                      type: string
                      maxLength: 48
                      minLength: 1
                    maxItems: 100
                  maxItems: 100
              required:
              - type
              - meta
              additionalProperties: false
            - type: object
              properties:
                key:
                  type: string
                  maxLength: 1024
                type:
                  type: string
                  enum:
                  - virtualButton
                config:
                  type: object
                  additionalProperties: false
                meta:
                  type: object
                  properties:
                    category:
                      type: string
                      enum:
                      - trigger
                    name:
                      type: string
                      enum:
                      - virtualButton
                    label:
                      type: string
                      minLength: 1
                      maxLength: 255
                    x:
                      type: number
                    y:
                      type: number
                    uiId:
                      type: string
                      maxLength: 48
                    groupId:
                      type: string
                      maxLength: 48
                    description:
                      type: string
                      maxLength: 32767
                    icon:
                      type: string
                      maxLength: 1024
                    color:
                      type: string
                      maxLength: 1024
                    inputCount:
                      type: number
                    outputCount:
                      type: number
                    id:
                      type: string
                      maxLength: 48
                    payload:
                      type: string
                      maxLength: 262144
                    deviceId:
                      oneOf:
                      - type: string
                        pattern: ^[A-Fa-f\d]{24}$
                      - type: string
                        enum:
                        - ''
                      - type: 'null'
                  additionalProperties: false
                  required:
                  - category
                  - name
                outputIds:
                  type: array
                  items:
                    type: array
                    items:
                      type: string
                      maxLength: 48
                      minLength: 1
                    maxItems: 100
                  maxItems: 100
              required:
              - type
              - meta
              additionalProperties: false
        nodes:
          $ref: '#/components/schemas/flow/properties/nodes'
        customNodeConfig:
          $ref: '#/components/schemas/flow/properties/customNodeConfig'
        customNodeSupports:
          type: array
          maxItems: 1
          items:
            type: string
            enum:
            - cloud
            - edge
      additionalProperties:
        oneOf:
        - type: array
          maxItems: 0
        - type: string
          maxLength: 1024
        - type: boolean
      maxProperties: 25
      required:
      - name
      - triggers
      - nodes
    instanceCustomNodePatch:
      title: Instance Custom Node Patch
      description: Schema for the body of an Instance Custom Node modification request
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
