        userTags:
          type: object
          patternProperties:
            ^[0-9a-zA-Z_-]{1,255}$:
              type: string
              minLength: 1
              maxLength: 255
          additionalProperties: false
        experienceGroups:
          type: array
          items:
            type: object
            properties:
              name:
