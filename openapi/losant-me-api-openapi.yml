openapi: 3.2.0
info:
  title: Platform Me API
  version: 1.31.0
  description: User API for accessing platform data
servers:
- url: https://api.losant.com
security:
- bearerAuth: []
tags:
- name: Me
paths:
  /me:
    get:
      operationId: me.get
      summary: Retrieves information on the current user
      tags:
      - Me
      parameters:
      - name: includeRecent
        in: query
        required: false
        description: Should the user include recent app/dashboard info
        schema:
          type: string
        example: true
      - name: summaryExclude
        in: query
        required: false
        description: Comma-separated list of summary fields to exclude from user summary
        schema:
          type: string
        example: payloadCount
      - name: summaryInclude
        in: query
        required: false
        description: Comma-separated list of summary fields to include in user summary
        schema:
          type: string
        example: payloadCount
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/me'
      x-losant-auth-scopes:
      - me.get
    patch:
      operationId: me.patch
      summary: Updates information about the current user
      tags:
      - Me
      parameters:
      - name: includeRecent
        in: query
        required: false
        description: Should the user include recent app/dashboard info
        schema:
          type: string
        example: true
      - name: summaryExclude
        in: query
        required: false
        description: Comma-separated list of summary fields to exclude from user summary
        schema:
          type: string
        example: payloadCount
      - name: summaryInclude
        in: query
        required: false
        description: Comma-separated list of summary fields to include in user summary
        schema:
          type: string
        example: payloadCount
      responses:
        '200':
          description: Updated user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/me'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/mePatch'
        description: Object containing new user properties
      x-losant-auth-scopes:
      - me.patch
  /me/changePassword:
    patch:
      operationId: me.changePassword
      summary: Changes the current user's password and optionally logs out all other sessions
      tags:
      - Me
      parameters: []
      responses:
        '200':
          description: A new, valid, auth token (potentially all previous tokens are now invalid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authedUser'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/changePassword'
        description: Object containing the password change info
      x-losant-auth-scopes:
      - me.changePassword
  /me/delete:
    post:
      operationId: me.delete
      summary: Deletes the current user
      tags:
      - Me
      parameters: []
      responses:
        '200':
          description: If the user was successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/userCredentials'
        description: User authentication credentials
      x-losant-auth-scopes:
      - me.delete
  /me/deviceCounts:
    get:
      operationId: me.deviceCounts
      summary: Returns device counts by day for the time range specified for all applications…
      tags:
      - Me
      parameters:
      - name: start
        in: query
        required: false
        description: Start of range for device count query (ms since epoch)
        schema:
          type: string
        example: 0
      - name: end
        in: query
        required: false
        description: End of range for device count query (ms since epoch)
        schema:
          type: string
        example: 1465790400000
      responses:
        '200':
          description: Device counts by day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deviceCounts'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - me.deviceCounts
  /me/disableTwoFactorAuth:
    patch:
      operationId: me.disableTwoFactorAuth
      summary: Disables multi-factor authentication for the current user
      tags:
      - Me
      parameters:
      - name: includeRecent
        in: query
        required: false
        description: Should the user include recent app/dashboard info
        schema:
          type: string
        example: true
      - name: summaryExclude
        in: query
        required: false
        description: Comma-separated list of summary fields to exclude from user summary
        schema:
          type: string
        example: payloadCount
      - name: summaryInclude
        in: query
        required: false
        description: Comma-separated list of summary fields to include in user summary
        schema:
          type: string
        example: payloadCount
      responses:
        '200':
          description: Updated user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/me'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/multiFactorAuthDisable'
        description: Object containing multi-factor authentication properties
      x-losant-auth-scopes:
      - me.disableTwoFactorAuth
  /me/disconnectGithub:
    patch:
      operationId: me.disconnectGithub
      summary: Disconnects the user from GitHub
      tags:
      - Me
      parameters:
      - name: includeRecent
        in: query
        required: false
        description: Should the user include recent app/dashboard info
        schema:
          type: string
        example: true
      - name: summaryExclude
        in: query
        required: false
        description: Comma-separated list of summary fields to exclude from user summary
        schema:
          type: string
        example: payloadCount
      - name: summaryInclude
        in: query
        required: false
        description: Comma-separated list of summary fields to include in user summary
        schema:
          type: string
        example: payloadCount
      responses:
        '200':
          description: Updated user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/me'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - me.disconnectGithub
  /me/enableTwoFactorAuth:
    patch:
      operationId: me.enableTwoFactorAuth
      summary: Enables multi-factor authentication for the current user
      tags:
      - Me
      parameters:
      - name: includeRecent
        in: query
        required: false
        description: Should the user include recent app/dashboard info
        schema:
          type: string
        example: true
      - name: summaryExclude
        in: query
        required: false
        description: Comma-separated list of summary fields to exclude from user summary
        schema:
          type: string
        example: payloadCount
      - name: summaryInclude
        in: query
        required: false
        description: Comma-separated list of summary fields to include in user summary
        schema:
          type: string
        example: payloadCount
      responses:
        '200':
          description: Updated user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/me'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/multiFactorAuthEnable'
        description: Object containing multi-factor authentication properties
      x-losant-auth-scopes:
      - me.enableTwoFactorAuth
  /me/generateTwoFactorAuth:
    patch:
      operationId: me.generateTwoFactorAuth
      summary: Returns the multi-factor authentication key for the current user
      tags:
      - Me
      parameters: []
      responses:
        '200':
          description: Multi-factor authentication info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/multiFactorAuthInfo'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - me.generateTwoFactorAuth
  /me/invites:
    get:
      operationId: me.invites
      summary: Retrieves pending organization invitations for a user
      tags:
      - Me
      parameters: []
      responses:
        '200':
          description: Information about invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orgInvitesUser'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - me.invites
  /me/invites/{inviteId}:
    get:
      operationId: me.invite
      summary: Retrieves information for an invitation to an organization
      tags:
      - Me
      parameters:
      - name: inviteId
        in: path
        required: true
        description: ID associated with the invitation
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '200':
          description: Information about invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orgInviteUser'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if invite not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - me.invite
    post:
      operationId: me.respondToInvite
      summary: Accepts or rejects an invitation to an organization
      tags:
      - Me
      parameters:
      - name: inviteId
        in: path
        required: true
        description: ID associated with the invitation
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '200':
          description: Acceptance or rejection of invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orgInviteResultUser'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if invitation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '410':
          description: Error if invitation has expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orgInviteActionUser'
        description: Response to invitation
      x-losant-auth-scopes:
      - me.respondToInvite
  /me/notebookMinuteCounts:
    get:
      operationId: me.notebookMinuteCounts
      summary: Returns notebook execution usage by day for the time range specified for all…
      tags:
      - Me
      parameters:
      - name: start
        in: query
        required: false
        description: Start of range for notebook execution query (ms since epoch)
        schema:
          type: string
        example: 0
      - name: end
        in: query
        required: false
        description: End of range for notebook execution query (ms since epoch)
        schema:
          type: string
        example: 1465790400000
      responses:
        '200':
          description: Notebook usage information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notebookMinuteCounts'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - me.notebookMinuteCounts
  /me/payloadCounts:
    get:
      operationId: me.payloadCounts
      summary: Returns payload counts for the time range specified for all applications the…
      tags:
      - Me
      parameters:
      - name: start
        in: query
        required: false
        description: Start of range for payload count query (ms since epoch)
        schema:
          type: string
        example: 0
      - name: end
        in: query
        required: false
        description: End of range for payload count query (ms since epoch)
        schema:
          type: string
        example: 1465790400000
      - name: asBytes
        in: query
        required: false
        description: If the resulting stats should be returned as bytes
        schema:
          type: string
          default: false
        example: true
      responses:
        '200':
          description: Payload counts, by type and source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payloadStats'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - me.payloadCounts
  /me/payloadCountsBreakdown:
    get:
      operationId: me.payloadCountsBreakdown
      summary: Returns payload counts per resolution in the time range specified for all…
      tags:
      - Me
      parameters:
      - name: start
        in: query
        required: false
        description: Start of range for payload count query (ms since epoch)
        schema:
          type: string
        example: 0
      - name: end
        in: query
        required: false
        description: End of range for payload count query (ms since epoch)
        schema:
          type: string
        example: 1465790400000
      - name: resolution
        in: query
        required: false
        description: Resolution in milliseconds
        schema:
          type: string
          enum:
          - '86400000'
          - '3600000'
          default: 86400000
        example: 86400000
      - name: asBytes
        in: query
        required: false
        description: If the resulting stats should be returned as bytes
        schema:
          type: string
          default: false
        example: true
      - name: includeNonBillable
        in: query
        required: false
        description: If non-billable payloads should be included in the result
        schema:
          type: string
          default: false
        example: true
      responses:
        '200':
          description: Sum of payload counts by date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payloadCountsBreakdown'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - me.payloadCountsBreakdown
  /me/recentItems:
    post:
      operationId: me.addRecentItem
      summary: Adds an item to a recent item list
      tags:
      - Me
      parameters: []
      responses:
        '200':
          description: Updated recent item list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/recentItemList'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/recentItem'
        description: Object containing recent item info
      x-losant-auth-scopes:
      - me.addRecentItem
    get:
      operationId: me.fetchRecentItems
      summary: Gets a recent item list
      tags:
      - Me
      parameters:
      - name: parentId
        in: query
        required: false
        description: Parent id of the recent list
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: itemType
        in: query
        required: true
        description: Item type to get the recent list of
        schema:
          enum:
          - application
          - device
          - flow
          - dashboard
          - organization
        example: application
      responses:
        '200':
          description: Recent item list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/recentItemList'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - me.fetchRecentItems
  /me/refreshToken:
    get:
      operationId: me.refreshToken
      summary: Returns a new auth token based on the current auth token
      tags:
      - Me
      parameters: []
      responses:
        '200':
          description: Successful token regeneration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authedUser'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Unauthorized error if authentication fails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - me.refreshToken
  /me/transferResources:
    patch:
      operationId: me.transferResources
      summary: Moves resources to a new owner
      tags:
      - Me
      parameters: []
      responses:
        '200':
          description: If resource transfer was successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/resourceTransfer'
        description: Object containing properties of the transfer
      x-losant-auth-scopes:
      - me.transferResources
  /me/verify-email:
    post:
      operationId: me.verifyEmail
      summary: Sends an email verification to the user
      tags:
      - Me
      parameters: []
      responses:
        '200':
          description: If email verification was successfully sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - me.verifyEmail
components:
  schemas:
    mePatch:
      title: Me Patch
      description: Schema for the body of request to modify the current user
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 1024
        firstName:
          type: string
          minLength: 1
          maxLength: 1024
        lastName:
          type: string
          maxLength: 1024
        companyName:
          type: string
          maxLength: 1024
        title:
          type: string
          maxLength: 1024
        phoneNumber:
          type: string
          maxLength: 1024
        location:
          type: string
          maxLength: 1024
        url:
          type: string
          maxLength: 1024
        state:
          type: string
          maxLength: 1024
        country:
          type: string
          minLength: 1
          maxLength: 1024
        password:
          type: string
          minLength: 12
          maxLength: 2048
          pattern: ^(?=.*[A-Z])(?=.*[^A-Za-z0-9])(?=.*[0-9])(?=.*[a-z]).{12,}$
        tokenCutoff:
          type: string
          format: date-time
        currentCredentials:
          type: object
          properties:
            twoFactorCode:
              type: string
              maxLength: 2048
            password:
              type: string
              minLength: 8
              maxLength: 2048
          required:
          - password
          additionalProperties: false
      additionalProperties: false
    userCredentials:
      title: User Credentials
      description: Schema for the body of a User authentication request
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 1024
        password:
          type: string
          minLength: 8
          maxLength: 2048
        twoFactorCode:
          type: string
          maxLength: 2048
        requestedScopes:
          type: array
          uniqueItems: true
          items:
            oneOf:
            - oneOf:
              - type: string
                enum:
                - all.Application
                - all.Application.bounded
                - all.Application.read
                - all.Application.cli
                - all.Device
                - all.Device.read
                - application.*
                - applicationApiToken.*
                - applicationApiTokens.*
                - applicationCertificate.*
                - applicationCertificates.*
                - applicationCertificateAuthority.*
                - applicationCertificateAuthorities.*
                - applicationDashboards.*
                - applicationDashboard.*
                - applicationJobLogs.*
                - applicationJobLog.*
                - applicationKey.*
                - applicationKeys.*
                - credential.*
                - credentials.*
                - data.*
                - dataTable.*
                - dataTables.*
                - dataTableRow.*
                - dataTableRows.*
                - device.*
                - deviceRecipe.*
                - deviceRecipes.*
                - devices.*
                - deviceAttribute.*
                - deviceAttributes.*
                - edgeDeployment.*
                - edgeDeployments.*
                - embeddedDeployment.*
                - embeddedDeployments.*
                - event.*
                - events.*
                - experience.*
                - experienceDomain.*
                - experienceDomains.*
                - experienceEndpoint.*
                - experienceEndpoints.*
                - experienceGroup.*
                - experienceGroups.*
                - experienceSlug.*
                - experienceSlugs.*
                - experienceUser.*
                - experienceUsers.*
                - experienceVersion.*
                - experienceVersions.*
                - experienceView.*
                - experienceViews.*
                - integration.*
                - integrations.*
                - file.*
                - files.*
                - flow.*
                - flows.*
                - flowVersion.*
                - flowVersions.*
                - notebook.*
                - notebooks.*
                - privateFile.*
                - privateFiles.*
                - resourceJobs.*
                - resourceJob.*
                - webhook.*
                - webhooks.*
                - application.applyTemplate
                - application.archiveData
                - application.backfillArchiveData
                - application.clone
                - application.export
                - application.import
                - application.fullEventsArchive
                - application.fullDataTablesArchive
                - application.debug
                - application.delete
                - application.get
                - application.mqttPublishMessage
                - application.mqttSubscriptionStream
                - application.patch
                - application.payloadCounts
                - application.payloadCountsBreakdown
                - application.deviceCounts
                - application.notebookMinuteCounts
                - application.search
                - application.importLogs
                - applicationApiToken.delete
                - applicationApiToken.get
                - applicationApiToken.patch
                - applicationApiTokens.get
