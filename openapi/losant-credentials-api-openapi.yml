openapi: 3.2.0
info:
  title: Platform Credentials API
  version: 1.31.0
  description: User API for accessing platform data
servers:
- url: https://api.losant.com
security:
- bearerAuth: []
tags:
- name: Credentials
paths:
  /applications/{applicationId}/credentials:
    get:
      operationId: credentials.get
      summary: Returns a collection of credentials for an application
      tags:
      - Credentials
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: sortField
        in: query
        required: false
        description: Field to sort the results by
        schema:
          type: string
          enum:
          - name
          - type
          - creationDate
          - lastUpdated
          default: creationDate
        example: creationDate
      - name: sortDirection
        in: query
        required: false
        description: Direction to sort the results by
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        example: asc
      - name: page
        in: query
        required: false
        description: Which page of results to return
        schema:
          type: string
          default: 0
        example: 0
      - name: perPage
        in: query
        required: false
        description: How many items to return per page
        schema:
          type: string
          default: 100
        example: 10
      - name: filterField
        in: query
        required: false
        description: Field to filter the results by. Blank or not provided means no filtering.
        schema:
          type: string
          enum:
          - name
          - type
        example: type
      - name: filter
        in: query
        required: false
        description: Filter to apply against the filtered field. Supports globbing. Blank or not provided means no filtering.
        schema:
          type: string
        example: aws
      responses:
        '200':
          description: Collection of credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/credentials'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - credentials.get
    post:
      operationId: credentials.post
      summary: Create a new credential for an application
      tags:
      - Credentials
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '201':
          description: Successfully created credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/credential'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/credentialPost'
        description: Credential information
      x-losant-auth-scopes:
      - credentials.post
  /applications/{applicationId}/credentials/{credentialId}:
    get:
      operationId: credential.get
      summary: Retrieves information on a credential
      tags:
      - Credentials
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: credentialId
        in: path
        required: true
        description: ID associated with the credential
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec76c7ae143cd83dc4a96
      responses:
        '200':
          description: credential information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/credential'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if credential was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - credential.get
    patch:
      operationId: credential.patch
      summary: Updates information about a credential
      tags:
      - Credentials
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: credentialId
        in: path
        required: true
        description: ID associated with the credential
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec76c7ae143cd83dc4a96
      responses:
        '200':
          description: Updated credential information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/credential'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if credential was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/credentialPatch'
        description: Object containing new properties of the credential
      x-losant-auth-scopes:
      - credential.patch
    delete:
      operationId: credential.delete
      summary: Deletes a credential
      tags:
      - Credentials
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: credentialId
        in: path
        required: true
        description: ID associated with the credential
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec76c7ae143cd83dc4a96
      responses:
        '200':
          description: If credential was successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if credential was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - credential.delete
  /applications/{applicationId}/credentials/{credentialId}/linkedResources:
    get:
      operationId: credential.linkedResources
      summary: Retrieves information on resources linked to a credential
      tags:
      - Credentials
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: credentialId
        in: path
        required: true
        description: ID associated with the credential
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec76c7ae143cd83dc4a96
      - name: includeCustomNodes
        in: query
        required: false
        description: If the result of the request should also include the details of any custom nodes referenced by returned workflows
        schema:
          type: string
          default: false
        example: true
      responses:
        '200':
          description: Linked resource information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/credentialLinkedResources'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if credential was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - credential.linkedResources
components:
  schemas:
    flowVersions:
      title: Workflow Versions
      description: Schema for a collection of Workflow Versions
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/flowVersion'
        count:
          type: integer
        totalCount:
          type: integer
        perPage:
          type: integer
        page:
          type: integer
        filter:
          type: string
        filterField:
          type: string
        sortField:
          type: string
        sortDirection:
          type: string
          enum:
          - asc
          - desc
          - ASC
          - DESC
          - ''
        applicationId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        flowId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        version:
          type: string
          minLength: 1
          maxLength: 255
        flowClass:
          type: string
          enum:
          - cloud
          - edge
          - embedded
          - experience
          - customNode
        customNodes:
          type: array
          items:
            $ref: '#/components/schemas/flow'
        customNodeVersions:
          type: array
          items:
            $ref: '#/components/schemas/flowVersion'
    error:
      title: Error
      description: Schema for errors returned by the API
      type: object
      properties:
        type:
          type: string
        message:
          type: string
        validationErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              validationMessage:
                type: string
    flow:
      title: Workflow
      description: Schema for a single Workflow
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        flowId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        applicationId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        creationDate:
          type: string
          format: date-time
        lastUpdated:
          type: string
          format: date-time
        createdById:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        createdByType:
          type: string
          enum:
          - flow
          - user
          - apiToken
        lastUpdatedById:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        lastUpdatedByType:
          type: string
          enum:
          - flow
          - user
          - apiToken
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 32767
        shortDescription:
          type: string
          maxLength: 1024
        iconData:
          type: string
          maxLength: 32767
          pattern: ^data:image/(jpg|jpeg|png|svg\+xml);base64,[0-9a-zA-Z+/=]*$
        docsUrl:
          type: string
          maxLength: 1024
        category:
          type: string
          enum:
          - data
          - experience
          - logic
          - output
          - debug
        enabled:
          type: boolean
        defaultVersionId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        minimumAgentVersion:
          type: string
          pattern: ^(0|([1-9]\d*))\.(0|([1-9]\d*))\.(0|([1-9]\d*))$
        flowClass:
          type: string
          enum:
          - cloud
          - edge
          - embedded
          - experience
          - customNode
        triggers:
          type: array
          items:
            type: object
            discriminator:
              propertyName: type
            oneOf:
            - type: object
              properties:
                key:
                  type: string
                  maxLength: 1024
                type:
                  type: string
                  enum:
                  - appFile
                config:
                  type: object
                  properties:
                    delete:
                      type: boolean
                    create:
                      type: boolean
                    update:
                      type: boolean
                    public:
                      type: boolean
                    private:
                      type: boolean
                  additionalProperties: false
                meta:
                  type: object
                  properties:
                    category:
                      type: string
                      enum:
                      - trigger
                    name:
                      type: string
                      enum:
                      - appFile
                    label:
                      type: string
                      minLength: 1
                      maxLength: 255
                    x:
                      type: number
                    y:
                      type: number
                    uiId:
                      type: string
                      maxLength: 48
                    description:
                      type: string
                      maxLength: 32767
                    icon:
                      type: string
                      maxLength: 1024
                    color:
                      type: string
                      maxLength: 1024
                    inputCount:
                      type: number
                    outputCount:
                      type: number
                    id:
                      type: string
                      maxLength: 48
                  additionalProperties: false
                  required:
                  - category
                  - name
                outputIds:
                  type: array
                  items:
                    type: array
                    items:
                      type: string
                      maxLength: 48
                      minLength: 1
                    maxItems: 100
                  maxItems: 100
              required:
