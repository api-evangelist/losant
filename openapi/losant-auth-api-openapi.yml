openapi: 3.2.0
info:
  title: Platform Auth API
  version: 1.31.0
  description: User API for accessing platform data
servers:
- url: https://api.losant.com
security:
- bearerAuth: []
tags:
- name: Auth
paths:
  /auth/device:
    post:
      operationId: auth.authenticateDevice
      summary: auth authenticateDevice
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: Successful authentication. The included api access token by default has the scope 'all.Device'.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authedDevice'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Unauthorized error if authentication fails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      description: Authenticates a device using the provided credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/deviceCredentials'
        description: Device authentication credentials
  /auth/ssoDomain:
    get:
      operationId: auth.ssoDomain
      summary: auth ssoDomain
      tags:
      - Auth
      parameters:
      - name: email
        in: query
        required: true
        description: The email address associated with the user login
        schema:
          type: string
        example: example@example.com
      responses:
        '200':
          description: Successful finding SSO for domain. Returns SSO request URL and type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ssoRequest'
        '204':
          description: No domain associated with an SSO configuration
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      description: Checks email domain for SSO configuration.
  /auth/user:
    post:
      operationId: auth.authenticateUser
      summary: auth authenticateUser
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: Successful authentication. The included api access token has the scope 'all.User'.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authedUser'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Unauthorized error if authentication fails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      description: Authenticates a user using the provided credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/userCredentials'
        description: User authentication credentials
  /auth/user/github:
    post:
      operationId: auth.authenticateUserGithub
      summary: auth authenticateUserGithub
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: Successful authentication. The included api access token has the scope 'all.User'.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authedUser'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Unauthorized error if authentication fails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      description: Authenticates a user via GitHub OAuth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/githubLogin'
        description: User authentication credentials (access token)
  /auth/user/saml:
    post:
      operationId: auth.authenticateUserSaml
      summary: auth authenticateUserSaml
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: Successful authentication. The included api access token has the scope 'all.User'.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authedUser'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Unauthorized error if authentication fails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      description: Authenticates a user via a SAML response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/samlResponse'
        description: Encoded SAML response from an IDP for a user.
components:
  schemas:
    error:
      title: Error
      description: Schema for errors returned by the API
      type: object
      properties:
        type:
          type: string
        message:
          type: string
        validationErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              validationMessage:
                type: string
    deviceCredentials:
      title: Device Credentials
      description: Schema for the body of a device authentication request
      type: object
      properties:
        deviceId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        key:
          type: string
        secret:
          type: string
        tokenTTL:
          type: integer
          minimum: 0
        requestedScopes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - all.Device
            - all.Device.read
            - data.export
            - data.timeSeriesQuery
            - data.lastValueQuery
            - device.commandStream
