openapi: 3.2.0
info:
  title: Platform Application Templates API
  version: 1.31.0
  description: User API for accessing platform data
servers:
- url: https://api.losant.com
security:
- bearerAuth: []
tags:
- name: Application Templates
paths:
  /applicationTemplates:
    get:
      operationId: applicationTemplates.get
      summary: Returns the application templates the current user has permission to see
      tags:
      - Application Templates
      parameters:
      - name: sortField
        in: query
        required: false
        description: Field to sort the results by
        schema:
          type: string
          enum:
          - name
          - id
          - creationDate
          - lastUpdated
          default: name
        example: name
      - name: sortDirection
        in: query
        required: false
        description: Direction to sort the results by
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        example: asc
      - name: page
        in: query
        required: false
        description: Which page of results to return
        schema:
          type: string
          default: 0
        example: 0
      - name: perPage
        in: query
        required: false
        description: How many items to return per page
        schema:
          type: string
          default: 100
        example: 10
      - name: filterField
        in: query
        required: false
        description: Field to filter the results by. Blank or not provided means no filtering.
        schema:
          type: string
          enum:
          - name
          - authorName
        example: name
      - name: filter
        in: query
        required: false
        description: Filter to apply against the filtered field. Supports globbing. Blank or not provided means no filtering.
        schema:
          type: string
        example: my * app
      - name: keywords
        in: query
        required: false
        description: List of keywords to filter by. Matches all provided keywords.
        schema:
          type: array
        example:
        - gps
        - aws
      - name: categoryId
        in: query
        required: false
        description: ID of a category to filter by.
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec76c7ae143cd83dc4a96
      responses:
        '200':
          description: Collection of application templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationTemplates'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - applicationTemplates.get
  /applicationTemplates/categories:
    get:
      operationId: applicationTemplates.getCategories
      summary: Returns a category list, beginning at the specified category
      tags:
      - Application Templates
      parameters:
      - name: baseId
        in: query
        required: false
        description: ID of the category to begin from
        schema:
          type: string
        example: 575ed6e87ae143cd83dc4aa8
      responses:
        '200':
          description: Collection of application categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationTemplateCategories'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - applicationTemplates.getCategories
  /applicationTemplates/keywords:
    get:
      operationId: applicationTemplates.getUniqueKeywords
      summary: Returns an array of all unique keywords currently in use by templates
      tags:
      - Application Templates
      parameters: []
      responses:
        '200':
          description: Array of all unique template keywords
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/templateKeywords'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - applicationTemplates.getUniqueKeywords
  /applicationTemplates/{templateId}:
    get:
      operationId: applicationTemplate.get
      summary: Retrieves information on an application template
      tags:
      - Application Templates
      parameters:
      - name: templateId
        in: path
        required: true
        description: ID associated with the template
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed0de7ae143cd83dc4aa5
      responses:
        '200':
          description: Application template information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationTemplate'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if template was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - applicationTemplate.get
components:
  schemas:
    error:
      title: Error
      description: Schema for errors returned by the API
      type: object
      properties:
        type:
          type: string
        message:
          type: string
        validationErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              validationMessage:
                type: string
    applicationTemplateCategories:
      title: Application Template Categories
      description: Schema for a collection of Application Template Categories
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/applicationTemplateCategory'
        baseId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        count:
          type: integer
        totalCount:
          type: integer
    templateKeywords:
      title: Template Keywords
      description: Schema for a collection of template keywords
      type: object
      properties:
        keywords:
          type: array
          items:
            type: string
            pattern: ^[0-9a-zA-Z_-]{1,255}$
          maxItems: 100
      additionalProperties: false
    applicationTemplates:
      title: Application Templates
      description: Schema for a collection of Application Templates
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/applicationTemplate'
        count:
          type: integer
        totalCount:
          type: integer
        perPage:
          type: integer
        page:
          type: integer
        filter:
          type: string
        filterField:
          type: string
        categoryId:
          oneOf:
          - type: string
            pattern: ^[A-Fa-f\d]{24}$
          - type: 'null'
        keywords:
          type: array
          items:
            type: string
            pattern: ^[0-9a-zA-Z_-]{1,255}$
          maxItems: 100
        sortField:
          type: string
        sortDirection:
          type: string
          enum:
          - asc
          - desc
          - ASC
          - DESC
          - ''
    applicationTemplate:
      title: Application Template
      description: Schema for a single Application Template
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        templateId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        creationDate:
          type: string
          format: date-time
        lastUpdated:
          type: string
          format: date-time
        name:
          type: string
          minLength: 1
          maxLength: 255
        readme:
          type: string
          maxLength: 131072
        categoryIds:
          type: array
          items:
            type: string
            pattern: ^[A-Fa-f\d]{24}$
          maxItems: 1000
        keywords:
          type: array
          items:
            type: string
            pattern: ^[0-9a-zA-Z_-]{1,255}$
          maxItems: 100
        description:
          type: string
          maxLength: 1024
        public:
          type: boolean
        authorName:
          type: string
          maxLength: 255
        imageUrl:
          type: string
          maxLength: 1024
        authorUrl:
          type: string
          maxLength: 1024
        templateUrl:
          type: string
          maxLength: 1024
        summary:
          type: object
          properties:
            applicationCertificateAuthorityCount:
              type: integer
            dashboardCount:
              type: integer
            deviceCount:
              type: integer
            deviceRecipeCount:
              type: integer
            dataTableCount:
              type: integer
            experienceGroupCount:
              type: integer
            experienceUserCount:
              type: integer
            experienceVersionCount:
              type: integer
            experienceViewCount:
              type: integer
            experienceEndpointCount:
              type: integer
            fileCount:
              type: integer
            flowCount:
              type: integer
            integrationCount:
              type: integer
            notebookCount:
              type: integer
            privateFileCount:
              type: integer
            resourceJobCount:
              type: integer
            dataTableCsvSize:
              type: integer
            webhookCount:
              type: integer
    applicationTemplateCategory:
      title: Application Template Category
      description: Schema for a single Application Template Category
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        parentId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 32767
        resourceTypes:
          type: array
          items:
            type: string
            enum:
            - DeviceRecipe
            - CustomNode
          maxItems: 100
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
x-derived-from:
  format: bravado 1.0
  by: all/0-working/bravado-to-openapi.py (roadmap#799)
  note: 'every action keeps its own path: resource.path + action.path'
