openapi: 3.2.0
info:
  title: Platform Experience Endpoints API
  version: 1.31.0
  description: User API for accessing platform data
servers:
- url: https://api.losant.com
security:
- bearerAuth: []
tags:
- name: Experience Endpoints
paths:
  /applications/{applicationId}/experience/endpoints:
    get:
      operationId: experienceEndpoints.get
      summary: Returns the experience endpoints for an application
      tags:
      - Experience Endpoints
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: sortField
        in: query
        required: false
        description: Field to sort the results by
        schema:
          type: string
          enum:
          - order
          - method
          - route
          - id
          - creationDate
          - requestCount
          - lastUpdated
          default: order
        example: order
      - name: sortDirection
        in: query
        required: false
        description: Direction to sort the results by
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        example: asc
      - name: filterField
        in: query
        required: false
        description: Field to filter the results by. Blank or not provided means no filtering.
        schema:
          type: string
          enum:
          - method
          - route
        example: method
      - name: filter
        in: query
        required: false
        description: Filter to apply against the filtered field. Supports globbing. Blank or not provided means no filtering.
        schema:
          type: string
        example: my*route
      - name: experienceGroupId
        in: query
        required: false
        description: Filter endpoints to those only in the specified group
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: requestCountDuration
        in: query
        required: false
        description: If set, a count of recent requests is included on each endpoint for the duration requested (milliseconds)
        schema:
          type: string
        example: 86400000
      - name: version
        in: query
        required: false
        description: Return the experience endpoints belonging to this version
        schema:
          type: string
          default: develop
        example: develop
      responses:
        '200':
          description: Collection of experience endpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/experienceEndpoints'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - experienceEndpoints.get
    post:
      operationId: experienceEndpoints.post
      summary: Create a new experience endpoint for an application
      tags:
      - Experience Endpoints
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '201':
          description: Successfully created experience endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/experienceEndpoint'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/experienceEndpointPost'
        description: New experience endpoint information
      x-losant-auth-scopes:
      - experienceEndpoints.post
  /applications/{applicationId}/experience/endpoints/stats:
    get:
      operationId: experienceEndpoints.stats
      summary: Get statistics about endpoint requests
      tags:
      - Experience Endpoints
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: statGrouping
        in: query
        required: false
        description: Field to group the statistics by
        schema:
          type: string
          enum:
          - statusCode
          - endpointId
          - version
          - domain
          default: statusCode
        example: statusCode
      - name: duration
        in: query
        required: false
        description: Duration in milliseconds
        schema:
          type: string
          default: 86400000
        example: 86400000
      - name: end
        in: query
        required: false
        description: End of time range in milliseconds since epoch
        schema:
          type: string
          default: 0
        example: 0
      - name: resolution
        in: query
        required: false
        description: Resolution in milliseconds
        schema:
          type: string
          default: 3600000
        example: 3600000
      - name: versionFilter
        in: query
        required: false
        description: Filters the stats to a particular experience version
        schema:
          type: string
        example: myVersion
      - name: domainFilter
        in: query
        required: false
        description: Filters the stats to a particular experience domain or slug
        schema:
          type: string
        example: example.com
      - name: statusCodeFilter
        in: query
        required: false
        description: Filters the stats to a particular status code
        schema:
          type: string
        example: 200
      - name: endpointIdFilter
        in: query
        required: false
        description: Filters the stats to a particular endpoint
        schema:
          type: string
        example: 575ec8687ae143cd83dc4a98
      responses:
        '200':
          description: Statistics for endpoint requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/experienceEndpointStats'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - experienceEndpoints.stats
  /applications/{applicationId}/experience/endpoints/{experienceEndpointId}:
    get:
      operationId: experienceEndpoint.get
      summary: Retrieves information on an experience endpoint
      tags:
      - Experience Endpoints
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: experienceEndpointId
        in: path
        required: true
        description: ID associated with the experience endpoint
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed78e7ae143cd83dc4aab
      - name: version
        in: query
        required: false
        description: Version of this experience endpoint to return
        schema:
          type: string
          default: develop
        example: develop
      responses:
        '200':
          description: Experience endpoint information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/experienceEndpoint'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if experience endpoint was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - experienceEndpoint.get
    patch:
      operationId: experienceEndpoint.patch
      summary: Updates information about an experience endpoint
      tags:
      - Experience Endpoints
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: experienceEndpointId
        in: path
        required: true
        description: ID associated with the experience endpoint
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed78e7ae143cd83dc4aab
      responses:
        '200':
          description: Updated experience endpoint information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/experienceEndpoint'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if experience endpoint was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/experienceEndpointPatch'
        description: Object containing new properties of the experience endpoint
      x-losant-auth-scopes:
      - experienceEndpoint.patch
    delete:
      operationId: experienceEndpoint.delete
      summary: Deletes an experience endpoint
      tags:
      - Experience Endpoints
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: experienceEndpointId
        in: path
        required: true
        description: ID associated with the experience endpoint
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed78e7ae143cd83dc4aab
      - name: includeWorkflows
        in: query
        required: false
        description: If the workflows that utilize this experience endpoint should also be deleted.
        schema:
          type: string
        example: true
      responses:
        '200':
          description: If experience endpoint was successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if experience endpoint was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - experienceEndpoint.delete
  /applications/{applicationId}/experience/endpoints/{experienceEndpointId}/linkedResources:
    get:
      operationId: experienceEndpoint.linkedResources
      summary: Retrieves information on resources linked to an experience endpoint
      tags:
      - Experience Endpoints
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: experienceEndpointId
        in: path
        required: true
        description: ID associated with the experience endpoint
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed78e7ae143cd83dc4aab
      - name: version
        in: query
        required: false
        description: Version of this experience endpoint to query
        schema:
          type: string
          default: develop
        example: develop
      - name: includeCustomNodes
        in: query
        required: false
        description: If the result of the request should also include the details of any custom nodes referenced by returned workflows
        schema:
          type: string
          default: false
        example: true
      responses:
        '200':
          description: Linked resource information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/experienceLinkedResources'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if experience endpoint was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - experienceEndpoint.linkedResources
components:
  schemas:
    flowVersions:
      title: Workflow Versions
      description: Schema for a collection of Workflow Versions
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/flowVersion'
        count:
          type: integer
        totalCount:
          type: integer
        perPage:
          type: integer
        page:
          type: integer
        filter:
          type: string
        filterField:
          type: string
        sortField:
          type: string
        sortDirection:
          type: string
          enum:
          - asc
          - desc
          - ASC
          - DESC
          - ''
        applicationId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        flowId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        version:
          type: string
          minLength: 1
          maxLength: 255
        flowClass:
          type: string
          enum:
          - cloud
          - edge
          - embedded
          - experience
          - customNode
        customNodes:
          type: array
          items:
            $ref: '#/components/schemas/flow'
        customNodeVersions:
          type: array
          items:
            $ref: '#/components/schemas/flowVersion'
    experienceViews:
      title: Experience Views
      description: Schema for a collection of Experience Views
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/experienceView'
        count:
          type: integer
        totalCount:
          type: integer
        perPage:
          type: integer
        page:
          type: integer
        filter:
          type: string
        filterField:
          type: string
        sortField:
          type: string
        sortDirection:
          type: string
          enum:
          - asc
          - desc
          - ASC
          - DESC
          - ''
        applicationId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        viewType:
          type: string
          enum:
          - layout
          - page
          - component
        version:
          type: string
          minLength: 1
          maxLength: 255
    flow:
      title: Workflow
      description: Schema for a single Workflow
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        flowId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        applicationId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        creationDate:
          type: string
          format: date-time
        lastUpdated:
          type: string
          format: date-time
        createdById:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        createdByType:
          type: string
          enum:
          - flow
          - user
          - apiToken
        lastUpdatedById:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        lastUpdatedByType:
          type: string
          enum:
          - flow
          - user
          - apiToken
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 32767
        shortDescription:
          type: string
          maxLength: 1024
        iconData:
          type: string
          maxLength: 32767
          pattern: ^data:image/(jpg|jpeg|png|svg\+xml);base64,[0-9a-zA-Z+/=]*$
        docsUrl:
          type: string
          maxLength: 1024
        category:
          type: string
          enum:
          - data
          - experience
          - logic
          - output
          - debug
        enabled:
          type: boolean
        defaultVersionId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        minimumAgentVersion:
          type: string
          pattern: ^(0|([1-9]\d*))\.(0|([1-9]\d*))\.(0|([1-9]\d*))$
        flowClass:
          type: string
          enum:
          - cloud
          - edge
          - embedded
          - experience
          - customNode
        triggers:
          type: array
          items:
            type: object
            discriminator:
              propertyName: type
            oneOf:
            - type: object
              properties:
                key:
                  type: string
                  maxLength: 1024
                type:
                  type: string
                  enum:
                  - appFile
                config:
                  type: object
                  properties:
                    delete:
                      type: boolean
                    create:
                      type: boolean
                    update:
                      type: boolean
                    public:
                      type: boolean
                    private:
                      type: boolean
                  additionalProperties: false
                meta:
                  type: object
                  properties:
                    category:
                      type: string
                      enum:
                      - trigger
                    name:
                      type: string
                      enum:
                      - appFile
                    label:
                      type: string
                      minLength: 1
                      maxLength: 255
                    x:
                      type: number
                    y:
                      type: number
                    uiId:
                      type: string
                      maxLength: 48
                    description:
                      type: string
                      maxLength: 32767
                    icon:
                      type: string
                      maxLength: 1024
                    color:
                      type: string
                      maxLength: 1024
                    inputCount:
                      type: number
                    outputCount:
                      type: number
                    id:
                      type: string
                      maxLength: 48
                  additionalProperties: false
                  required:
                  - category
                  - name
                outputIds:
                  type: array
                  items:
                    type: array
                    items:
                      type: string
                      maxLength: 48
                      minLength: 1
                    maxItems: 100
                  maxItems: 100
              required:
              - type
              - meta
              additionalProperties: false
            - type: object
              properties:
                key:
                  type: string
                  maxLength: 1024
                type:
                  type: string
                  enum:
                  - customNodeStart
                  - deviceCreate
                  - deviceCommand
                  - deviceIdConnect
                  - deviceTagConnect
                  - deviceIdDisconnect
                  - deviceTagDisconnect
                  - inboundEmail
                  - notebook
                  - onBoot
                  - onConnect
                  - onDisconnect
                  - resourceJobComplete
                  - resourceJobIteration
                  - resourceJobIterationTimeout
                  - udp
                  - webhook
                config:
                  type: object
                  additionalProperties: false
                meta:
                  type: object
                  properties:
                    category:
                      type: string
                      enum:
                      - trigger
                    name:
                      type: string
                      enum:
                      - customNodeStart
                      - deviceCreate
                      - deviceCommand
                      - deviceIdsTagsConnect
                      - deviceIdsTagsDisconnect
                      - eeaInit
                      - flowError
                      - inboundEmail
                      - notebook
                      - onBoot
                      - onConnect
                      - onDisconnect
                      - resourceJobComplete
                      - resourceJobIteration
                      - resourceJobIterationTimeout
                      - udp
                      - webhook
                    label:
                      type: string
                      minLength: 1
                      maxLength: 255
                    x:
                      type: number
                    y:
                      type: number
                    uiId:
                      type: string
                      maxLength: 48
                    description:
                      type: string
                      maxLength: 32767
                    icon:
                      type: string
                      maxLength: 1024
                    color:
                      type: string
                      maxLength: 1024
                    inputCount:
                      type: number
                    outputCount:
                      type: number
                    triggerId:
                      type: string
                      maxLength: 48
                    id:
                      type: string
                      maxLength: 48
                  additionalProperties: false
                  required:
                  - category
                  - name
                outputIds:
                  type: array
                  items:
                    type: array
                    items:
                      type: string
                      maxLength: 48
                      minLength: 1
                    maxItems: 100
                  maxItems: 100
              required:
              - type
              - meta
              additionalProperties: false
            - type: object
              properties:
                key:
                  type: string
                  maxLength: 1024
                type:
                  type: string
                  enum:
                  - beckhoff
                config:
                  type: object
                  properties:
                    localAmsNetId:
                      type: string
                      maxLength: 1024
                    localAdsPort:
                      type: string
                      maxLength: 1024
                    targetAmsNetId:
                      type: string
                      maxLength: 1024
                    targetAdsPort:
                      type: string
                      maxLength: 1024
                    routerHost:
                      type: string
                      maxLength: 1024
                    routerTcpPort:
                      type: string
                      maxLength: 1024
                    cycleTimeMs:
                      type: integer
                      minimum: 10
                      maximum: 3600000
                    subscriptions:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            maxLength: 1024
                      maxItems: 100
                    configName:
                      type: string
                      maxLength: 1024
                  additionalProperties: false
                meta:
                  type: object
                  properties:
                    category:
                      type: string
                      enum:
                      - trigger
                    name:
                      type: string
                      enum:
                      - beckhoff
                    label:
                      type: string
                      minLength: 1
                      maxLength: 255
                    x:
                      type: number
                    y:
                      type: number
                    uiId:
                      type: string
                      maxLength: 48
                    description:
                      type: string
                      maxLength: 32767
                    icon:
                      type: string
                      maxLength: 1024
                    color:
                      type: string
                      maxLength: 1024
                    inputCount:
                      type: number
                    outputCount:
                      type: number
                    id:
                      type: string
                      maxLength: 48
                  additionalProperties: false
                  required:
                  - category
                  - name
                outputIds:
                  type: array
                  items:
                    type: array
                    items:
                      type: string
                      maxLength: 48
                      minLength: 1
                    maxItems: 100
                  maxItems: 100
              required:
              - type
              - meta
              additionalProperties: false
            - type: object
              properties:
                key:
                  type: string
                  maxLength: 1024
                type:
                  type: string
                  enum:
                  - dataTable
                config:
                  type: object
                  properties:
                    bulkInsert:
                      type: boolean
                    delete:
                      type: boolean
                    insert:
                      type: boolean
                    update:
                      type: boolean
                  additionalProperties: false
                meta:
                  type: object
                  properties:
                    category:
                      type: string
                      enum:
                      - trigger
                    name:
                      type: string
                      enum:
                      - dataTable
                    label:
                      type: string
                      minLength: 1
                      maxLength: 255
                    x:
                      type: number
                    y:
                      type: number
                    uiId:
                      type: string
                      maxLength: 48
                    description:
                      type: string
                      maxLength: 32767
                    icon:
                      type: string
                      maxLength: 1024
                    color:
                      type: string
                      maxLength: 1024
                    inputCount:
                      type: number
                    outputCount:
                      type: number
                    id:
                      type: string
                      maxLength: 48
                  additionalProperties: false
                  required:
                  - category
                  - name
                outputIds:
                  type: array
                  items:
                    type: array
                    items:
                      type: string
                      maxLength: 48
                      minLength: 1
                    maxItems: 100
                  maxItems: 100
              required:
              - type
              - meta
              additionalProperties: false
            - type: object
              properties:
                key:
                  type: string
                  maxLength: 1024
                type:
                  type: string
                  enum:
                  - integration
                config:
                  type: object
                  properties:
                    connect:
                      type: boolean
                    message:
                      type: boolean
                    disconnect:
                      type: boolean
                    failure:
                      type: boolean
                  additionalProperties: false
                meta:
                  type: object
                  properties:
                    category:
                      type: string
                      enum:
                      - trigger
                    name:
                      type: string
                      enum:
                      - azureEventHub
                      - googlePubSub
                      - mqtt
                      - particle
                      - sqs
                      - websocket
                    label:
                      type: string
                      minLength: 1
                      maxLength: 255
                    x:
                      type: number
                    y:
                      type: number
                    uiId:
                      type: string
                      maxLength: 48
                    description:
                      type: string
                      maxLength: 32767
                    icon:
                      type: string
                      maxLength: 1024
                    color:
                      type: string
                      maxLength: 1024
                    inputCount:
                      type: number
                    outputCount:
                      type: number
                    triggerId:
                      type: string
                      maxLength: 48
                    id:
                      type: string
                      maxLength: 48
                  additionalProperties: false
                  required:
                  - category
                  - name
                outputIds:
                  type: array
                  items:
                    type: array
                    items:
                      type: string
                      maxLength: 48
                      minLength: 1
                    maxItems: 100
                  maxItems: 100
              required:
              - type
              - meta
              additionalProperties: false
            - type: object
              properties:
                key:
                  type: string
                  maxLength: 1024
                type:
                  type: string
                  enum:
                  - deviceId
                  - deviceTag
                config:
                  type: object
                  properties:
                    attributeBlacklist:
                      type: array
                      maxItems: 100
                      items:
                        type: string
                        pattern: ^[0-9a-zA-Z_-]{1,255}$
                    attributeWhitelist:
                      type: array
                      maxItems: 100
                      items:
                        type: string
                        pattern: ^[0-9a-zA-Z_-]{1,255}$
                    maxAge:
                      type: number
                    triggerOn:
                      type: string
                      enum:
                      - batch
                      - individual
                      - both
                    batchBehavior:
                      type: string
                      enum:
                      - once
                      - each
                    allowInvalid:
                      type: boolean
                  additionalProperties: false
                meta:
                  type: object
                  properties:
                    category:
                      type: string
                      enum:
                      - trigger
                    name:
                      type: string
                      enum:
                      - deviceIdsTags
                      - device
                      - deviceTag
                    label:
                      type: string
                      minLength: 1
