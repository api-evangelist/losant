openapi: 3.2.0
info:
  title: Platform Instance Api Tokens API
  version: 1.31.0
  description: User API for accessing platform data
servers:
- url: https://api.losant.com
security:
- bearerAuth: []
tags:
- name: Instance Api Tokens
paths:
  /instances/{instanceId}/tokens:
    get:
      operationId: instanceApiTokens.get
      summary: Returns the API tokens for an instance
      tags:
      - Instance Api Tokens
      parameters:
      - name: instanceId
        in: path
        required: true
        description: ID associated with the instance
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec7417ae143cd83dc4a96
      - name: sortField
        in: query
        required: false
        description: Field to sort the results by
        schema:
          type: string
          enum:
          - name
          - status
          - id
          - creationDate
          - lastUpdated
          - expirationDate
          default: name
        example: name
      - name: sortDirection
        in: query
        required: false
        description: Direction to sort the results by
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        example: asc
      - name: page
        in: query
        required: false
        description: Which page of results to return
        schema:
          type: string
          default: 0
        example: 0
      - name: perPage
        in: query
        required: false
        description: How many items to return per page
        schema:
          type: string
          default: 100
        example: 10
      - name: filterField
        in: query
        required: false
        description: Field to filter the results by. Blank or not provided means no filtering.
        schema:
          type: string
          enum:
          - name
          - status
        example: key
      - name: filter
        in: query
        required: false
        description: Filter to apply against the filtered field. Supports globbing. Blank or not provided means no filtering.
        schema:
          type: string
        example: my*token
      responses:
        '200':
          description: Collection of API tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiTokens'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - instanceApiTokens.get
    post:
      operationId: instanceApiTokens.post
      summary: Create a new API token for an instance
      tags:
      - Instance Api Tokens
      parameters:
      - name: instanceId
        in: path
        required: true
        description: ID associated with the instance
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec7417ae143cd83dc4a96
      responses:
        '201':
          description: The successfully created API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiToken'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/apiTokenPost'
        description: API token information
      x-losant-auth-scopes:
      - instanceApiTokens.post
  /instances/{instanceId}/tokens/{apiTokenId}:
    get:
      operationId: instanceApiToken.get
      summary: Retrieves information on an API token
      tags:
      - Instance Api Tokens
      parameters:
      - name: instanceId
        in: path
        required: true
        description: ID associated with the instance
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec7417ae143cd83dc4a96
      - name: apiTokenId
        in: path
        required: true
        description: ID associated with the API token
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec7417ae143cd83dc4a95
      responses:
        '200':
          description: API token information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiToken'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if API token was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - instanceApiToken.get
    patch:
      operationId: instanceApiToken.patch
      summary: Updates information about an API token
      tags:
      - Instance Api Tokens
      parameters:
      - name: instanceId
        in: path
        required: true
        description: ID associated with the instance
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec7417ae143cd83dc4a96
      - name: apiTokenId
        in: path
        required: true
        description: ID associated with the API token
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec7417ae143cd83dc4a95
      responses:
        '200':
          description: Updated API token information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiToken'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if API token was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/apiTokenPatch'
        description: Object containing new properties of the API token
      x-losant-auth-scopes:
      - instanceApiToken.patch
    delete:
      operationId: instanceApiToken.delete
      summary: Deletes an API Token
      tags:
      - Instance Api Tokens
      parameters:
      - name: instanceId
        in: path
        required: true
        description: ID associated with the instance
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec7417ae143cd83dc4a96
      - name: apiTokenId
        in: path
        required: true
        description: ID associated with the API token
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec7417ae143cd83dc4a95
      responses:
        '200':
          description: If API token was successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if API token was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - instanceApiToken.delete
components:
  schemas:
    error:
      title: Error
      description: Schema for errors returned by the API
      type: object
      properties:
        type:
          type: string
        message:
          type: string
        validationErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              validationMessage:
                type: string
    success:
      title: Success
      description: Schema for reporting a successful operation
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
    apiToken:
      title: API Token
      description: Schema for a single API Token
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        apiTokenId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        ownerId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        ownerType:
          type: string
          enum:
          - application
          - user
          - instance
        applicationId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        instanceId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        creatorId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        creatorType:
          type: string
          enum:
          - apiToken
          - user
          - flow
        creatorName:
          type: string
          maxLength: 1024
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 32767
        creationDate:
          type: string
          format: date-time
        lastUpdated:
          type: string
          format: date-time
        expirationDate:
          type: string
          format: date-time
        defaultRole:
          type: string
          enum:
          - admin
          - edit
          - collaborate
          - view
          - none
        orgRoles:
          type: array
          items:
            type: object
            properties:
              orgId:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: string
                  enum:
                  - sandbox
              role:
                type: string
                enum:
                - admin
                - edit
                - collaborate
                - view
                - none
              applicationRoles:
                type: array
                items:
                  type: object
                  properties:
                    resourceId:
                      type: string
                      pattern: ^[A-Fa-f\d]{24}$
                    role:
                      type: string
                      enum:
                      - collaborate
                      - view
                      - none
                  required:
                  - resourceId
                  - role
                  additionalProperties: false
                maxItems: 100
              dashboardRoles:
                type: array
                items:
                  type: object
                  properties:
                    resourceId:
                      type: string
                      pattern: ^[A-Fa-f\d]{24}$
                    role:
                      type: string
                      enum:
                      - collaborate
                      - view
                      - none
                  required:
                  - resourceId
                  - role
                  additionalProperties: false
                maxItems: 100
            required:
            - orgId
            - role
            additionalProperties: false
          maxItems: 25
        scope:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 1024
        status:
          type: string
          enum:
          - active
          - inactive
        token:
          type: string
          minLength: 1
    apiTokens:
      title: API Tokens
      description: Schema for a collection of API Tokens
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/apiToken'
        count:
          type: integer
        totalCount:
          type: integer
        perPage:
          type: integer
        page:
          type: integer
        filter:
          type: string
        filterField:
          type: string
        sortField:
          type: string
        sortDirection:
          type: string
          enum:
          - asc
          - desc
          - ASC
          - DESC
          - ''
        ownerId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        ownerType:
          type: string
          enum:
          - application
          - user
          - instance
        applicationId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        instanceId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
    apiTokenPost:
      title: API Token Post
      description: Schema for the body of an API Token creation request
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 32767
        expirationDate:
          type: string
          format: date-time
        defaultRole:
          type: string
          enum:
          - admin
          - edit
          - collaborate
          - view
          - none
        orgRoles:
          type: array
          items:
            type: object
            properties:
              orgId:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: string
                  enum:
                  - sandbox
              role:
                type: string
                enum:
                - admin
                - edit
                - collaborate
                - view
                - none
              applicationRoles:
                type: array
                items:
                  type: object
                  properties:
                    resourceId:
                      type: string
                      pattern: ^[A-Fa-f\d]{24}$
                    role:
                      type: string
                      enum:
                      - collaborate
                      - view
                      - none
                  required:
                  - resourceId
                  - role
                  additionalProperties: false
                maxItems: 100
              dashboardRoles:
                type: array
                items:
                  type: object
                  properties:
                    resourceId:
                      type: string
                      pattern: ^[A-Fa-f\d]{24}$
                    role:
                      type: string
                      enum:
                      - collaborate
                      - view
                      - none
                  required:
                  - resourceId
                  - role
                  additionalProperties: false
                maxItems: 100
            required:
            - orgId
            - role
            additionalProperties: false
          maxItems: 25
        scope:
          type: array
          uniqueItems: true
          items:
