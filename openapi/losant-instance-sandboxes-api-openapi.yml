openapi: 3.2.0
info:
  title: Platform Instance Sandboxes API
  version: 1.31.0
  description: User API for accessing platform data
servers:
- url: https://api.losant.com
security:
- bearerAuth: []
tags:
- name: Instance Sandboxes
paths:
  /instances/{instanceId}/sandboxes:
    get:
      operationId: instanceSandboxes.get
      summary: Returns a collection of instance sandboxes
      tags:
      - Instance Sandboxes
      parameters:
      - name: instanceId
        in: path
        required: true
        description: ID associated with the instance
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: summaryExclude
        in: query
        required: false
        description: Comma-separated list of summary fields to exclude from user summary
        schema:
          type: string
        example: payloadCount
      - name: summaryInclude
        in: query
        required: false
        description: Comma-separated list of summary fields to include in user summary
        schema:
          type: string
        example: payloadCount
      - name: sortField
        in: query
        required: false
        description: Field to sort the results by
        schema:
          type: string
          enum:
          - firstName
          - lastName
          - email
          - id
          - creationDate
          - lastSuccessfulLogin
          - lastFailedLogin
          - failedLoginCount
          - lastUpdated
          default: email
        example: firstName
      - name: sortDirection
        in: query
        required: false
        description: Direction to sort the results by
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        example: asc
      - name: startingAfterId
        in: query
        required: false
        description: Exclusive ID from which to begin querying
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: endingBeforeId
        in: query
        required: false
        description: Exclusive ID at which to end querying
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: limit
        in: query
        required: false
        description: How many items to return
        schema:
          type: string
          default: 100
        example: 10
      - name: filterField
        in: query
        required: false
        description: Field to filter the results by. Blank or not provided means no filtering.
        schema:
          type: string
          enum:
          - firstName
          - lastName
          - email
        example: firstName
      - name: filter
        in: query
        required: false
        description: Filter to apply against the filtered field. Supports globbing. Blank or not provided means no filtering.
        schema:
          type: string
        example: my * instance
      - name: includeDeleted
        in: query
        required: false
        description: If the result of the request should also include deleted sandboxes.
        schema:
          type: string
        example: true
      responses:
        '200':
          description: Collection of instance sandboxes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/instanceSandboxes'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - instanceSandboxes.get
  /instances/{instanceId}/sandboxes/{instanceSandboxId}:
    get:
      operationId: instanceSandbox.get
      summary: Returns a sandbox user
      tags:
      - Instance Sandboxes
      parameters:
      - name: instanceId
        in: path
        required: true
        description: ID associated with the instance
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: instanceSandboxId
        in: path
        required: true
        description: ID associated with the sandbox user
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: summaryExclude
        in: query
        required: false
        description: Comma-separated list of summary fields to exclude from user summary
        schema:
          type: string
        example: payloadCount
      - name: summaryInclude
        in: query
        required: false
        description: Comma-separated list of summary fields to include in user summary
        schema:
          type: string
        example: payloadCount
      responses:
        '200':
          description: A single sandbox user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/instanceSandbox'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if sandbox or instance was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - instanceSandbox.get
    delete:
      operationId: instanceSandbox.delete
      summary: Deletes a sandbox user account
      tags:
      - Instance Sandboxes
      parameters:
      - name: instanceId
        in: path
        required: true
        description: ID associated with the instance
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: instanceSandboxId
        in: path
        required: true
        description: ID associated with the sandbox user
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '200':
          description: If a sandbox was successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if sandbox or instance was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - instanceSandbox.delete
  /instances/{instanceId}/sandboxes/{instanceSandboxId}/deviceCounts:
    get:
      operationId: instanceSandbox.deviceCounts
      summary: Returns device counts by day for the time range specified for all applications…
      tags:
      - Instance Sandboxes
      parameters:
      - name: instanceId
        in: path
        required: true
        description: ID associated with the instance
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: instanceSandboxId
        in: path
        required: true
        description: ID associated with the sandbox user
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: start
        in: query
        required: false
        description: Start of range for device count query (ms since epoch)
        schema:
          type: string
        example: 0
      - name: end
        in: query
        required: false
        description: End of range for device count query (ms since epoch)
        schema:
          type: string
        example: 1465790400000
      responses:
        '200':
          description: Device counts by day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deviceCounts'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if sandbox or instance was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - instanceSandbox.deviceCounts
  /instances/{instanceId}/sandboxes/{instanceSandboxId}/notebookMinuteCounts:
    get:
      operationId: instanceSandbox.notebookMinuteCounts
      summary: Returns notebook execution usage by day for the time range specified for all…
      tags:
      - Instance Sandboxes
      parameters:
      - name: instanceId
        in: path
        required: true
        description: ID associated with the instance
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: instanceSandboxId
        in: path
        required: true
        description: ID associated with the sandbox user
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: start
        in: query
        required: false
        description: Start of range for notebook execution query (ms since epoch)
        schema:
          type: string
        example: 0
      - name: end
        in: query
        required: false
        description: End of range for notebook execution query (ms since epoch)
        schema:
          type: string
        example: 1465790400000
      responses:
        '200':
          description: Notebook usage information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notebookMinuteCounts'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if sandbox or instance was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - instanceSandbox.notebookMinuteCounts
  /instances/{instanceId}/sandboxes/{instanceSandboxId}/payloadCounts:
    get:
      operationId: instanceSandbox.payloadCounts
      summary: Returns payload counts for the time range specified for all applications the…
      tags:
      - Instance Sandboxes
      parameters:
      - name: instanceId
        in: path
        required: true
        description: ID associated with the instance
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: instanceSandboxId
        in: path
        required: true
        description: ID associated with the sandbox user
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: start
        in: query
        required: false
        description: Start of range for payload count query (ms since epoch)
        schema:
          type: string
        example: 0
      - name: end
        in: query
        required: false
        description: End of range for payload count query (ms since epoch)
        schema:
          type: string
        example: 1465790400000
      - name: asBytes
        in: query
        required: false
        description: If the resulting stats should be returned as bytes
        schema:
          type: string
          default: false
        example: true
      responses:
        '200':
          description: Payload counts, by type and source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payloadStats'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if sandbox or instance was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - instanceSandbox.payloadCounts
  /instances/{instanceId}/sandboxes/{instanceSandboxId}/payloadCountsBreakdown:
    get:
      operationId: instanceSandbox.payloadCountsBreakdown
      summary: Returns payload counts per resolution in the time range specified for all…
      tags:
      - Instance Sandboxes
      parameters:
      - name: instanceId
        in: path
        required: true
        description: ID associated with the instance
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: instanceSandboxId
        in: path
        required: true
        description: ID associated with the sandbox user
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: start
        in: query
        required: false
        description: Start of range for payload count query (ms since epoch)
        schema:
          type: string
        example: 0
      - name: end
        in: query
        required: false
        description: End of range for payload count query (ms since epoch)
        schema:
          type: string
        example: 1465790400000
      - name: resolution
        in: query
        required: false
        description: Resolution in milliseconds
        schema:
          type: string
          enum:
          - '86400000'
          - '3600000'
          default: 86400000
        example: 86400000
      - name: asBytes
        in: query
        required: false
        description: If the resulting stats should be returned as bytes
        schema:
          type: string
          default: false
        example: true
      - name: includeNonBillable
        in: query
        required: false
        description: If non-billable payloads should be included in the result
        schema:
          type: string
          default: false
        example: true
      responses:
        '200':
          description: Sum of payload counts by date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payloadCountsBreakdown'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if sandbox or instance was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - instanceSandbox.payloadCountsBreakdown
  /instances/{instanceId}/sandboxes/{instanceSandboxId}/undelete:
    patch:
      operationId: instanceSandbox.undelete
      summary: Restores a sandbox user account
      tags:
      - Instance Sandboxes
      parameters:
      - name: instanceId
        in: path
        required: true
        description: ID associated with the instance
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: instanceSandboxId
        in: path
        required: true
        description: ID associated with the sandbox user
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: summaryExclude
        in: query
        required: false
        description: Comma-separated list of summary fields to exclude from user summary
        schema:
          type: string
        example: payloadCount
      - name: summaryInclude
        in: query
        required: false
        description: Comma-separated list of summary fields to include in user summary
        schema:
          type: string
        example: payloadCount
      responses:
        '200':
          description: A single restored sandbox user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/instanceSandbox'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if sandbox or instance was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - instanceSandbox.undelete
components:
  schemas:
    deviceCounts:
      title: Device Counts
      description: Schema for the result of a device counts request
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        counts:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date-time
              created:
                type: integer
              deleted:
                type: integer
              total:
                type: integer
    error:
      title: Error
      description: Schema for errors returned by the API
      type: object
      properties:
        type:
          type: string
        message:
          type: string
        validationErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              validationMessage:
                type: string
    payloadCountsBreakdown:
      title: Payload Counts Breakdown
      description: Schema for the result of a payload counts breakdown request
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        counts:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date-time
              value:
                type: integer
    success:
      title: Success
      description: Schema for reporting a successful operation
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
    instanceSandbox:
      title: Instance Sandbox User
      description: Schema for information about a sandbox user within an instance domain
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        instanceSandboxId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        instanceId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        creationDate:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
        permanentDeletion:
          type: string
          format: date-time
        dataDeletion:
          type: string
          format: date-time
        lastUpdated:
          type: string
          format: date-time
        lastSuccessfulLogin:
          type: string
          format: date-time
        lastFailedLogin:
          type: string
          format: date-time
        failedLoginCount:
          type: number
        passwordLastUpdated:
          type: string
          format: date-time
        email:
          type: string
          format: email
          maxLength: 1024
        firstName:
          type: string
          minLength: 1
          maxLength: 1024
        lastName:
          type: string
          maxLength: 1024
        companyName:
          type: string
          maxLength: 1024
        title:
          type: string
          maxLength: 1024
        phoneNumber:
          type: string
          maxLength: 1024
        location:
          type: string
          maxLength: 1024
        url:
          type: string
          maxLength: 1024
        tokenCutoff:
          type: string
          format: date-time
        emailVerified:
          type: boolean
        needsToVerifyEmail:
          type: boolean
        twoFactorAuthEnabled:
          type: boolean
        fullName:
          type: string
        githubName:
          type: string
        avatarUrl:
          type: string
          format: uri
          maxLength: 1024
        limits:
          type: object
          properties:
            apitoken:
              type: integer
            application:
              type: integer
            applicationcertificate:
              type: integer
            applicationcertificateauthority:
              type: integer
            applicationkey:
              type: integer
            credential:
              type: integer
            dashboard:
              type: integer
            datatable:
              type: integer
            device:
              type: integer
            devicerecipe:
              type: integer
            experiencedomain:
              type: integer
            experienceendpoint:
              type: integer
            experiencegroup:
              type: integer
            experienceslug:
              type: integer
            experienceuser:
              type: integer
            experienceversion:
              type: integer
            experienceview:
              type: integer
            file:
              type: integer
            flow:
              type: integer
            integration:
              type: integer
            notebook:
              type: integer
            oauthclient:
              type: integer
            privatefile:
              type: integer
            resourcejob:
              type: integer
            webhook:
              type: integer
            dataTTL:
              type: integer
            payload:
              type: integer
            storage:
              type: integer
            notebookMinutesPerRun:
              type: integer
            notebookMinutesPerMonth:
              type: integer
            notebookInParallel:
              type: integer
            experienceFlowSlots:
              type: integer
            applicationFlowSlots:
              type: integer
            systemInterval:
              type: integer
          additionalProperties: false
        summary:
          type: object
          properties:
            apiTokenCount:
              type: integer
            appCount:
              type: integer
            certificateCount:
              type: integer
            certificateAuthorityCount:
              type: integer
            credentialCount:
              type: integer
            dashCount:
              type: integer
            dataTableCount:
              type: integer
            deviceCount:
              type: integer
            deviceRecipeCount:
              type: integer
            eventCount:
              type: integer
            experienceDomainCount:
              type: integer
            experienceEndpointCount:
              type: integer
            experienceGroupCount:
              type: integer
            experienceSlugCount:
              type: integer
            experienceUserCount:
              type: integer
            experienceVersionCount:
              type: integer
            experienceViewCount:
              type: integer
            fileCount:
              type: integer
            flowCount:
              type: integer
            integrationCount:
              type: integer
            keyCount:
              type: integer
            notebookCount:
              type: integer
            oauthClientCount:
              type: integer
            resourceJobCount:
              type: integer
            privateFileCount:
              type: integer
            webhookCount:
              type: integer
            orgCount:
              type: integer
            instanceCount:
              type: integer
            payloadCount:
              title: Payload Stats
              description: Schema for the result of a payload stats request
              type: object
              properties:
                appFile:
                  type: object
                  patternProperties:
                    .*:
                      type: number
                dataTable:
                  type: object
                  patternProperties:
                    .*:
                      type: number
                deviceCreate:
                  type: object
                  patternProperties:
                    .*:
                      type: number
                deviceCommand:
                  type: object
                  patternProperties:
                    .*:
                      type: number
                deviceConnect:
                  type: object
                  patternProperties:
                    .*:
                      type: number
                deviceDisconnect:
                  type: object
                  patternProperties:
                    .*:
                      type: number
                deviceState:
                  type: object
                  patternProperties:
                    .*:
                      type: number
                endpoint:
                  type: object
                  patternProperties:
                    .*:
                      type: number
                event:
                  type: object
                  patternProperties:
                    .*:
                      type: number
                flowError:
                  type: object
                  patternProperties:
                    .*:
                      type: number
                inboundEmail:
                  type: object
                  patternProperties:
                    .*:
                      type: number
                integration:
                  type: object
                  patternProperties:
                    .*:
                      type: number
                mqttIn:
                  type: object
                  patternProperties:
                    .*:
                      type: number
                mqttOut:
                  type: object
                  patternProperties:
                    .*:
                      type: number
                notebook:
                  type: object
                  patternProperties:
                    .*:
                      type: number
                resourceJob:
                  type: object
                  patternProperties:
                    .*:
                      type: number
                timer:
                  type: object
                  patternProperties:
                    .*:
                      type: number
                virtualButton:
                  type: object
                  patternProperties:
                    .*:
                      type: number
                webhook:
                  type: object
                  patternProperties:
                    .*:
                      type: number
            storageStats:
              type: object
              properties:
                count:
                  type: integer
                size:
                  type: integer
            notebookStats:
              type: object
              properties:
                awaitingCompletion:
                  type: integer
                minutesThisPeriod:
                  type: number
                runsThisPeriod:
                  type: integer
        currentPeriodStart:
          type: string
          format: date-time
        currentPeriodEnd:
          type: string
          format: date-time
        ssoLinked:
          type: boolean
        orgs:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                pattern: ^[A-Fa-f\d]{24}$
              iconColor:
                type: string
                maxLength: 64
              name:
                type: string
                minLength: 1
                maxLength: 255
    instanceSandboxes:
      title: Instance Sandboxes
      description: Schema for a collection of instance associated sandboxes
      type: object
      properties:
        instanceId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        items:
          type: array
          items:
            $ref: '#/components/schemas/instanceSandbox'
        count:
          type: integer
        limit:
          type: integer
        startingAfterId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        endingBeforeId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        filter:
          type: string
        filterField:
          type: string
        sortField:
          type: string
        sortDirection:
          type: string
          enum:
          - asc
          - desc
          - ASC
          - DESC
          - ''
        hasMore:
          type: boolean
    payloadStats:
      title: Payload Stats
      description: Schema for the result of a payload stats request
      type: object
      properties:
        appFile:
          type: object
          patternProperties:
            .*:
              type: number
        dataTable:
          type: object
          patternProperties:
            .*:
              type: number
        deviceCreate:
          type: object
          patternProperties:
            .*:
              type: number
        deviceCommand:
          type: object
          patternProperties:
            .*:
              type: number
        deviceConnect:
          type: object
          patternProperties:
            .*:
              type: number
        deviceDisconnect:
          type: object
          patternProperties:
            .*:
              type: number
        deviceState:
          type: object
          patternProperties:
            .*:
              type: number
        endpoint:
          type: object
          patternProperties:
            .*:
              type: number
        event:
          type: object
          patternProperties:
            .*:
              type: number
        flowError:
          type: object
          patternProperties:
            .*:
              type: number
        inboundEmail:
          type: object
          patternProperties:
            .*:
              type: number
        integration:
          type: object
          patternProperties:
            .*:
