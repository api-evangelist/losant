openapi: 3.2.0
info:
  title: Platform Experience Slugs API
  version: 1.31.0
  description: User API for accessing platform data
servers:
- url: https://api.losant.com
security:
- bearerAuth: []
tags:
- name: Experience Slugs
paths:
  /applications/{applicationId}/experience/slugs:
    get:
      operationId: experienceSlugs.get
      summary: Returns the experience slugs for an application
      tags:
      - Experience Slugs
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '200':
          description: Collection of experience slugs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/experienceSlugs'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - experienceSlugs.get
    post:
      operationId: experienceSlugs.post
      summary: Create a new experience slug for an application
      tags:
      - Experience Slugs
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '201':
          description: Successfully created experience slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/experienceSlug'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/experienceSlugPost'
        description: New experience slug information
      x-losant-auth-scopes:
      - experienceSlugs.post
  /applications/{applicationId}/experience/slugs/{experienceSlugId}:
    get:
      operationId: experienceSlug.get
      summary: Retrieves information on an experience slug
      tags:
      - Experience Slugs
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: experienceSlugId
        in: path
        required: true
        description: ID associated with the experience slug
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed78e7ae143cd83dc4aab
      responses:
        '200':
          description: Experience slug information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/experienceSlug'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if experience slug was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - experienceSlug.get
    patch:
      operationId: experienceSlug.patch
      summary: Updates information about an experience slug
      tags:
      - Experience Slugs
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: experienceSlugId
        in: path
        required: true
        description: ID associated with the experience slug
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed78e7ae143cd83dc4aab
      responses:
        '200':
          description: Updated experience slug information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/experienceSlug'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if experience slug was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/experienceSlugPatch'
        description: Object containing new properties of the experience slug
      x-losant-auth-scopes:
      - experienceSlug.patch
    delete:
      operationId: experienceSlug.delete
      summary: Deletes an experience slug
      tags:
      - Experience Slugs
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: experienceSlugId
        in: path
        required: true
        description: ID associated with the experience slug
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed78e7ae143cd83dc4aab
      responses:
        '200':
          description: If experience slug was successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if experience slug was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - experienceSlug.delete
components:
  schemas:
    error:
      title: Error
      description: Schema for errors returned by the API
      type: object
      properties:
        type:
          type: string
        message:
          type: string
        validationErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              validationMessage:
                type: string
    success:
      title: Success
      description: Schema for reporting a successful operation
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
    experienceSlugPatch:
      title: Experience Slug Patch
      description: Schema for the body of an Experience Slug modification request
      type: object
      properties:
        version:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 255
          - type: 'null'
        slug:
          type: string
          minLength: 3
          maxLength: 63
          pattern: ^[0-9a-z-]*$
      additionalProperties: false
    experienceSlugPost:
      title: Experience Slug Post
      description: Schema for the body of an Experience Slug creation request
      type: object
      properties:
        version:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 255
          - type: 'null'
        slug:
          type: string
          minLength: 3
          maxLength: 63
          pattern: ^[0-9a-z-]*$
      additionalProperties: false
      required:
      - slug
    experienceSlug:
      title: Experience Slug
      description: Schema for a single Experience Slug
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        experienceSlugId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        applicationId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        creationDate:
          type: string
          format: date-time
        lastUpdated:
          type: string
          format: date-time
        slug:
          type: string
          minLength: 3
          maxLength: 63
          pattern: ^[0-9a-z-]*$
        version:
          type: string
          minLength: 1
          maxLength: 255
    experienceSlugs:
      title: Experience Slugs
      description: Schema for a collection of Experience Slugs
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/experienceSlug'
        count:
          type: integer
        totalCount:
          type: integer
        filter:
          type: string
        filterField:
          type: string
        sortField:
          type: string
        sortDirection:
          type: string
          enum:
          - asc
          - desc
          - ASC
          - DESC
          - ''
        applicationId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
x-derived-from:
  format: bravado 1.0
  by: all/0-working/bravado-to-openapi.py (roadmap#799)
  note: 'every action keeps its own path: resource.path + action.path'
