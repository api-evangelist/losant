            additionalProperties: false
            required:
            - type
            - options
        attributes:
          type: array
          items:
            type: string
            pattern: ^[0-9a-zA-Z_-]{1,255}$
        deviceIds:
          type: array
          items:
            type: string
            pattern: ^[A-Fa-f\d]{24}$
          maxItems: 1000
        deviceTags:
          type: array
          items:
            type: object
            properties:
              key:
