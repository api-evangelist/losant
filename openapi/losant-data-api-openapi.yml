                pattern: ^[0-9a-zA-Z_-]{1,255}$
              value:
                type: string
                minLength: 1
                maxLength: 255
            additionalProperties: false
          maxItems: 100
        deviceQuery:
          $ref: '#/components/schemas/advancedDeviceQuery'
        limit:
          type: number
        order:
          type: string
          enum:
          - asc
          - desc
          default: asc
      additionalProperties: false
