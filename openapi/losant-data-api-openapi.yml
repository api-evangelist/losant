openapi: 3.2.0
info:
  title: Platform Data API
  version: 1.31.0
  description: User API for accessing platform data
servers:
- url: https://api.losant.com
security:
- bearerAuth: []
tags:
- name: Data
paths:
  /applications/{applicationId}/data/export:
    post:
      operationId: data.export
      summary: Creates a csv file from a query of devices and attributes over a time range
      tags:
      - Data
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '202':
          description: If command was successfully sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobEnqueuedResult'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/devicesDataExport'
        description: The query parameters
      x-losant-auth-scopes:
      - data.export
  /applications/{applicationId}/data/last-value-query:
    post:
      operationId: data.lastValueQuery
      summary: Returns the last known data for the given attribute
      tags:
      - Data
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '200':
          description: Last known data for the requested attribute
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lastValueData'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/lastValueQuery'
        description: The query parameters
      x-losant-auth-scopes:
      - data.lastValueQuery
  /applications/{applicationId}/data/time-series-query:
    post:
      operationId: data.timeSeriesQuery
      summary: Returns the data for the given query
      tags:
      - Data
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '200':
          description: Data for requested time range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/timeSeriesData'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/timeSeriesQuery'
        description: The query parameters
      x-losant-auth-scopes:
      - data.timeSeriesQuery
components:
  schemas:
    timeSeriesData:
      title: Time Series Data
      description: Schema for the result of a time series query
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        resolution:
          type:
          - number
          - 'null'
        aggregation:
          oneOf:
          - type: 'null'
          - oneOf:
            - type: string
              enum:
              - FIRST
              - LAST
              - COUNT
              - MAX
              - MIN
              - MEDIAN
              - MEAN
              - SUM
              - STD_DEV
            - type: string
              enum:
              - NONE
          - type: object
            properties:
              type:
                oneOf:
                - type: string
                  enum:
                  - FIRST
                  - LAST
                  - COUNT
                  - MAX
                  - MIN
                  - MEDIAN
                  - MEAN
                  - SUM
                  - STD_DEV
                - type: string
                  enum:
                  - NONE
              options:
                type: object
                additionalProperties: false
            additionalProperties: false
            required:
            - type
          - type: object
            properties:
              type:
                type: string
                enum:
                - TIMEATVALUE
              options:
                type: object
                properties:
                  value:
                    oneOf:
                    - type: string
                      maxLength: 255
                    - type: number
                    - type: boolean
                additionalProperties: false
                required:
                - value
            additionalProperties: false
            required:
            - type
            - options
        limit:
          type:
          - number
          - 'null'
        order:
          type: string
          enum:
          - asc
          - desc
        devices:
          type: object
          patternProperties:
            ^[A-Fa-f\d]{24}$:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                tags:
                  type: object
                  patternProperties:
                    ^[0-9a-zA-Z_-]{1,255}$:
                      type: array
                      items:
                        type: string
                        minLength: 1
                        maxLength: 255
                  additionalProperties: false
                points:
                  type: array
                  items:
                    type: object
                    properties:
                      time:
                        type: string
                        format: date-time
                      data:
                        type: object
                        patternProperties:
                          ^[0-9a-zA-Z_-]{1,255}$:
                            oneOf:
                            - type:
                              - number
                              - string
                              - boolean
                            - type: object
                              properties:
                                value:
                                  type:
                                  - number
                                  - string
                                  - boolean
                                sum:
                                  type: number
                                count:
                                  type: number
                                average:
                                  type: number
                                variance:
                                  type: number
                              additionalProperties: false
                        additionalProperties: false
                    additionalProperties: false
                    required:
                    - data
                    - time
              additionalProperties: false
              required:
              - name
              - points
              - tags
          additionalProperties: false
      additionalProperties: false
      required:
      - start
      - end
      - resolution
      - aggregation
      - limit
      - order
      - devices
    error:
      title: Error
      description: Schema for errors returned by the API
      type: object
      properties:
        type:
          type: string
        message:
          type: string
        validationErrors:
          type: array
          items:
