openapi: 3.2.0
info:
  title: Platform Experience Versions API
  version: 1.31.0
  description: User API for accessing platform data
servers:
- url: https://api.losant.com
security:
- bearerAuth: []
tags:
- name: Experience Versions
paths:
  /applications/{applicationId}/experience/versions:
    get:
      operationId: experienceVersions.get
      summary: Returns the experience versions for an application
      tags:
      - Experience Versions
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: sortField
        in: query
        required: false
        description: Field to sort the results by
        schema:
          type: string
          enum:
          - version
          - id
          - creationDate
          - lastUpdated
          default: version
        example: version
      - name: sortDirection
        in: query
        required: false
        description: Direction to sort the results by
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        example: asc
      - name: page
        in: query
        required: false
        description: Which page of results to return
        schema:
          type: string
          default: 0
        example: 0
      - name: perPage
        in: query
        required: false
        description: How many items to return per page
        schema:
          type: string
          default: 100
        example: 10
      - name: filterField
        in: query
        required: false
        description: Field to filter the results by. Blank or not provided means no filtering.
        schema:
          type: string
          enum:
          - version
        example: email
      - name: filter
        in: query
        required: false
        description: Filter to apply against the filtered field. Supports globbing. Blank or not provided means no filtering.
        schema:
          type: string
        example: my*version
      responses:
        '200':
          description: Collection of experience versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/experienceVersions'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - experienceVersions.get
    post:
      operationId: experienceVersions.post
      summary: Create a new experience version for an application
      tags:
      - Experience Versions
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '201':
          description: Successfully created experience version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/experienceVersion'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/experienceVersionPost'
        description: New experience version information
      x-losant-auth-scopes:
      - experienceVersions.post
  /applications/{applicationId}/experience/versions/{experienceVersionIdOrName}:
    get:
      operationId: experienceVersion.get
      summary: Retrieves information on an experience version
      tags:
      - Experience Versions
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: experienceVersionIdOrName
        in: path
        required: true
        description: Version ID or version name associated with the experience version
        schema:
          type: string
        example: 575ed78e7ae143cd83dc4aab
      responses:
        '200':
          description: Experience version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/experienceVersion'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if experience version was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - experienceVersion.get
    patch:
      operationId: experienceVersion.patch
      summary: Updates information about an experience version
      tags:
      - Experience Versions
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: experienceVersionIdOrName
        in: path
        required: true
        description: Version ID or version name associated with the experience version
        schema:
          type: string
        example: 575ed78e7ae143cd83dc4aab
      responses:
        '200':
          description: Updated experience version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/experienceVersion'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if experience version was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/experienceVersionPatch'
        description: Object containing new properties of the experience version
      x-losant-auth-scopes:
      - experienceVersion.patch
    delete:
      operationId: experienceVersion.delete
      summary: Deletes an experience version
      tags:
      - Experience Versions
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: experienceVersionIdOrName
        in: path
        required: true
        description: Version ID or version name associated with the experience version
        schema:
          type: string
        example: 575ed78e7ae143cd83dc4aab
      responses:
        '200':
          description: If experience version was successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if experience version was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - experienceVersion.delete
components:
  schemas:
    error:
      title: Error
      description: Schema for errors returned by the API
      type: object
      properties:
        type:
          type: string
        message:
          type: string
        validationErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              validationMessage:
                type: string
    success:
      title: Success
      description: Schema for reporting a successful operation
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
    experienceVersions:
      title: Experience Versions
      description: Schema for a collection of Experience Versions
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/experienceVersion'
        count:
          type: integer
        totalCount:
          type: integer
        perPage:
          type: integer
        page:
          type: integer
        filter:
          type: string
        filterField:
          type: string
        sortField:
          type: string
        sortDirection:
          type: string
          enum:
          - asc
          - desc
          - ASC
          - DESC
          - ''
        applicationId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
    experienceVersionPatch:
      title: Experience Version Patch
      description: Schema for the body of an Experience Version modification request
      type: object
      properties:
        endpointDefaultCors:
          type: boolean
        allowedCorsOrigins:
          type: array
          items:
            type: string
            minLength: 8
            maxLength: 270
          maxItems: 100
        globals:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              key:
                type: string
                pattern: ^[0-9a-zA-Z_-]{1,255}$
              json:
                type: string
                minLength: 1
                maxLength: 32767
              description:
                type: string
                maxLength: 1024
            additionalProperties: false
            required:
            - key
            - json
        notFoundReply:
          oneOf:
          - type: object
            properties:
              value:
                type: string
              statusCode:
                type: integer
                minimum: 100
                maximum: 599
              type:
                type: string
                enum:
                - page
                - redirect
            required:
            - value
            - type
            additionalProperties: false
          - type: 'null'
        unauthorizedReply:
          oneOf:
          - type: object
            properties:
              value:
                type: string
              statusCode:
                type: integer
                minimum: 100
                maximum: 599
              type:
                type: string
                enum:
                - page
                - redirect
            required:
            - value
            - type
            additionalProperties: false
          - type: 'null'
        description:
          type: string
          maxLength: 32767
        sourceVersionIdOrName:
          type: string
          minLength: 1
          maxLength: 255
        responseHeaders:
          type: object
          patternProperties:
            ^.{1,255}$:
              type: string
              minLength: 1
              maxLength: 1024
          maxProperties: 10
          additionalProperties: false
      additionalProperties: false
    experienceVersionPost:
      title: Experience Version Post
      description: Schema for the body of an Experience Version creation request
      type: object
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 32767
        domainIds:
          type: array
          items:
            type: string
            pattern: ^[A-Fa-f\d]{24}$
          maxItems: 1000
        slugIds:
          type: array
          items:
            type: string
            pattern: ^[A-Fa-f\d]{24}$
          maxItems: 1000
        endpointDefaultCors:
          type: boolean
        globals:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              key:
                type: string
                pattern: ^[0-9a-zA-Z_-]{1,255}$
              json:
                type: string
                minLength: 1
                maxLength: 32767
              description:
                type: string
                maxLength: 1024
            additionalProperties: false
            required:
            - key
            - json
        notFoundReply:
          oneOf:
          - type: object
            properties:
              value:
                type: string
              statusCode:
                type: integer
                minimum: 100
                maximum: 599
              type:
                type: string
                enum:
                - page
                - redirect
            required:
            - value
            - type
            additionalProperties: false
          - type: 'null'
        unauthorizedReply:
          oneOf:
          - type: object
            properties:
              value:
                type: string
              statusCode:
                type: integer
                minimum: 100
                maximum: 599
              type:
                type: string
                enum:
                - page
                - redirect
            required:
            - value
            - type
            additionalProperties: false
          - type: 'null'
        allowedCorsOrigins:
          type: array
          items:
            type: string
            minLength: 8
            maxLength: 270
          maxItems: 100
        responseHeaders:
          type: object
          patternProperties:
            ^.{1,255}$:
              type: string
              minLength: 1
              maxLength: 1024
          maxProperties: 10
          additionalProperties: false
      additionalProperties: false
      required:
      - version
    experienceVersion:
      title: Experience Version
      description: Schema for a single Experience Version
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        experienceVersionId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        applicationId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        creationDate:
          type: string
          format: date-time
        createdById:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        createdByType:
          type: string
          enum:
          - flow
          - user
          - apiToken
        lastUpdated:
          type: string
          format: date-time
        lastUpdatedById:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        lastUpdatedByType:
          type: string
          enum:
          - flow
          - user
          - apiToken
        endpointDefaultCors:
          type: boolean
        allowedCorsOrigins:
          type: array
          items:
            type: string
            minLength: 8
            maxLength: 270
          maxItems: 100
        version:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 32767
        globals:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              key:
                type: string
                pattern: ^[0-9a-zA-Z_-]{1,255}$
              json:
                type: string
                minLength: 1
                maxLength: 32767
              description:
                type: string
                maxLength: 1024
            additionalProperties: false
            required:
            - key
            - json
        notFoundReply:
          oneOf:
          - type: object
            properties:
              value:
                type: string
              statusCode:
                type: integer
                minimum: 100
                maximum: 599
              type:
                type: string
                enum:
                - page
                - redirect
            required:
            - value
            - type
            additionalProperties: false
          - type: 'null'
        unauthorizedReply:
          oneOf:
          - type: object
            properties:
              value:
                type: string
              statusCode:
                type: integer
                minimum: 100
                maximum: 599
              type:
                type: string
                enum:
                - page
                - redirect
            required:
            - value
            - type
            additionalProperties: false
          - type: 'null'
        responseHeaders:
          type: object
          patternProperties:
            ^.{1,255}$:
              type: string
              minLength: 1
              maxLength: 1024
          maxProperties: 10
          additionalProperties: false
        attachedDomains:
          type: array
          items:
            type: object
            properties:
              domainName:
                type: string
                maxLength: 45
                minLength: 3
              id:
                type: string
                pattern: ^[A-Fa-f\d]{24}$
        attachedSlugs:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              id:
                type: string
                pattern: ^[A-Fa-f\d]{24}$
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
