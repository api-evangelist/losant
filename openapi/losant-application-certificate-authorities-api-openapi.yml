openapi: 3.2.0
info:
  title: Platform Application Certificate Authorities API
  version: 1.31.0
  description: User API for accessing platform data
servers:
- url: https://api.losant.com
security:
- bearerAuth: []
tags:
- name: Application Certificate Authorities
paths:
  /applications/{applicationId}/certificate-authorities:
    get:
      operationId: applicationCertificateAuthorities.get
      summary: Returns the application certificate authorities for an application
      tags:
      - Application Certificate Authorities
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: sortField
        in: query
        required: false
        description: Field to sort the results by
        schema:
          type: string
          enum:
          - name
          - status
          - id
          - creationDate
          - lastUpdated
          default: name
        example: name
      - name: sortDirection
        in: query
        required: false
        description: Direction to sort the results by
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        example: asc
      - name: page
        in: query
        required: false
        description: Which page of results to return
        schema:
          type: string
          default: 0
        example: 0
      - name: perPage
        in: query
        required: false
        description: How many items to return per page
        schema:
          type: string
          default: 100
        example: 10
      - name: filterField
        in: query
        required: false
        description: Field to filter the results by. Blank or not provided means no filtering.
        schema:
          type: string
          enum:
          - name
          - status
        example: name
      - name: filter
        in: query
        required: false
        description: Filter to apply against the filtered field. Supports globbing. Blank or not provided means no filtering.
        schema:
          type: string
        example: the*name
      responses:
        '200':
          description: Collection of application certificate authorities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationCertificateAuthorities'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - applicationCertificateAuthorities.get
    post:
      operationId: applicationCertificateAuthorities.post
      summary: Create a new application certificate authority for an application
      tags:
      - Application Certificate Authorities
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '201':
          description: Successfully created application certificate authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationCertificateAuthority'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/applicationCertificateAuthorityPost'
        description: Application certificate authority information
      x-losant-auth-scopes:
      - applicationCertificateAuthorities.post
  /applications/{applicationId}/certificate-authorities/{applicationCertificateAuthorityId}:
    get:
      operationId: applicationCertificateAuthority.get
      summary: Retrieves information on an application certificate authority
      tags:
      - Application Certificate Authorities
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: applicationCertificateAuthorityId
        in: path
        required: true
        description: ID associated with the application certificate authority
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec76c7ae143cd83dc4a96
      responses:
        '200':
          description: Application certificate authority information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationCertificateAuthority'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application certificate authority was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - applicationCertificateAuthority.get
    patch:
      operationId: applicationCertificateAuthority.patch
      summary: Updates information about an application certificate authority
      tags:
      - Application Certificate Authorities
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: applicationCertificateAuthorityId
        in: path
        required: true
        description: ID associated with the application certificate authority
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec76c7ae143cd83dc4a96
      responses:
        '200':
          description: Updated application certificate authority information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationCertificateAuthority'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application certificate authority was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/applicationCertificateAuthorityPatch'
        description: Object containing new properties of the application certificate authority
      x-losant-auth-scopes:
      - applicationCertificateAuthority.patch
    delete:
      operationId: applicationCertificateAuthority.delete
      summary: Deletes an application certificate authority
      tags:
      - Application Certificate Authorities
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: applicationCertificateAuthorityId
        in: path
        required: true
        description: ID associated with the application certificate authority
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec76c7ae143cd83dc4a96
      responses:
        '200':
          description: If application certificate authority was successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application certificate authority was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - applicationCertificateAuthority.delete
components:
  schemas:
    error:
      title: Error
      description: Schema for errors returned by the API
      type: object
      properties:
        type:
          type: string
        message:
          type: string
        validationErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              validationMessage:
                type: string
    applicationCertificateAuthorityPatch:
      title: Application Certificate Authority Patch
      description: Schema for the body of an Application Certificate Authority modification request
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        status:
          type: string
          enum:
          - active
          - inactive
        description:
          type: string
          maxLength: 32767
        caBundle:
          type: string
          maxLength: 32767
          minLength: 50
      additionalProperties: false
    success:
      title: Success
      description: Schema for reporting a successful operation
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
    applicationCertificateAuthorities:
      title: Application Certificate Authorities
      description: Schema for a collection of Application Certificate Authorities
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/applicationCertificateAuthority'
        count:
          type: integer
        totalCount:
          type: integer
        perPage:
          type: integer
        page:
          type: integer
        filter:
          type: string
        filterField:
          type: string
        sortField:
          type: string
        sortDirection:
          type: string
          enum:
          - asc
          - desc
          - ASC
          - DESC
          - ''
        applicationId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
    applicationCertificateAuthority:
      title: Application Certificate Authority
      description: Schema for a single Application Certificate Authority
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        applicationCertificateAuthorityId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        applicationId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        creationDate:
          type: string
          format: date-time
        lastUpdated:
          type: string
          format: date-time
        createdById:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        createdByType:
          type: string
          enum:
          - flow
          - user
          - apiToken
        lastUpdatedById:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        lastUpdatedByType:
          type: string
          enum:
          - flow
          - user
          - apiToken
        status:
          type: string
          enum:
          - active
          - inactive
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 32767
        caBundle:
          type: string
          maxLength: 32767
          minLength: 50
        caInfo:
          type: array
          items:
            type: object
            properties:
              serialNumber:
                type: string
                minLength: 1
                maxLength: 1024
              fingerprint:
                type: string
                minLength: 1
                maxLength: 1024
              commonName:
                type: string
                maxLength: 1024
              issuerName:
                type: string
                maxLength: 1024
              notValidBefore:
                type: string
                format: date-time
              notValidAfter:
                type: string
                format: date-time
    applicationCertificateAuthorityPost:
      title: Application Certificate Authority Post
      description: Schema for the body of an Application Certificate Authority creation request
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        status:
          type: string
          enum:
          - active
          - inactive
        description:
          type: string
          maxLength: 32767
        caBundle:
          type: string
          maxLength: 32767
          minLength: 50
      required:
      - name
      - caBundle
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
x-derived-from:
  format: bravado 1.0
  by: all/0-working/bravado-to-openapi.py (roadmap#799)
  note: 'every action keeps its own path: resource.path + action.path'
