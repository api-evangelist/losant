openapi: 3.2.0
info:
  title: Platform Flow Versions API
  version: 1.31.0
  description: User API for accessing platform data
servers:
- url: https://api.losant.com
security:
- bearerAuth: []
tags:
- name: Flow Versions
paths:
  /applications/{applicationId}/flows/{flowId}/versions:
    get:
      operationId: flowVersions.get
      summary: Returns the flow versions for a flow
      tags:
      - Flow Versions
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: flowId
        in: path
        required: true
        description: ID associated with the flow
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed18f7ae143cd83dc4aa6
      - name: sortField
        in: query
        required: false
        description: Field to sort the results by
        schema:
          type: string
          enum:
          - version
          - id
          - creationDate
          - lastUpdated
          default: version
        example: version
      - name: sortDirection
        in: query
        required: false
        description: Direction to sort the results by
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        example: asc
      - name: page
        in: query
        required: false
        description: Which page of results to return
        schema:
          type: string
          default: 0
        example: 0
      - name: perPage
        in: query
        required: false
        description: How many items to return per page
        schema:
          type: string
          default: 100
        example: 10
      - name: filterField
        in: query
        required: false
        description: Field to filter the results by. Blank or not provided means no filtering.
        schema:
          type: string
          enum:
          - version
        example: version
      - name: filter
        in: query
        required: false
        description: Filter to apply against the filtered field. Supports globbing. Blank or not provided means no filtering.
        schema:
          type: string
        example: my*version
      - name: includeCustomNodes
        in: query
        required: false
        description: If the result of the request should also include the details of any custom nodes referenced by the returned workflows
        schema:
          type: string
          default: false
        example: true
      - name: query
        in: query
        required: false
        description: Workflow filter JSON object which overrides the filterField and filter parameters.
        schema:
          $ref: '#/components/schemas/advancedFlowVersionQuery'
      responses:
        '200':
          description: Collection of flow versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/flowVersions'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if flow was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - flowVersions.get
    post:
      operationId: flowVersions.post
      summary: Create or replace a flow version for a flow
      tags:
      - Flow Versions
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: flowId
        in: path
        required: true
        description: ID associated with the flow
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed18f7ae143cd83dc4aa6
      - name: includeCustomNodes
        in: query
        required: false
        description: If the result of the request should also include the details of any custom nodes referenced by the returned workflows
        schema:
          type: string
          default: false
        example: true
      - name: allowReplacement
        in: query
        required: false
        description: Allow replacement of an existing flow version with same version name
        schema:
          type: string
          default: false
        example: true
      - name: strictValidation
        in: query
        required: false
        description: When true, perform stricter validation on node and trigger configuration
        schema:
          type: string
          default: false
        example: true
      responses:
        '201':
          description: Successfully created flow version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/flowVersion'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if flow was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/flowVersionPost'
        description: New flow version information
      x-losant-auth-scopes:
      - flowVersions.post
  /applications/{applicationId}/flows/{flowId}/versions/delete:
    post:
      operationId: flowVersions.delete
      summary: Delete flow versions
      tags:
      - Flow Versions
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: flowId
        in: path
        required: true
        description: ID associated with the flow
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed18f7ae143cd83dc4aa6
      responses:
        '200':
          description: Object indicating number of flow versions deleted or failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bulkDeleteResponse'
        '202':
          description: If a job was enqueued for the flow versions to be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobEnqueuedResult'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/flowVersionsDeletePost'
        description: Object containing flow version deletion options
      x-losant-auth-scopes:
      - flowVersions.delete
  /applications/{applicationId}/flows/{flowId}/versions/{flowVersionId}:
    get:
      operationId: flowVersion.get
      summary: Retrieves information on a flow version
      tags:
      - Flow Versions
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: flowId
        in: path
        required: true
        description: ID associated with the flow
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed18f7ae143cd83dc4aa6
      - name: flowVersionId
        in: path
        required: true
        description: Version ID or version name associated with the flow version
        schema:
          type: string
        example: 675ed18f7ae143cd83dc4bb7
      - name: includeCustomNodes
        in: query
        required: false
        description: If the result of the request should also include the details of any custom nodes referenced by the returned workflows
        schema:
          type: string
          default: false
        example: true
      responses:
        '200':
          description: Flow version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/flowVersion'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if flow version was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - flowVersion.get
    patch:
      operationId: flowVersion.patch
      summary: Updates information about a flow version
      tags:
      - Flow Versions
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: flowId
        in: path
        required: true
        description: ID associated with the flow
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed18f7ae143cd83dc4aa6
      - name: flowVersionId
        in: path
        required: true
        description: Version ID or version name associated with the flow version
        schema:
          type: string
        example: 675ed18f7ae143cd83dc4bb7
      - name: includeCustomNodes
        in: query
        required: false
        description: If the result of the request should also include the details of any custom nodes referenced by the returned workflows
        schema:
          type: string
          default: false
        example: true
      responses:
        '200':
          description: Updated flow version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/flowVersion'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if flow version was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/flowVersionPatch'
        description: Object containing new properties of the flow version
      x-losant-auth-scopes:
      - flowVersion.patch
    delete:
      operationId: flowVersion.delete
      summary: Deletes a flow version
      tags:
      - Flow Versions
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: flowId
        in: path
        required: true
        description: ID associated with the flow
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed18f7ae143cd83dc4aa6
      - name: flowVersionId
        in: path
        required: true
        description: Version ID or version name associated with the flow version
        schema:
          type: string
        example: 675ed18f7ae143cd83dc4bb7
      responses:
        '200':
          description: If flow version was successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if flow version was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - flowVersion.delete
  /applications/{applicationId}/flows/{flowId}/versions/{flowVersionId}/errors:
    get:
      operationId: flowVersion.errors
      summary: Get information about errors that occurred during runs of this workflow version
      tags:
      - Flow Versions
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: flowId
        in: path
        required: true
        description: ID associated with the flow
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed18f7ae143cd83dc4aa6
      - name: flowVersionId
        in: path
        required: true
        description: Version ID or version name associated with the flow version
        schema:
          type: string
        example: 675ed18f7ae143cd83dc4bb7
      - name: duration
        in: query
        required: false
        description: Duration of time range in milliseconds
        schema:
          type: string
          default: 86400000
        example: 86400000
      - name: end
        in: query
        required: false
        description: End of time range in milliseconds since epoch
        schema:
          type: string
          default: 0
        example: 0
      - name: limit
        in: query
        required: false
        description: Maximum number of errors to return
        schema:
          type: string
          default: 25
        example: 25
      - name: sortDirection
        in: query
        required: false
        description: Direction to sort the results by
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        example: desc
      - name: deviceId
        in: query
        required: false
        description: For edge workflows, the Device ID to return workflow errors for. When not included, will be errors for all device IDs.
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed18f7ae143cd83dc4bb6
      responses:
        '200':
          description: Workflow error information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/flowErrors'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if flow version was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - flowVersion.errors
  /applications/{applicationId}/flows/{flowId}/versions/{flowVersionId}/logs:
    get:
      operationId: flowVersion.getLogEntries
      summary: Retrieve the recent log entries about runs of this workflow version
      tags:
      - Flow Versions
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: flowId
        in: path
        required: true
        description: ID associated with the flow
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed18f7ae143cd83dc4aa6
      - name: flowVersionId
        in: path
        required: true
        description: Version ID or version name associated with the flow version
        schema:
          type: string
        example: 675ed18f7ae143cd83dc4bb7
      - name: limit
        in: query
        required: false
        description: Max log entries to return (ordered by time descending)
        schema:
          type: string
          default: 1
        example: 10
      - name: since
        in: query
        required: false
        description: Look for log entries since this time (ms since epoch)
        schema:
          type: string
        example: 1465790400000
      responses:
        '200':
          description: Recent log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/flowLog'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if flow version was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - flowVersion.log
  /applications/{applicationId}/flows/{flowId}/versions/{flowVersionId}/stats:
    get:
      operationId: flowVersion.stats
      summary: Get statistics about workflow runs for this workflow version
      tags:
      - Flow Versions
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: flowId
        in: path
        required: true
        description: ID associated with the flow
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed18f7ae143cd83dc4aa6
      - name: flowVersionId
        in: path
        required: true
        description: Version ID or version name associated with the flow version
        schema:
          type: string
        example: 675ed18f7ae143cd83dc4bb7
      - name: duration
        in: query
        required: false
        description: Duration of time range in milliseconds
        schema:
          type: string
          default: 86400000
        example: 86400000
      - name: end
        in: query
        required: false
        description: End of time range in milliseconds since epoch
        schema:
          type: string
          default: 0
        example: 0
      - name: resolution
        in: query
        required: false
        description: Resolution in milliseconds
        schema:
          type: string
          default: 3600000
        example: 3600000
      - name: deviceId
        in: query
        required: false
        description: For edge workflows, the device ID to return workflow stats for. When not included, will be aggregate for all device IDs.
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed18f7ae143cd83dc4bb6
      responses:
        '200':
          description: Statistics for workflow runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/flowStats'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if flow version was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - flowVersion.stats
components:
  schemas:
    flowVersions:
      title: Workflow Versions
      description: Schema for a collection of Workflow Versions
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/flowVersion'
        count:
          type: integer
        totalCount:
          type: integer
        perPage:
          type: integer
        page:
          type: integer
        filter:
          type: string
        filterField:
          type: string
        sortField:
          type: string
        sortDirection:
          type: string
          enum:
          - asc
          - desc
          - ASC
          - DESC
          - ''
        applicationId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        flowId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        version:
          type: string
          minLength: 1
          maxLength: 255
        flowClass:
          type: string
          enum:
          - cloud
          - edge
          - embedded
          - experience
          - customNode
        customNodes:
          type: array
          items:
            $ref: '#/components/schemas/flow'
        customNodeVersions:
          type: array
          items:
            $ref: '#/components/schemas/flowVersion'
    flowErrors:
      title: Workflow Errors
      description: Workflow run error information
      type: object
      properties:
        flowVersion:
          type: string
          minLength: 1
          maxLength: 255
        flowVersionId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        deviceId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        limit:
          type: number
        sortDirection:
          type: string
          enum:
          - asc
          - desc
          - ASC
          - DESC
          - ''
        errors:
          type: array
          items:
            type: object
            properties:
              time:
                type: string
                format: date-time
              deviceId:
                type: string
                pattern: ^[A-Fa-f\d]{24}$
              deviceName:
                type: string
                minLength: 1
                maxLength: 255
              flowVersion:
                type: string
                minLength: 1
                maxLength: 255
              flowVersionId:
                type: string
                pattern: ^[A-Fa-f\d]{24}$
              nodeId:
                type: string
              nodeLabel:
                type: string
              error:
                type: object
                properties:
                  name:
                    type: string
                  message:
                    type: string
    flow:
      title: Workflow
      description: Schema for a single Workflow
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        flowId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        applicationId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        creationDate:
          type: string
          format: date-time
        lastUpdated:
          type: string
          format: date-time
        createdById:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        createdByType:
          type: string
          enum:
          - flow
          - user
          - apiToken
        lastUpdatedById:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        lastUpdatedByType:
          type: string
          enum:
          - flow
          - user
          - apiToken
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 32767
        shortDescription:
          type: string
          maxLength: 1024
        iconData:
          type: string
          maxLength: 32767
          pattern: ^data:image/(jpg|jpeg|png|svg\+xml);base64,[0-9a-zA-Z+/=]*$
        docsUrl:
          type: string
          maxLength: 1024
        category:
          type: string
          enum:
          - data
          - experience
          - logic
          - output
          - debug
        enabled:
          type: boolean
        defaultVersionId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        minimumAgentVersion:
          type: string
          pattern: ^(0|([1-9]\d*))\.(0|([1-9]\d*))\.(0|([1-9]\d*))$
        flowClass:
          type: string
          enum:
          - cloud
          - edge
          - embedded
          - experience
          - customNode
        triggers:
          type: array
          items:
            type: object
            discriminator:
              propertyName: type
            oneOf:
            - type: object
              properties:
                key:
                  type: string
                  maxLength: 1024
                type:
                  type: string
                  enum:
                  - appFile
                config:
                  type: object
                  properties:
                    delete:
                      type: boolean
                    create:
                      type: boolean
                    update:
                      type: boolean
                    public:
                      type: boolean
                    private:
                      type: boolean
                  additionalProperties: false
                meta:
                  type: object
                  properties:
                    category:
                      type: string
                      enum:
                      - trigger
                    name:
                      type: string
                      enum:
                      - appFile
                    label:
                      type: string
                      minLength: 1
                      maxLength: 255
                    x:
                      type: number
                    y:
                      type: number
                    uiId:
                      type: string
                      maxLength: 48
                    description:
                      type: string
                      maxLength: 32767
                    icon:
                      type: string
                      maxLength: 1024
                    color:
                      type: string
                      maxLength: 1024
                    inputCount:
                      type: number
                    outputCount:
                      type: number
                    id:
                      type: string
                      maxLength: 48
                  additionalProperties: false
                  required:
                  - category
                  - name
                outputIds:
                  type: array
                  items:
                    type: array
                    items:
                      type: string
                      maxLength: 48
                      minLength: 1
                    maxItems: 100
                  maxItems: 100
              required:
              - type
              - meta
              additionalProperties: false
            - type: object
              properties:
                key:
                  type: string
                  maxLength: 1024
                type:
                  type: string
                  enum:
                  - customNodeStart
                  - deviceCreate
                  - deviceCommand
                  - deviceIdConnect
                  - deviceTagConnect
                  - deviceIdDisconnect
                  - deviceTagDisconnect
                  - inboundEmail
                  - notebook
                  - onBoot
                  - onConnect
                  - onDisconnect
                  - resourceJobComplete
                  - resourceJobIteration
                  - resourceJobIterationTimeout
                  - udp
                  - webhook
                config:
                  type: object
                  additionalProperties: false
                meta:
                  type: object
                  properties:
                    category:
                      type: string
                      enum:
                      - trigger
                    name:
                      type: string
                      enum:
                      - customNodeStart
                      - deviceCreate
                      - deviceCommand
                      - deviceIdsTagsConnect
                      - deviceIdsTagsDisconnect
                      - eeaInit
                      - flowError
                      - inboundEmail
                      - notebook
                      - onBoot
                      - onConnect
                      - onDisconnect
                      - resourceJobComplete
                      - resourceJobIteration
                      - resourceJobIterationTimeout
                      - udp
                      - webhook
                    label:
                      type: string
                      minLength: 1
                      maxLength: 255
                    x:
                      type: number
                    y:
                      type: number
                    uiId:
                      type: string
                      maxLength: 48
                    description:
                      type: string
                      maxLength: 32767
                    icon:
                      type: string
                      maxLength: 1024
                    color:
                      type: string
                      maxLength: 1024
                    inputCount:
                      type: number
                    outputCount:
                      type: number
                    triggerId:
                      type: string
                      maxLength: 48
                    id:
                      type: string
                      maxLength: 48
                  additionalProperties: false
