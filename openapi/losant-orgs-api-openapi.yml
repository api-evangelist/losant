openapi: 3.2.0
info:
  title: Platform Orgs API
  version: 1.31.0
  description: User API for accessing platform data
servers:
- url: https://api.losant.com
security:
- bearerAuth: []
tags:
- name: Orgs
paths:
  /orgs:
    get:
      operationId: orgs.get
      summary: Returns the organizations associated with the current user
      tags:
      - Orgs
      parameters:
      - name: sortField
        in: query
        required: false
        description: Field to sort the results by
        schema:
          type: string
          enum:
          - name
          - id
          - creationDate
          - lastUpdated
          default: name
        example: name
      - name: sortDirection
        in: query
        required: false
        description: Direction to sort the results by
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        example: asc
      - name: page
        in: query
        required: false
        description: Which page of results to return
        schema:
          type: string
          default: 0
        example: 0
      - name: perPage
        in: query
        required: false
        description: How many items to return per page
        schema:
          type: string
          default: 100
        example: 10
      - name: filterField
        in: query
        required: false
        description: Field to filter the results by. Blank or not provided means no filtering.
        schema:
          type: string
          enum:
          - name
        example: name
      - name: filter
        in: query
        required: false
        description: Filter to apply against the filtered field. Supports globbing. Blank or not provided means no filtering.
        schema:
          type: string
        example: my*org
      - name: summaryExclude
        in: query
        required: false
        description: Comma-separated list of summary fields to exclude from org summaries
        schema:
          type: string
        example: payloadCount
      - name: summaryInclude
        in: query
        required: false
        description: Comma-separated list of summary fields to include in org summary
        schema:
          type: string
        example: payloadCount
      responses:
        '200':
          description: Collection of organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orgs'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - orgs.get
    post:
      operationId: orgs.post
      summary: Create a new organization
      tags:
      - Orgs
      parameters:
      - name: summaryExclude
        in: query
        required: false
        description: Comma-separated list of summary fields to exclude from org summary
        schema:
          type: string
        example: payloadCount
      - name: summaryInclude
        in: query
        required: false
        description: Comma-separated list of summary fields to include in org summary
        schema:
          type: string
        example: payloadCount
      responses:
        '201':
          description: Successfully created organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/org'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orgPost'
        description: New organization information
      x-losant-auth-scopes:
      - orgs.post
  /orgs/{orgId}:
    get:
      operationId: org.get
      summary: Retrieves information on an organization
      tags:
      - Orgs
      parameters:
      - name: orgId
        in: path
        required: true
        description: ID associated with the organization
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed6e87ae143cd83dc4aa8
      - name: summaryExclude
        in: query
        required: false
        description: Comma-separated list of summary fields to exclude from org summary
        schema:
          type: string
        example: payloadCount
      - name: summaryInclude
        in: query
        required: false
        description: Comma-separated list of summary fields to include in org summary
        schema:
          type: string
        example: payloadCount
      responses:
        '200':
          description: Organization information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/org'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - org.get
    patch:
      operationId: org.patch
      summary: Updates information about an organization
      tags:
      - Orgs
      parameters:
      - name: orgId
        in: path
        required: true
        description: ID associated with the organization
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed6e87ae143cd83dc4aa8
      - name: summaryExclude
        in: query
        required: false
        description: Comma-separated list of summary fields to exclude from org summary
        schema:
          type: string
        example: payloadCount
      - name: summaryInclude
        in: query
        required: false
        description: Comma-separated list of summary fields to include in org summary
        schema:
          type: string
        example: payloadCount
      responses:
        '200':
          description: Updated organization information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/org'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if organization was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orgPatch'
        description: Object containing new organization properties
      x-losant-auth-scopes:
      - org.patch
    delete:
      operationId: org.delete
      summary: Deletes an organization
      tags:
      - Orgs
      parameters:
      - name: orgId
        in: path
        required: true
        description: ID associated with the organization
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed6e87ae143cd83dc4aa8
      responses:
        '200':
          description: If organization was successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if organization was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - org.delete
  /orgs/{orgId}/deviceCounts:
    get:
      operationId: org.deviceCounts
      summary: Returns device counts by day for the time range specified for this organization
      tags:
      - Orgs
      parameters:
      - name: orgId
        in: path
        required: true
        description: ID associated with the organization
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed6e87ae143cd83dc4aa8
      - name: start
        in: query
        required: false
        description: Start of range for device count query (ms since epoch)
        schema:
          type: string
        example: 0
      - name: end
        in: query
        required: false
        description: End of range for device count query (ms since epoch)
        schema:
          type: string
        example: 1465790400000
      responses:
        '200':
          description: Device counts by day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deviceCounts'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if organization was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - org.deviceCounts
  /orgs/{orgId}/invites:
    get:
      operationId: org.pendingInvites
      summary: Gets the current pending invites
      tags:
      - Orgs
      parameters:
      - name: orgId
        in: path
        required: true
        description: ID associated with the organization
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed6e87ae143cd83dc4aa8
      responses:
        '200':
          description: Invitation information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orgInvites'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - org.pendingInvites
    post:
      operationId: org.inviteMember
      summary: Invites a person to an organization
      tags:
      - Orgs
      parameters:
      - name: orgId
        in: path
        required: true
        description: ID associated with the organization
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed6e87ae143cd83dc4aa8
      responses:
        '200':
          description: Invitation information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orgInvites'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orgInvitePost'
        description: Object containing new invite info
      x-losant-auth-scopes:
      - org.inviteMember
    delete:
      operationId: org.revokeInvite
      summary: Revokes an existing invite
      tags:
      - Orgs
      parameters:
      - name: orgId
        in: path
        required: true
        description: ID associated with the organization
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed6e87ae143cd83dc4aa8
      - name: inviteId
        in: query
        required: true
        description: Id of invite to revoke
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed71e7ae143cd83dc4aaa
      responses:
        '200':
          description: Invitation information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orgInvites'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - org.revokeInvite
  /orgs/{orgId}/member:
    patch:
      operationId: org.modifyMember
      summary: Modifies a current org member's role
      tags:
      - Orgs
      parameters:
      - name: orgId
        in: path
        required: true
        description: ID associated with the organization
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed6e87ae143cd83dc4aa8
      - name: summaryExclude
        in: query
        required: false
        description: Comma-separated list of summary fields to exclude from org summary
        schema:
          type: string
        example: payloadCount
      - name: summaryInclude
        in: query
        required: false
        description: Comma-separated list of summary fields to include in org summary
        schema:
          type: string
        example: payloadCount
      responses:
        '200':
          description: Updated organization information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/org'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orgMemberPatch'
        description: Object containing new member pair
      x-losant-auth-scopes:
      - org.modifyMember
    delete:
      operationId: org.removeMember
      summary: Removes a member from the org
      tags:
      - Orgs
      parameters:
      - name: orgId
        in: path
        required: true
        description: ID associated with the organization
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed6e87ae143cd83dc4aa8
      - name: userId
        in: query
        required: true
        description: Id of user to remove
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed70c7ae143cd83dc4aa9
      - name: summaryExclude
        in: query
        required: false
        description: Comma-separated list of summary fields to exclude from org summary
        schema:
          type: string
        example: payloadCount
      - name: summaryInclude
        in: query
        required: false
        description: Comma-separated list of summary fields to include in org summary
        schema:
          type: string
        example: payloadCount
      responses:
        '200':
          description: Updated organization information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/org'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - org.removeMember
  /orgs/{orgId}/notebookMinuteCounts:
    get:
      operationId: org.notebookMinuteCounts
      summary: Returns notebook execution usage by day for the time range specified for this…
      tags:
      - Orgs
      parameters:
      - name: orgId
        in: path
        required: true
        description: ID associated with the organization
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed6e87ae143cd83dc4aa8
      - name: start
        in: query
        required: false
        description: Start of range for notebook execution query (ms since epoch)
        schema:
          type: string
        example: 0
      - name: end
        in: query
        required: false
        description: End of range for notebook execution query (ms since epoch)
        schema:
          type: string
        example: 1465790400000
      responses:
        '200':
          description: Notebook usage information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notebookMinuteCounts'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if organization was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - org.notebookMinuteCounts
  /orgs/{orgId}/payloadCounts:
    get:
      operationId: org.payloadCounts
      summary: Returns payload counts for the time range specified for all applications this…
      tags:
      - Orgs
      parameters:
      - name: orgId
        in: path
        required: true
        description: ID associated with the organization
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed6e87ae143cd83dc4aa8
      - name: start
        in: query
        required: false
        description: Start of range for payload count query (ms since epoch)
        schema:
          type: string
        example: 0
      - name: end
        in: query
        required: false
        description: End of range for payload count query (ms since epoch)
        schema:
          type: string
        example: 1465790400000
      - name: asBytes
        in: query
        required: false
        description: If the resulting stats should be returned as bytes
        schema:
          type: string
          default: false
        example: true
      responses:
        '200':
          description: Payload counts, by type and source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payloadStats'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if organization was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - org.payloadCounts
  /orgs/{orgId}/payloadCountsBreakdown:
    get:
      operationId: org.payloadCountsBreakdown
      summary: Returns payload counts per resolution in the time range specified for all…
      tags:
      - Orgs
      parameters:
      - name: orgId
        in: path
        required: true
        description: ID associated with the organization
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed6e87ae143cd83dc4aa8
      - name: start
        in: query
        required: false
        description: Start of range for payload count query (ms since epoch)
        schema:
          type: string
        example: 0
      - name: end
        in: query
        required: false
        description: End of range for payload count query (ms since epoch)
        schema:
          type: string
        example: 1465790400000
      - name: resolution
        in: query
        required: false
        description: Resolution in milliseconds
        schema:
          type: string
          enum:
          - '86400000'
          - '3600000'
          default: 86400000
        example: 86400000
      - name: asBytes
        in: query
        required: false
        description: If the resulting stats should be returned as bytes
        schema:
          type: string
          default: false
        example: true
      - name: includeNonBillable
        in: query
        required: false
        description: If non-billable payloads should be included in the result
        schema:
          type: string
          default: false
        example: true
      responses:
        '200':
          description: Sum of payload counts by date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payloadCountsBreakdown'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if organization was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - org.payloadCountsBreakdown
  /orgs/{orgId}/transferResources:
    patch:
      operationId: org.transferResources
      summary: Moves resources to a new owner
      tags:
      - Orgs
      parameters:
      - name: orgId
        in: path
        required: true
        description: ID associated with the organization
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed6e87ae143cd83dc4aa8
      responses:
        '200':
          description: If resource transfer was successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if organization was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/resourceTransfer'
        description: Object containing properties of the transfer
      x-losant-auth-scopes:
      - org.transferResources
components:
  schemas:
    deviceCounts:
      title: Device Counts
      description: Schema for the result of a device counts request
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        counts:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date-time
              created:
                type: integer
              deleted:
                type: integer
              total:
                type: integer
    error:
      title: Error
      description: Schema for errors returned by the API
      type: object
      properties:
        type:
          type: string
        message:
          type: string
        validationErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              validationMessage:
                type: string
    orgPost:
      title: Organization Post
      description: Schema for the body of an Organization creation request
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 32767
        planId:
          type: string
          maxLength: 1024
        billingEmail:
          type: string
          format: email
          maxLength: 1024
        cardToken:
          type: string
          maxLength: 1024
        iconColor:
          type: string
          maxLength: 64
        mfaMode:
          type: string
          enum:
          - notRequired
          - adminRequired
          - required
        entitlementId:
          type: string
          maxLength: 1024
      additionalProperties: false
      required:
      - name
    payloadCountsBreakdown:
      title: Payload Counts Breakdown
      description: Schema for the result of a payload counts breakdown request
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        counts:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date-time
              value:
                type: integer
    orgInvites:
      title: Organization Invitations
      description: Schema for an array of pending invitations to an Organization
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            pattern: ^[A-Fa-f\d]{24}$
          email:
            type: string
            format: email
            maxLength: 1024
          role:
            type: string
            enum:
            - admin
            - edit
            - collaborate
            - view
            - none
          applicationRoles:
            type: array
            items:
              type: object
              properties:
                resourceId:
                  type: string
                  pattern: ^[A-Fa-f\d]{24}$
                role:
                  type: string
                  enum:
                  - collaborate
                  - view
                  - none
              required:
              - resourceId
              - role
              additionalProperties: false
            maxItems: 100
          dashboardRoles:
            type: array
            items:
              type: object
              properties:
                resourceId:
                  type: string
                  pattern: ^[A-Fa-f\d]{24}$
                role:
                  type: string
                  enum:
                  - collaborate
                  - view
                  - none
              required:
              - resourceId
              - role
              additionalProperties: false
            maxItems: 100
          inviteDate:
            type: string
            format: date-time
          ttl:
            type: number
          hasExpired:
            type: boolean
          disallowTransfer:
            type: boolean
    success:
      title: Success
      description: Schema for reporting a successful operation
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
    orgs:
      title: Organizations
      description: Schema for a collection of Organizations
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/org'
        count:
          type: integer
        totalCount:
          type: integer
        perPage:
          type: integer
        page:
          type: integer
        filter:
          type: string
        filterField:
          type: string
        sortField:
          type: string
        sortDirection:
          type: string
          enum:
          - asc
          - desc
          - ASC
          - DESC
          - ''
    org:
      title: Organization
      description: Schema for a single Organization
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        orgId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        creationDate:
          type: string
          format: date-time
        lastUpdated:
          type: string
          format: date-time
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 32767
        _currentRole:
          type: string
          enum:
          - admin
          - edit
          - collaborate
          - view
          - none
        members:
          type: array
          items:
            type: object
            properties:
              userId:
                type: string
                pattern: ^[A-Fa-f\d]{24}$
              firstName:
                type: string
                minLength: 1
                maxLength: 1024
              lastName:
                type: string
                maxLength: 1024
              email:
                type: string
                format: email
                maxLength: 1024
              avatarUrl:
