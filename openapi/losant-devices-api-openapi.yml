components:
  schemas:
    devicePayloadCounts:
      title: Device Payload Counts
      description: Schema for the result of a device payload count request
      type: object
      properties:
        deviceCommand:
          type: number
        deviceConnect:
          type: number
        deviceDisconnect:
          type: number
        deviceState:
          type: number
        mqttIn:
          type: number
        mqttOut:
          type: number
    devicesExportPost:
      title: Devices Metadata Export Post
      description: Schema for the body of a device metadata export request
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 1024
        callbackUrl:
          type: string
          format: uri
          maxLength: 1024
        query:
          $ref: '#/components/schemas/advancedDeviceQuery'
        format:
          type: string
          enum:
          - csv
          - json
          default: csv
      additionalProperties: false
    devicesDeleteOrRestorePost:
      title: Devices Delete Or Restore Post
      description: Schema for the body of a bulk device deletion or restoration request
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 1024
        query:
          $ref: '#/components/schemas/advancedDeviceQuery'
        callbackUrl:
          type: string
          format: uri
          maxLength: 1024
        forceJob:
          type: boolean
          default: false
      additionalProperties: false
      required:
      - query
    bulkDeleteResponse:
      title: Bulk Deletion Response
      description: Schema for the response to a bulk deletion
