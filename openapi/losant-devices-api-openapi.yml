openapi: 3.2.0
info:
  title: Platform Devices API
  version: 1.31.0
  description: User API for accessing platform data
servers:
- url: https://api.losant.com
security:
- bearerAuth: []
tags:
- name: Devices
paths:
  /applications/{applicationId}/devices:
    get:
      operationId: devices.get
      summary: Returns the devices for an application
      tags:
      - Devices
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: sortField
        in: query
        required: false
        description: Field to sort the results by
        schema:
          type: string
          enum:
          - name
          - id
          - creationDate
          - lastUpdated
          - connectionStatus
          - deletedAt
          default: name
        example: name
      - name: sortDirection
        in: query
        required: false
        description: Direction to sort the results by
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        example: asc
      - name: page
        in: query
        required: false
        description: Which page of results to return
        schema:
          type: string
          default: 0
        example: 0
      - name: perPage
        in: query
        required: false
        description: How many items to return per page
        schema:
          type: string
          default: 100
        example: 10
      - name: filterField
        in: query
        required: false
        description: Field to filter the results by. Blank or not provided means no filtering.
        schema:
          type: string
          enum:
          - name
        example: name
      - name: filter
        in: query
        required: false
        description: Filter to apply against the filtered field. Supports globbing. Blank or not provided means no filtering.
        schema:
          type: string
        example: my * device
      - name: deviceClass
        in: query
        required: false
        description: Filter the devices by the given device class or classes
        schema:
          $ref: '#/components/schemas/deviceClassFilter'
      - name: tagFilter
        in: query
        required: false
        description: Array of tag pairs to filter by
        schema:
          $ref: '#/components/schemas/deviceTagFilter'
      - name: excludeConnectionInfo
        in: query
        required: false
        description: If set, do not return connection info
        schema:
          type: string
        example: true
      - name: parentId
        in: query
        required: false
        description: Filter devices as children of a given system id
        schema:
          type: string
        example: 575ecf887ae143cd83dc4aa2
      - name: query
        in: query
        required: false
        description: Device filter JSON object which overrides the filterField, filter, deviceClass, tagFilter, and parentId parameters.
        schema:
          $ref: '#/components/schemas/advancedDeviceQuery'
      - name: tagsAsObject
        in: query
        required: false
        description: Return tags as an object map instead of an array
        schema:
          type: string
        example: true
      - name: attributesAsObject
        in: query
        required: false
        description: Return attributes as an object map instead of an array
        schema:
          type: string
        example: false
      - name: queryDeleted
        in: query
        required: false
        description: If true, endpoint will return recently deleted devices instead
        schema:
          type: string
        example: false
      responses:
        '200':
          description: Collection of devices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/devices'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - devices.get
    post:
      operationId: devices.post
      summary: Create a new device for an application
      tags:
      - Devices
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: tagsAsObject
        in: query
        required: false
        description: Return tags as an object map instead of an array
        schema:
          type: string
        example: true
      - name: attributesAsObject
        in: query
        required: false
        description: Return attributes as an object map instead of an array
        schema:
          type: string
        example: false
      responses:
        '201':
          description: Successfully created device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/device'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/devicePost'
        description: New device information
      x-losant-auth-scopes:
      - devices.post
    patch:
      operationId: devices.patch
      summary: Update the fields of one or more devices
      tags:
      - Devices
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '200':
          description: Object including an update log link and the number of devices updated, failed, and skipped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/devicesUpdated'
        '202':
          description: Successfully queued bulk update job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobEnqueuedResult'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/devicesPatch'
        description: Object containing device query or IDs and update operations
      x-losant-auth-scopes:
      - devices.patch
  /applications/{applicationId}/devices/attributeNames:
    get:
      operationId: devices.attributeNames
      summary: Gets the attribute names that match the given query. Maximum 1K returned
      tags:
      - Devices
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: query
        in: query
        required: false
        description: Device filter JSON object
        schema:
          $ref: '#/components/schemas/advancedDeviceQuery'
      - name: dataType
        in: query
        required: false
        description: Filter the devices by the given attribute data type or types
        schema:
          $ref: '#/components/schemas/deviceAttributeDataTypeFilter'
      - name: startsWith
        in: query
        required: false
        description: Filter attributes down to those that have names starting with the given string. Case insensitive.
        schema:
          type: string
        example: temper
      responses:
        '200':
          description: The matching attribute names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/attributeNamesResponse'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - devices.attributeNames
  /applications/{applicationId}/devices/command:
    post:
      operationId: devices.sendCommand
      summary: Send a command to multiple devices
      tags:
      - Devices
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '200':
          description: If command was successfully sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '202':
          description: If command was queued to be sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobEnqueuedResult'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/multiDeviceCommand'
        description: Command to send to the device
      x-losant-auth-scopes:
      - devices.sendCommand
  /applications/{applicationId}/devices/compositeState:
    get:
      operationId: devices.getCompositeState
      summary: Retrieve the composite last complete state of the matching devices
      tags:
      - Devices
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: start
        in: query
        required: false
        description: Start of time range to look at to build composite state
        schema:
          type: string
          default: 1
        example: 1465790400000
      - name: end
        in: query
        required: false
        description: End of time range to look at to build composite state
        schema:
          type: string
          default: 0
        example: 1465790400000
      - name: attributes
        in: query
        required: false
        description: Comma-separated list of attributes to include. When not provided, returns all attributes.
        schema:
          type: string
        example: myAttr1,myAttr2
      - name: sortField
        in: query
        required: false
        description: Field to sort the results by
        schema:
          type: string
          enum:
          - name
          - id
          - creationDate
          - lastUpdated
          - connectionStatus
          default: name
        example: name
      - name: sortDirection
        in: query
        required: false
        description: Direction to sort the results by
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        example: asc
      - name: page
        in: query
        required: false
        description: Which page of results to return
        schema:
          type: string
          default: 0
        example: 0
      - name: perPage
        in: query
        required: false
        description: How many items to return per page
        schema:
          type: string
          default: 100
        example: 10
      - name: query
        in: query
        required: false
        description: Device advanced query JSON object
        schema:
          $ref: '#/components/schemas/advancedDeviceQuery'
      responses:
        '200':
          description: Collection of composite last state of the devices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/compositeDevicesState'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - devices.getCompositeState
  /applications/{applicationId}/devices/delete:
    post:
      operationId: devices.delete
      summary: Delete devices
      tags:
      - Devices
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '200':
          description: Object indicating number of devices deleted or failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bulkDeleteResponse'
        '202':
          description: If a job was enqueued for the devices to be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobEnqueuedResult'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/devicesDeleteOrRestorePost'
        description: Object containing device deletion options
      x-losant-auth-scopes:
      - devices.delete
  /applications/{applicationId}/devices/deviceNames:
    get:
      operationId: devices.deviceNames
      summary: Gets the device names that match the given query. Maximum 1K returned
      tags:
      - Devices
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: query
        in: query
        required: false
        description: Device filter JSON object
        schema:
          $ref: '#/components/schemas/advancedDeviceQuery'
      - name: startsWith
        in: query
        required: false
        description: Filter devices down to those that have names starting with the given string. Case insensitive.
        schema:
          type: string
        example: temper
      responses:
        '200':
          description: The matching device names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deviceNamesResponse'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - devices.deviceNames
  /applications/{applicationId}/devices/export:
    post:
      operationId: devices.export
      summary: Creates an export of all device metadata
      tags:
      - Devices
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: email
        in: query
        required: false
        description: Email address to send export to. Defaults to current user's email.
        schema:
          type: string
        example: email@example.com
      - name: callbackUrl
        in: query
        required: false
        description: Callback URL to call with export result
        schema:
          type: string
        example: https://example.com/cburl
      responses:
        '202':
          description: If generation of export was successfully started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobEnqueuedResult'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/devicesExportPost'
        description: Object containing device query and optionally email or callback
      x-losant-auth-scopes:
      - devices.export
  /applications/{applicationId}/devices/payloadCounts:
    post:
      operationId: devices.payloadCounts
      summary: Creates an export of payload count information for the matching devices
      tags:
      - Devices
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '202':
          description: If generation of export was successfully started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobEnqueuedResult'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/devicesExportPayloadCountPost'
        description: Object containing export configuration
      x-losant-auth-scopes:
      - devices.payloadCounts
  /applications/{applicationId}/devices/removeData:
    post:
      operationId: devices.removeData
      summary: Removes all device data for the specified time range. Defaults to all data
      tags:
      - Devices
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '202':
          description: If a job was enqueued for device data to be removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobEnqueuedResult'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/devicesRemoveDataPost'
        description: Object defining the device data to delete and devices to delete from
      x-losant-auth-scopes:
      - devices.removeData
  /applications/{applicationId}/devices/restore:
    post:
      operationId: devices.restore
      summary: Restore deleted devices
      tags:
      - Devices
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '200':
          description: Object indicating number of devices restored or failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bulkRestoreResponse'
        '202':
          description: If a job was enqueued for the devices to be restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobEnqueuedResult'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/devicesDeleteOrRestorePost'
        description: Object containing device restoration options
      x-losant-auth-scopes:
      - devices.restore
  /applications/{applicationId}/devices/tagKeys:
    get:
      operationId: devices.tagKeys
      summary: Gets the unique tag keys for devices that match the given query.
      tags:
      - Devices
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: query
        in: query
        required: false
        description: Device filter JSON object
        schema:
          $ref: '#/components/schemas/advancedDeviceQuery'
      - name: startsWith
        in: query
        required: false
        description: Filter keys down to those that start with the given string. Case insensitive.
        schema:
          type: string
        example: temper
      responses:
        '200':
          description: The matching tag keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tagKeysResponse'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - devices.tagKeys
  /applications/{applicationId}/devices/tagValues:
    get:
      operationId: devices.tagValues
      summary: Gets the unique tag values for the given key for devices that match the given…
      tags:
      - Devices
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: query
        in: query
        required: false
        description: Device filter JSON object
        schema:
          $ref: '#/components/schemas/advancedDeviceQuery'
      - name: key
        in: query
        required: true
        description: The tag key to get the values for
        schema:
          type: string
        example: myKey
      - name: startsWith
        in: query
        required: false
        description: Filter values down to those that start with the given string. Case insensitive.
        schema:
          type: string
        example: temper
      responses:
        '200':
          description: The matching tag values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tagValuesResponse'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - devices.tagValues
  /applications/{applicationId}/devices/{deviceId}:
    get:
      operationId: device.get
      summary: Retrieves information on a device
      tags:
      - Devices
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: deviceId
        in: path
        required: true
        description: ID associated with the device
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ecf887ae143cd83dc4aa2
      - name: excludeConnectionInfo
        in: query
        required: false
        description: If set, do not return connection info
        schema:
          type: string
        example: true
      - name: tagsAsObject
        in: query
        required: false
        description: Return tags as an object map instead of an array
        schema:
          type: string
        example: true
      - name: attributesAsObject
        in: query
        required: false
        description: Return attributes as an object map instead of an array
        schema:
          type: string
        example: false
      responses:
        '200':
          description: Device information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/device'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if device was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - device.get
    patch:
      operationId: device.patch
      summary: Updates information about a device
      tags:
      - Devices
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: deviceId
        in: path
        required: true
        description: ID associated with the device
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ecf887ae143cd83dc4aa2
      - name: tagsAsObject
        in: query
        required: false
        description: Return tags as an object map instead of an array
        schema:
          type: string
        example: true
      - name: attributesAsObject
        in: query
        required: false
        description: Return attributes as an object map instead of an array
        schema:
          type: string
        example: false
      responses:
        '200':
          description: Updated device information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/device'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if device was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/devicePatch'
        description: Object containing new properties of the device
