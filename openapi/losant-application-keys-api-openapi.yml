openapi: 3.2.0
info:
  title: Platform Application Keys API
  version: 1.31.0
  description: User API for accessing platform data
servers:
- url: https://api.losant.com
security:
- bearerAuth: []
tags:
- name: Application Keys
paths:
  /applications/{applicationId}/keys:
    get:
      operationId: applicationKeys.get
      summary: Returns the applicationKeys for an application
      tags:
      - Application Keys
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: sortField
        in: query
        required: false
        description: Field to sort the results by
        schema:
          type: string
          enum:
          - key
          - status
          - id
          - creationDate
          - lastUpdated
          - name
          default: creationDate
        example: creationDate
      - name: sortDirection
        in: query
        required: false
        description: Direction to sort the results by
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        example: asc
      - name: page
        in: query
        required: false
        description: Which page of results to return
        schema:
          type: string
          default: 0
        example: 0
      - name: perPage
        in: query
        required: false
        description: How many items to return per page
        schema:
          type: string
          default: 100
        example: 10
      - name: filterField
        in: query
        required: false
        description: Field to filter the results by. Blank or not provided means no filtering.
        schema:
          type: string
          enum:
          - key
          - status
          - name
        example: key
      - name: filter
        in: query
        required: false
        description: Filter to apply against the filtered field. Supports globbing. Blank or not provided means no filtering.
        schema:
          type: string
        example: the*key
      - name: query
        in: query
        required: false
        description: Application key filter JSON object which overrides the filterField and filter parameters.
        schema:
          $ref: '#/components/schemas/advancedApplicationKeyQuery'
      responses:
        '200':
          description: Collection of applicationKeys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationKeys'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - applicationKeys.get
    post:
      operationId: applicationKeys.post
      summary: Create a new applicationKey for an application
      tags:
      - Application Keys
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '201':
          description: Successfully created applicationKey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationKeyPostResponse'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/applicationKeyPost'
        description: ApplicationKey information
      x-losant-auth-scopes:
      - applicationKeys.post
  /applications/{applicationId}/keys/{applicationKeyId}:
    get:
      operationId: applicationKey.get
      summary: Retrieves information on an applicationKey
      tags:
      - Application Keys
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: applicationKeyId
        in: path
        required: true
        description: ID associated with the applicationKey
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec76c7ae143cd83dc4a96
      responses:
        '200':
          description: applicationKey information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationKey'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if applicationKey was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - applicationKey.get
    patch:
      operationId: applicationKey.patch
      summary: Updates information about an applicationKey
      tags:
      - Application Keys
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: applicationKeyId
        in: path
        required: true
        description: ID associated with the applicationKey
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec76c7ae143cd83dc4a96
      responses:
        '200':
          description: Updated applicationKey information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationKey'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if applicationKey was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/applicationKeyPatch'
        description: Object containing new properties of the applicationKey
      x-losant-auth-scopes:
      - applicationKey.patch
    delete:
      operationId: applicationKey.delete
      summary: Deletes an applicationKey
      tags:
      - Application Keys
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: applicationKeyId
        in: path
        required: true
        description: ID associated with the applicationKey
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec76c7ae143cd83dc4a96
      responses:
        '200':
          description: If applicationKey was successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if applicationKey was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - applicationKey.delete
