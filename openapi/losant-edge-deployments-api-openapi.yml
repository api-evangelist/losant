openapi: 3.2.0
info:
  title: Platform Edge Deployments API
  version: 1.31.0
  description: User API for accessing platform data
servers:
- url: https://api.losant.com
security:
- bearerAuth: []
tags:
- name: Edge Deployments
paths:
  /applications/{applicationId}/edge/deployments:
    get:
      operationId: edgeDeployments.get
      summary: Returns the edge deployments for an application
      tags:
      - Edge Deployments
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: sortField
        in: query
        required: false
        description: Field to sort the results by
        schema:
          type: string
          enum:
          - id
          - deviceId
          - flowId
          - desiredVersion
          - currentVersion
          - creationDate
          - lastUpdated
          default: lastUpdated
        example: creationDate
      - name: sortDirection
        in: query
        required: false
        description: Direction to sort the results by
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        example: asc
      - name: page
        in: query
        required: false
        description: Which page of results to return
        schema:
          type: string
          default: 0
        example: 0
      - name: perPage
        in: query
        required: false
        description: How many items to return per page
        schema:
          type: string
          default: 100
        example: 10
      - name: deviceId
        in: query
        required: false
        description: Filter deployments to the given Device ID
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ecf887ae143cd83dc4aa2
      - name: version
        in: query
        required: false
        description: Filter deployments to the given Workflow Version (matches against both current and desired)
        schema:
          type: string
        example: myFlowVersion
      - name: filterEmpty
        in: query
        required: false
        description: Filter out deployments where both the current and desired version are null.
        schema:
          type: string
        example: true
      - name: flowId
        in: query
        required: false
        description: Filter deployments to the given Workflow ID
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed18f7ae143cd83dc4aa6
      responses:
        '200':
          description: Collection of edge deployments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/edgeDeployments'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - edgeDeployments.get
  /applications/{applicationId}/edge/deployments/release:
    post:
      operationId: edgeDeployments.release
      summary: Deploy an edge workflow version to one or more edge devices.
      tags:
      - Edge Deployments
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '202':
          description: If deployment release has been accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/edgeDeploymentRelease'
        description: Deployment release information
      x-losant-auth-scopes:
      - edgeDeployments.release
  /applications/{applicationId}/edge/deployments/remove:
    post:
      operationId: edgeDeployments.remove
      summary: Remove all edge deployments from a device, remove all edge deployments of a…
      tags:
      - Edge Deployments
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '202':
          description: If deployment removal has been accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/edgeDeploymentRemove'
        description: Deployment removal information
      x-losant-auth-scopes:
      - edgeDeployments.remove
  /applications/{applicationId}/edge/deployments/replace:
    post:
      operationId: edgeDeployments.replace
      summary: Replace deployments of an edge workflow version with a new version.
      tags:
      - Edge Deployments
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '202':
          description: If deployment replacement has been accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/edgeDeploymentReplace'
        description: Deployment replacement information
      x-losant-auth-scopes:
      - edgeDeployments.replace
  /applications/{applicationId}/edge/deployments/{edgeDeploymentId}:
    get:
      operationId: edgeDeployment.get
      summary: Retrieves information on an edge deployment
      tags:
      - Edge Deployments
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: edgeDeploymentId
        in: path
        required: true
        description: ID associated with the edge deployment
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed78e7ae143cd83dc4aab
      responses:
        '200':
          description: Edge deployment information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/edgeDeployment'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if edge deployment was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - edgeDeployment.get
components:
  schemas:
    error:
      title: Error
      description: Schema for errors returned by the API
      type: object
      properties:
        type:
          type: string
        message:
          type: string
        validationErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              validationMessage:
                type: string
    success:
      title: Success
      description: Schema for reporting a successful operation
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
    edgeDeployments:
      title: Edge Deployments
      description: Schema for a collection of Edge Deployments
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/edgeDeployment'
        count:
          type: integer
        totalCount:
          type: integer
        perPage:
          type: integer
        page:
          type: integer
        filter:
          type: string
        filterField:
          type: string
        sortField:
          type: string
        sortDirection:
          type: string
          enum:
          - asc
          - desc
          - ASC
          - DESC
          - ''
        applicationId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        deviceId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        flowId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        version:
          type: string
          minLength: 1
          maxLength: 255
        filterEmpty:
          type: boolean
    edgeDeploymentRemove:
      title: Edge Deployment Remove
      description: Schema for removing edge deployments. Can remove a specific workflow from a specific device, can remove all workflows from a specific device, or can remove a specific workflow from all devices.
      type: object
      properties:
        flowId:
          type:
          - string
          - 'null'
          pattern: ^[A-Fa-f\d]{24}$
        deviceId:
          type:
          - string
          - 'null'
          pattern: ^[A-Fa-f\d]{24}$
      additionalProperties: false
      required:
      - flowId
      - deviceId
    edgeDeploymentRelease:
      title: Edge Deployment Release
      description: Schema for deploying one or more edge workflows to one or more edge devices
      oneOf:
      - type: object
        properties:
          deployments:
            type: array
            items:
              type: object
              properties:
                flowId:
                  type: string
                  pattern: ^[A-Fa-f\d]{24}$
                version:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 255
              required:
              - flowId
              - version
              additionalProperties: false
            minItems: 1
            maxItems: 25
          deviceIds:
            type: array
            items:
              type: string
              pattern: ^[A-Fa-f\d]{24}$
            maxItems: 1000
          deviceTags:
            type: array
            items:
              type: object
              properties:
                key:
                  type: string
                  pattern: ^[0-9a-zA-Z_-]{1,255}$
                value:
                  type: string
                  minLength: 1
                  maxLength: 255
              additionalProperties: false
            maxItems: 100
          deviceQuery:
            $ref: '#/components/schemas/advancedDeviceQuery'
        required:
        - deployments
        additionalProperties: false
      - type: object
        properties:
          flowId:
            type: string
            pattern: ^[A-Fa-f\d]{24}$
          version:
            type:
            - string
            - 'null'
            minLength: 1
            maxLength: 255
          deviceIds:
            type: array
            items:
              type: string
              pattern: ^[A-Fa-f\d]{24}$
            maxItems: 1000
          deviceTags:
            type: array
            items:
              type: object
              properties:
                key:
                  type: string
                  pattern: ^[0-9a-zA-Z_-]{1,255}$
                value:
                  type: string
                  minLength: 1
                  maxLength: 255
              additionalProperties: false
            maxItems: 100
          deviceQuery:
            $ref: '#/components/schemas/advancedDeviceQuery'
        required:
        - flowId
        - version
        additionalProperties: false
    edgeDeployment:
      title: Edge Deployment
      description: Schema for a single deployment of an edge workflow to an edge device
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        edgeDeploymentId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        applicationId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        deviceId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        deviceName:
          type: string
          minLength: 1
          maxLength: 255
        deviceConnectionInfo:
          type: object
          properties:
            time:
              type: string
              format: date-time
            connected:
              enum:
              - 1
              - 0
              - null
        flowId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        flowName:
          type: string
          minLength: 1
          maxLength: 255
        flowClass:
          type: string
          enum:
          - edge
          - customNode
        fileName:
          type: string
          pattern: ^(?!\.{1,2}$)[0-9a-zA-Z_.-]{1,255}$
        creationDate:
          type: string
          format: date-time
        lastUpdated:
          type: string
          format: date-time
        currentVersion:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
        desiredVersion:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
        currentEtag:
          type: string
          minLength: 1
          maxLength: 255
        desiredEtag:
          type: string
          minLength: 1
          maxLength: 255
        logs:
          type: array
          items:
            type: object
            properties:
              sourceType:
                type: string
                enum:
                - flow
                - user
                - device
                - apiToken
                - notebook
              sourceId:
                type: string
                pattern: ^[A-Fa-f\d]{24}$
              date:
                type: string
                format: date-time
              changeType:
                type: string
                enum:
                - current
                - desired
              newValue:
                type:
                - string
                - 'null'
                minLength: 1
                maxLength: 255
              previousValue:
                type:
                - string
                - 'null'
                minLength: 1
                maxLength: 255
              attemptedValue:
                type:
                - string
                - 'null'
                minLength: 1
                maxLength: 255
              newEtag:
                type: string
                minLength: 1
                maxLength: 255
              previousEtag:
                type: string
                minLength: 1
                maxLength: 255
              attemptedEtag:
                type: string
                minLength: 1
                maxLength: 255
              error:
                type: string
    edgeDeploymentReplace:
      title: Edge Deployment Replace
      description: Schema for replacing a deployment of a workflow version with a different workflow version
      type: object
      properties:
        flowId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        oldVersion:
          type: string
          minLength: 1
          maxLength: 255
        newVersion:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
      additionalProperties: false
      required:
      - flowId
      - oldVersion
      - newVersion
    advancedDeviceQuery:
      title: Advanced Device Query
      description: Schema for advanced device queries
      type: object
      properties:
        $and:
          type: array
          items:
            $ref: '#/components/schemas/advancedDeviceQuery'
          maxItems: 100
        $or:
          type: array
          items:
            $ref: '#/components/schemas/advancedDeviceQuery'
          maxItems: 100
        $nor:
          type: array
          items:
            $ref: '#/components/schemas/advancedDeviceQuery'
          maxItems: 100
        id:
          oneOf:
          - oneOf:
            - type: string
              pattern: ^[A-Fa-f\d]{24}$
            - type: 'null'
          - type: object
            properties:
              $eq:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $ne:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $gt:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $lt:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $gte:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $lte:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $in:
                type: array
                maxItems: 100
                items:
                  type: string
                  pattern: ^[A-Fa-f\d]{24}$
              $nin:
                type: array
                maxItems: 100
                items:
                  type: string
                  pattern: ^[A-Fa-f\d]{24}$
            additionalProperties: false
            minProperties: 1
            maxProperties: 1
        creationDate:
          oneOf:
          - type:
            - string
            - number
            - boolean
            - 'null'
          - type: object
            properties:
              $eq:
                type:
                - string
                - number
                - boolean
                - 'null'
              $ne:
                type:
                - string
                - number
                - boolean
                - 'null'
              $gt:
                type:
                - string
                - number
                - boolean
                - 'null'
              $lt:
                type:
                - string
                - number
                - boolean
                - 'null'
              $gte:
                type:
                - string
                - number
                - boolean
                - 'null'
              $lte:
                type:
                - string
                - number
                - boolean
                - 'null'
              $startsWith:
                type: string
                minLength: 1
              $endsWith:
                type: string
                minLength: 1
              $contains:
                type: string
                minLength: 1
              $ci:
                type: boolean
              $in:
                type: array
                maxItems: 100
                items:
                  type:
                  - string
                  - number
                  - boolean
              $nin:
                type: array
                maxItems: 100
                items:
                  type:
                  - string
                  - number
                  - boolean
            additionalProperties: false
        lastUpdated:
          oneOf:
          - type:
            - string
            - number
            - boolean
            - 'null'
          - type: object
            properties:
              $eq:
                type:
                - string
                - number
                - boolean
                - 'null'
              $ne:
                type:
                - string
                - number
                - boolean
                - 'null'
              $gt:
                type:
                - string
                - number
                - boolean
                - 'null'
              $lt:
                type:
                - string
                - number
                - boolean
                - 'null'
              $gte:
                type:
                - string
                - number
                - boolean
                - 'null'
              $lte:
                type:
                - string
                - number
                - boolean
                - 'null'
              $startsWith:
                type: string
                minLength: 1
              $endsWith:
                type: string
                minLength: 1
              $contains:
                type: string
                minLength: 1
              $ci:
                type: boolean
              $in:
                type: array
                maxItems: 100
                items:
                  type:
                  - string
                  - number
                  - boolean
              $nin:
                type: array
                maxItems: 100
                items:
                  type:
                  - string
                  - number
                  - boolean
            additionalProperties: false
        deletedAt:
          oneOf:
          - type:
            - string
            - number
            - boolean
            - 'null'
          - type: object
            properties:
              $eq:
                type:
                - string
                - number
                - boolean
                - 'null'
              $ne:
                type:
                - string
                - number
                - boolean
                - 'null'
              $gt:
                type:
                - string
                - number
                - boolean
                - 'null'
              $lt:
                type:
                - string
                - number
                - boolean
                - 'null'
              $gte:
                type:
                - string
                - number
                - boolean
                - 'null'
              $lte:
                type:
                - string
                - number
                - boolean
                - 'null'
              $startsWith:
                type: string
                minLength: 1
              $endsWith:
                type: string
                minLength: 1
              $contains:
                type: string
                minLength: 1
              $ci:
                type: boolean
              $in:
                type: array
                maxItems: 100
                items:
                  type:
                  - string
                  - number
                  - boolean
              $nin:
                type: array
                maxItems: 100
                items:
                  type:
                  - string
                  - number
                  - boolean
            additionalProperties: false
        name:
          oneOf:
          - type:
            - string
            - number
            - boolean
            - 'null'
          - type: object
            properties:
              $eq:
                type:
                - string
                - number
                - boolean
                - 'null'
              $ne:
                type:
                - string
                - number
                - boolean
                - 'null'
              $gt:
                type:
                - string
                - number
                - boolean
                - 'null'
              $lt:
                type:
                - string
                - number
                - boolean
                - 'null'
              $gte:
                type:
                - string
                - number
                - boolean
                - 'null'
              $lte:
                type:
                - string
                - number
                - boolean
                - 'null'
              $startsWith:
                type: string
                minLength: 1
              $endsWith:
                type: string
                minLength: 1
              $contains:
                type: string
                minLength: 1
              $ci:
                type: boolean
              $in:
                type: array
                maxItems: 100
                items:
                  type:
                  - string
                  - number
                  - boolean
              $nin:
                type: array
                maxItems: 100
                items:
                  type:
                  - string
                  - number
                  - boolean
            additionalProperties: false
        deviceClass:
          oneOf:
          - type:
            - string
            - number
            - boolean
            - 'null'
          - type: object
            properties:
              $eq:
                type:
                - string
                - number
                - boolean
                - 'null'
              $ne:
                type:
                - string
                - number
                - boolean
                - 'null'
              $gt:
                type:
                - string
                - number
                - boolean
                - 'null'
              $lt:
                type:
                - string
                - number
                - boolean
                - 'null'
              $gte:
                type:
                - string
                - number
                - boolean
                - 'null'
              $lte:
                type:
                - string
                - number
                - boolean
                - 'null'
              $startsWith:
                type: string
                minLength: 1
              $endsWith:
                type: string
                minLength: 1
              $contains:
                type: string
                minLength: 1
              $ci:
                type: boolean
              $in:
                type: array
                maxItems: 100
                items:
                  type:
                  - string
                  - number
                  - boolean
              $nin:
                type: array
                maxItems: 100
                items:
                  type:
                  - string
                  - number
                  - boolean
            additionalProperties: false
        gatewayId:
          oneOf:
          - oneOf:
            - type: string
              pattern: ^[A-Fa-f\d]{24}$
            - type: 'null'
          - type: object
            properties:
              $eq:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $ne:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $gt:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $lt:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $gte:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $lte:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $in:
                type: array
                maxItems: 100
                items:
                  type: string
                  pattern: ^[A-Fa-f\d]{24}$
              $nin:
                type: array
                maxItems: 100
                items:
                  type: string
                  pattern: ^[A-Fa-f\d]{24}$
            additionalProperties: false
            minProperties: 1
            maxProperties: 1
        parentId:
          oneOf:
          - oneOf:
            - type: string
              pattern: ^[A-Fa-f\d]{24}$
            - type: 'null'
          - type: object
            properties:
              $eq:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $ne:
                oneOf:
                - type: string
                  pattern: ^[A-Fa-f\d]{24}$
                - type: 'null'
              $gt:
