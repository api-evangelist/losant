components:
  schemas:
    applicationSearchResult:
      title: Application Search Result
      description: Results of a search of an application's resources
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            pattern: ^[A-Fa-f\d]{24}$
          name:
            type: string
          metadata:
            type: object
            properties:
              descriptor:
                type: string
              parentDirectory:
                type: string
              contentType:
                type: string
          version:
            type: string
          viewType:
            type: string
            enum:
            - layout
            - page
            - component
          flowClass:
            type: string
            enum:
            - cloud
            - edge
            - embedded
            - experience
            - customNode
          deviceClass:
            type: string
            enum:
            - standalone
            - gateway
            - peripheral
            - floating
            - edgeCompute
            - system
            - embedded
          _type:
            type: string
            enum:
            - applicationApiToken
            - credential
            - dashboard
            - dataTable
            - deviceRecipe
            - device
            - experienceDomain
            - event
            - experienceEndpoint
            - experienceGroup
            - experienceSlug
            - experienceUser
            - experienceVersion
            - experienceView
            - file
            - flow
            - integration
            - notebook
            - resourceJob
            - webhook
        required:
        - id
        - name
        - _type
    validationErrors:
      title: Validation Errors
      description: Schema for validation errors returned by the API
      type: object
      properties:
        type:
          type: string
        message:
          type: string
        validationErrors:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              name:
                type: string
              id:
                type: string
              message:
                type: string
    applicationGlobalPatch:
      title: Application Global Patch
      description: Schema for the body of an Application Global modification request
      type: array
      maxItems: 100
      items:
        type: object
        properties:
          key:
            type: string
            pattern: ^[0-9a-zA-Z_-]{1,255}$
          json:
            type:
            - string
            - 'null'
            minLength: 1
            maxLength: 32767
          cloudOnly:
            type: boolean
          description:
            type: string
            maxLength: 1024
        additionalProperties: false
        required:
        - key
    applicationImportResult:
      title: Application Import Result
      description: 'Schema for the synchronous result of importing resources into an application — either the updated application (when `dryRun: false`) or a dry-run report (when `dryRun: true`)'
