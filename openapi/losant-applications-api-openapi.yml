openapi: 3.2.0
info:
  title: Platform Applications API
  version: 1.31.0
  description: User API for accessing platform data
servers:
- url: https://api.losant.com
security:
- bearerAuth: []
tags:
- name: Applications
paths:
  /applications:
    get:
      operationId: applications.get
      summary: Returns the applications the current user has permission to see
      tags:
      - Applications
      parameters:
      - name: sortField
        in: query
        required: false
        description: Field to sort the results by
        schema:
          type: string
          enum:
          - name
          - id
          - creationDate
          - ownerId
          - lastUpdated
          default: name
        example: name
      - name: sortDirection
        in: query
        required: false
        description: Direction to sort the results by
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        example: asc
      - name: page
        in: query
        required: false
        description: Which page of results to return
        schema:
          type: string
          default: 0
        example: 0
      - name: perPage
        in: query
        required: false
        description: How many items to return per page
        schema:
          type: string
          default: 100
        example: 10
      - name: filterField
        in: query
        required: false
        description: Field to filter the results by. Blank or not provided means no filtering.
        schema:
          type: string
          enum:
          - name
        example: name
      - name: filter
        in: query
        required: false
        description: Filter to apply against the filtered field. Supports globbing. Blank or not provided means no filtering.
        schema:
          type: string
        example: my * app
      - name: orgId
        in: query
        required: false
        description: If not provided, return all applications. If provided but blank, only return applications belonging to the current user. If provided and an id, only return applications belonging to the given organization id.
        schema:
          type: string
          pattern: ^([A-Fa-f\d]{24}|)$
        example: 575ecdf07ae143cd83dc4a9a
      - name: summaryExclude
        in: query
        required: false
        description: Comma-separated list of summary fields to exclude from application summary
        schema:
          type: string
        example: payloadCount
      - name: summaryInclude
        in: query
        required: false
        description: Comma-separated list of summary fields to include in application summary
        schema:
          type: string
        example: payloadCount
      responses:
        '200':
          description: Collection of applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applications'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - applications.get
    post:
      operationId: applications.post
      summary: Create a new application
      tags:
      - Applications
      parameters:
      - name: summaryExclude
        in: query
        required: false
        description: Comma-separated list of summary fields to exclude from application summary
        schema:
          type: string
        example: payloadCount
      - name: summaryInclude
        in: query
        required: false
        description: Comma-separated list of summary fields to include in application summary
        schema:
          type: string
        example: payloadCount
      responses:
        '201':
          description: Successfully created application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/application'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/applicationPost'
        description: New application information
      x-losant-auth-scopes:
      - applications.post
  /applications/import:
    post:
      operationId: applications.import
      summary: Create a new application from an import bundle
      tags:
      - Applications
      parameters: []
      responses:
        '201':
          description: Successfully created application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationCreationByTemplateResult'
        '202':
          description: If application was enqueued to be imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobEnqueuedResult'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '422':
          description: Error if too many validation errors occurred on other resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validationErrors'
      x-losant-auth-scopes:
      - applications.import
  /applications/periodSummaries:
    get:
      operationId: applications.periodSummaries
      summary: Returns application usage summaries over a selected date range
      tags:
      - Applications
      parameters:
      - name: start
        in: query
        required: false
        description: Start of range for resource count queries (ms since epoch)
        schema:
          type: string
        example: 0
      - name: end
        in: query
        required: false
        description: End of range for resource count queries (ms since epoch)
        schema:
          type: string
        example: 1465790400000
      - name: asBytes
        in: query
        required: false
        description: If the resulting payload counts should be returned as bytes
        schema:
          type: string
          default: false
        example: true
      - name: includeNonBillable
        in: query
        required: false
        description: If non-billable payloads should be included in the result
        schema:
          type: string
          default: false
        example: true
      - name: sortField
        in: query
        required: false
        description: Field to sort the results by
        schema:
          type: string
          enum:
          - name
          - id
          - creationDate
          - ownerId
          - lastUpdated
          default: name
        example: name
      - name: sortDirection
        in: query
        required: false
        description: Direction to sort the results by
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        example: asc
      - name: page
        in: query
        required: false
        description: Which page of results to return
        schema:
          type: string
          default: 0
        example: 0
      - name: perPage
        in: query
        required: false
        description: How many items to return per page
        schema:
          type: string
          default: 100
        example: 10
      - name: filterField
        in: query
        required: false
        description: Field to filter the results by. Blank or not provided means no filtering.
        schema:
          type: string
          enum:
          - name
        example: name
      - name: filter
        in: query
        required: false
        description: Filter to apply against the filtered field. Supports globbing. Blank or not provided means no filtering.
        schema:
          type: string
        example: my * app
      - name: orgId
        in: query
        required: false
        description: If not provided, return all applications. If provided but blank, only return applications belonging to the current user. If provided and an id, only return applications belonging to the given organization id.
        schema:
          type: string
          pattern: ^([A-Fa-f\d]{24}|)$
        example: 575ecdf07ae143cd83dc4a9a
      - name: exclude
        in: query
        required: false
        description: Comma-separated list of resources to exclude from summary
        schema:
          type: string
        example: payloadCounts, deviceCounts, notebookMinuteCounts
      - name: include
        in: query
        required: false
        description: Comma-separated list of summary fields to include in application summary
        schema:
          type: string
        example: deviceCounts
      responses:
        '200':
          description: Collection of application period summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/periodSummaries'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - applications.periodSummaries
  /applications/{applicationId}:
    get:
      operationId: application.get
      summary: Retrieves information on an application
      tags:
      - Applications
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID of the associated application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: summaryExclude
        in: query
        required: false
        description: Comma-separated list of summary fields to exclude from application summary
        schema:
          type: string
        example: payloadCount
      - name: summaryInclude
        in: query
        required: false
        description: Comma-separated list of summary fields to include in application summary
        schema:
          type: string
        example: payloadCount
      responses:
        '200':
          description: Application information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/application'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - application.get
    patch:
      operationId: application.patch
      summary: Updates information about an application
      tags:
      - Applications
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID of the associated application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: summaryExclude
        in: query
        required: false
        description: Comma-separated list of summary fields to exclude from application summary
        schema:
          type: string
        example: payloadCount
      - name: summaryInclude
        in: query
        required: false
        description: Comma-separated list of summary fields to include in application summary
        schema:
          type: string
        example: payloadCount
      responses:
        '200':
          description: Updated application information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/application'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/applicationPatch'
        description: Object containing new application properties
      x-losant-auth-scopes:
      - application.patch
    delete:
      operationId: application.delete
      summary: Deletes an application
      tags:
      - Applications
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID of the associated application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '200':
          description: If application was successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - application.delete
  /applications/{applicationId}/applyTemplate:
    patch:
      operationId: application.applyTemplate
      summary: Add resources to an application via an application template
      tags:
      - Applications
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID of the associated application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '200':
          description: Updated application information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/application'
        '202':
          description: If a job was enqueued for the resources to be imported into the application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobEnqueuedResult'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/applicationApplyTemplatePatch'
        description: Object containing template import options
      x-losant-auth-scopes:
      - application.applyTemplate
  /applications/{applicationId}/archiveData:
    get:
      operationId: application.archiveData
      summary: Returns success when a job has been enqueued to archive this application's…
      tags:
      - Applications
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID of the associated application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: date
        in: query
        required: true
        description: The date to archive data (ms since epoch), it must be within the archive time range older than 31 days and newer than the organizations dataTTL
        schema:
          type: string
        example: 1518556791829
      responses:
        '202':
          description: Enqueued a job to archive this applications device data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobEnqueuedResult'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - application.archiveData
  /applications/{applicationId}/backfillArchiveData:
    get:
      operationId: application.backfillArchiveData
      summary: Returns success when a job has been enqueued to backfill all current data to…
      tags:
      - Applications
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID of the associated application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '202':
          description: Enqueued a job to backfill device data to this application archive location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobEnqueuedResult'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - application.backfillArchiveData
  /applications/{applicationId}/clone:
    post:
      operationId: application.clone
      summary: Copy an application into a new application
      tags:
      - Applications
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID of the associated application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '200':
          description: if dryRun is set and successful, then return success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationCloneDryRunResult'
        '201':
          description: If application was successfully cloned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationCreationByTemplateResult'
        '202':
          description: If application was enqueued to be cloned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobEnqueuedResult'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '422':
          description: Error if too many validation errors occurred on other resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validationErrors'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/applicationClonePost'
        description: Object containing optional clone fields
      x-losant-auth-scopes:
      - application.clone
  /applications/{applicationId}/deviceCounts:
    get:
      operationId: application.deviceCounts
      summary: Returns device counts by day for the time range specified for this application
      tags:
      - Applications
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID of the associated application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: start
        in: query
        required: false
        description: Start of range for device count query (ms since epoch)
        schema:
          type: string
        example: 0
      - name: end
        in: query
        required: false
        description: End of range for device count query (ms since epoch)
        schema:
          type: string
        example: 1465790400000
      responses:
        '200':
          description: Device counts by day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deviceCounts'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - application.deviceCounts
  /applications/{applicationId}/export:
    post:
      operationId: application.export
      summary: Export an application and all of its resources
      tags:
      - Applications
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID of the associated application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '200':
          description: a url to download the zip of exported resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationExportResult'
        '202':
          description: If application was enqueued to be exported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobEnqueuedResult'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/applicationExportPost'
        description: Object containing export application options
      x-losant-auth-scopes:
      - application.export
  /applications/{applicationId}/fullDataTablesArchive:
    get:
      operationId: application.fullDataTablesArchive
      summary: Returns success when a job has been enqueued to archive all selected data tables
      tags:
      - Applications
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID of the associated application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '202':
          description: Enqueued a job to archive all selected data tables to this application archive location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobEnqueuedResult'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - application.fullDataTablesArchive
  /applications/{applicationId}/fullEventsArchive:
    get:
      operationId: application.fullEventsArchive
      summary: Returns success when a job has been enqueued to archive all current events
      tags:
      - Applications
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID of the associated application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '202':
          description: Enqueued a job to archive all events to this application archive location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobEnqueuedResult'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - application.fullEventsArchive
  /applications/{applicationId}/globals:
    patch:
      operationId: application.globals
      summary: Updates an application global at the given key
      tags:
      - Applications
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID of the associated application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '200':
          description: Updated application information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/application'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/applicationGlobalPatch'
        description: Array of objects containing new application global information
      x-losant-auth-scopes:
      - application.patch
  /applications/{applicationId}/import:
    post:
      operationId: application.import
      summary: Add multiple resources to an application via a zip file
      tags:
      - Applications
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID of the associated application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '200':
          description: Updated application information or a dry-run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationImportResult'
        '202':
          description: If a job was enqueued for the resources to be imported into the application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobEnqueuedResult'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - application.import
  /applications/{applicationId}/importLogs:
    get:
      operationId: application.importLogs
      summary: Retrieves information on application import logs
      tags:
      - Applications
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID of the associated application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: limit
        in: query
        required: false
        description: Max log entries to return (ordered by time descending)
        schema:
          type: string
          default: 1
        example: 10
      - name: since
        in: query
        required: false
        description: Look for log entries since this time (ms since epoch)
        schema:
          type: string
        example: 1465790400000
      responses:
        '200':
          description: Application log objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationImportExecutions'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - application.importLogs
  /applications/{applicationId}/mqttPublishMessage:
    post:
      operationId: application.mqttPublishMessage
      summary: Publishes the given message to the given MQTT topic
      tags:
      - Applications
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID of the associated application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '200':
          description: Message successfully published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
