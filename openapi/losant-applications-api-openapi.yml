              - Dashboard
              - DataTableRow
              - DataTable
              - DeviceRecipe
              - Device
              - ExperienceDevelopConfig
              - ExperienceEndpoint
              - ExperienceFlowVersion
              - ExperienceGroup
              - ExperienceUser
              - ExperienceVersion
              - ExperienceView
              - File
              - FlowVersion
              - Flow
              - Global
              - Integration
              - Notebook
              - PrivateFile
              - Webhook
              - ResourceJob
            uniqueItems: true
          url:
            type: string
        required:
        - url
        - limitErrors
