openapi: 3.2.0
info:
  title: Platform Notebooks API
  version: 1.31.0
  description: User API for accessing platform data
servers:
- url: https://api.losant.com
security:
- bearerAuth: []
tags:
- name: Notebooks
paths:
  /applications/{applicationId}/notebooks:
    get:
      operationId: notebooks.get
      summary: Returns the notebooks for an application
      tags:
      - Notebooks
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: sortField
        in: query
        required: false
        description: Field to sort the results by
        schema:
          type: string
          enum:
          - name
          - id
          - creationDate
          - lastUpdated
          - lastExecutionRequested
          default: name
        example: name
      - name: sortDirection
        in: query
        required: false
        description: Direction to sort the results by
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        example: asc
      - name: page
        in: query
        required: false
        description: Which page of results to return
        schema:
          type: string
          default: 0
        example: 0
      - name: perPage
        in: query
        required: false
        description: How many items to return per page
        schema:
          type: string
          default: 100
        example: 10
      - name: filterField
        in: query
        required: false
        description: Field to filter the results by. Blank or not provided means no filtering.
        schema:
          type: string
          enum:
          - name
        example: name
      - name: filter
        in: query
        required: false
        description: Filter to apply against the filtered field. Supports globbing. Blank or not provided means no filtering.
        schema:
          type: string
        example: my*notebook
      responses:
        '200':
          description: Collection of notebooks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notebooks'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - notebooks.get
    post:
      operationId: notebooks.post
      summary: Create a new notebook for an application
      tags:
      - Notebooks
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      responses:
        '201':
          description: Successfully created notebook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notebook'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/notebookPost'
        description: New notebook information
      x-losant-auth-scopes:
      - notebooks.post
  /applications/{applicationId}/notebooks/{notebookId}:
    get:
      operationId: notebook.get
      summary: Retrieves information on a notebook
      tags:
      - Notebooks
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: notebookId
        in: path
        required: true
        description: ID associated with the notebook
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed78e7ae143cd83dc4aab
      responses:
        '200':
          description: notebook information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notebook'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if notebook was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - notebook.get
    patch:
      operationId: notebook.patch
      summary: Updates information about a notebook
      tags:
      - Notebooks
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: notebookId
        in: path
        required: true
        description: ID associated with the notebook
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed78e7ae143cd83dc4aab
      responses:
        '200':
          description: Updated notebook information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notebook'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if notebook was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/notebookPatch'
        description: Object containing new properties of the notebook
      x-losant-auth-scopes:
      - notebook.patch
    delete:
      operationId: notebook.delete
      summary: Deletes a notebook
      tags:
      - Notebooks
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: notebookId
        in: path
        required: true
        description: ID associated with the notebook
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed78e7ae143cd83dc4aab
      responses:
        '200':
          description: If notebook was successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if notebook was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - notebook.delete
  /applications/{applicationId}/notebooks/{notebookId}/cancelExecution:
    post:
      operationId: notebook.cancelExecution
      summary: Marks a specific notebook execution for cancellation
      tags:
      - Notebooks
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: notebookId
        in: path
        required: true
        description: ID associated with the notebook
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed78e7ae143cd83dc4aab
      - name: executionId
        in: query
        required: true
        description: The ID of the execution to cancel
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 632e18632f59592e773a4153
      responses:
        '200':
          description: If the execution was successfully marked for cancellation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if execution was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - notebook.execute
  /applications/{applicationId}/notebooks/{notebookId}/execute:
    post:
      operationId: notebook.execute
      summary: Triggers the execution of a notebook
      tags:
      - Notebooks
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: notebookId
        in: path
        required: true
        description: ID associated with the notebook
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed78e7ae143cd83dc4aab
      responses:
        '200':
          description: If execution request was accepted and successfully queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successWithExecutionId'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if notebook was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/notebookExecutionOptions'
        description: The options for the execution
      x-losant-auth-scopes:
      - notebook.execute
  /applications/{applicationId}/notebooks/{notebookId}/logs:
    get:
      operationId: notebook.logs
      summary: Retrieves information on notebook executions
      tags:
      - Notebooks
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: notebookId
        in: path
        required: true
        description: ID associated with the notebook
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed78e7ae143cd83dc4aab
      - name: limit
        in: query
        required: false
        description: Max log entries to return (ordered by time descending)
        schema:
          type: string
          default: 1
        example: 10
      - name: since
        in: query
        required: false
        description: Look for log entries since this time (ms since epoch)
        schema:
          type: string
        example: 1465790400000
      responses:
        '200':
          description: notebook execution information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notebookExecutionLogs'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if notebook was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - notebook.logs
  /applications/{applicationId}/notebooks/{notebookId}/notebookMinuteCounts:
    get:
      operationId: notebook.notebookMinuteCounts
      summary: Returns notebook execution usage by day for the time range specified for this…
      tags:
      - Notebooks
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: notebookId
        in: path
        required: true
        description: ID associated with the notebook
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed78e7ae143cd83dc4aab
      - name: start
        in: query
        required: false
        description: Start of range for notebook execution query (ms since epoch)
        schema:
          type: string
        example: 0
      - name: end
        in: query
        required: false
        description: End of range for notebook execution query (ms since epoch)
        schema:
          type: string
        example: 1465790400000
      responses:
        '200':
          description: Notebook usage information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notebookMinuteCounts'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if notebook was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - notebook.notebookMinuteCounts
  /applications/{applicationId}/notebooks/{notebookId}/requestInputDataExport:
    post:
      operationId: notebook.requestInputDataExport
      summary: Requests a combined zip file of the potential input data for a notebook…
      tags:
      - Notebooks
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: notebookId
        in: path
        required: true
        description: ID associated with the notebook
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed78e7ae143cd83dc4aab
      responses:
        '202':
          description: If export request was accepted and successfully queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobEnqueuedResult'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if notebook was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/notebookDataExportOptions'
        description: The options for the export
      x-losant-auth-scopes:
      - notebook.requestInputDataExport
  /applications/{applicationId}/notebooks/{notebookId}/upload:
    post:
      operationId: notebook.upload
      summary: Uploads the jupyter notebook file
      tags:
      - Notebooks
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: notebookId
        in: path
        required: true
        description: ID associated with the notebook
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ed78e7ae143cd83dc4aab
      responses:
        '200':
          description: Updated notebook information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notebook'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if notebook was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - notebook.upload
components:
  schemas:
    error:
      title: Error
      description: Schema for errors returned by the API
      type: object
      properties:
        type:
          type: string
        message:
          type: string
        validationErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              validationMessage:
                type: string
    notebookExecutionOptions:
      title: Notebook Execution Options
      description: Schema for the options for a Notebook execution request
      type: object
      properties:
        relativeTo:
          oneOf:
          - type: string
          - type: number
          - type: object
            properties:
              $date:
                type: string
            additionalProperties: false
            required:
            - $date
        templateContext:
          type: string
          maxLength: 32767
        email:
          type: string
          format: email
          maxLength: 1024
        callbackUrl:
          type: string
          format: uri
          maxLength: 1024
      additionalProperties: false
    notebookExecutionLogs:
      title: Notebook Execution Logs
      description: Schema for a set of Notebook execution logs
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            pattern: ^[A-Fa-f\d]{24}$
          notebookExecutionId:
            type: string
            pattern: ^[A-Fa-f\d]{24}$
          notebookId:
            type: string
            pattern: ^[A-Fa-f\d]{24}$
          imageVersion:
            type: string
            enum:
            - v1
            - v2
            - v3
            - v4
          applicationId:
            type: string
            pattern: ^[A-Fa-f\d]{24}$
          email:
            type: string
            format: email
            maxLength: 1024
          status:
            type: string
            enum:
            - queued
            - inProgress
            - completed
            - errored
            - timeout
            - canceling
            - canceled
          executionRelativeTo:
            type: string
            format: date-time
          maxAllowedRunMinutes:
            type: number
          sourceType:
            type: string
            enum:
            - flow
            - user
            - device
            - apiToken
            - notebook
          sourceId:
            type: string
            pattern: ^[A-Fa-f\d]{24}$
          callbackUrl:
            type: string
            format: uri
            maxLength: 1024
          runQueuedAt:
            type: string
            format: date-time
          runStartedAt:
            type: string
            format: date-time
          inputsCompletedAt:
            type: string
            format: date-time
          notebookCompletedAt:
            type: string
            format: date-time
          outputsCompletedAt:
            type: string
            format: date-time
          templateContext:
            type: string
            maxLength: 32767
          inputInfo:
            type: object
            patternProperties:
              .*:
                type: object
                properties:
                  size:
                    type: number
                  url:
                    type: string
          outputInfo:
            type: object
            patternProperties:
              .*:
                type: object
                properties:
                  size:
                    type: number
                  url:
                    type: string
                  contentType:
                    type: string
                  outputType:
                    type: string
                    enum:
                    - dataTable
                    - file
                    - executionResult
                    - directory
                    - temporaryUrl
          executionErrors:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                message:
                  type: string
    success:
      title: Success
      description: Schema for reporting a successful operation
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
    jobEnqueuedResult:
      title: Job Enqueued API Result
      description: Schema for the result of a job being queued
      type: object
      properties:
        jobQueued:
          type: boolean
          enum:
          - true
        jobId:
          type: string
          maxLength: 24
        success:
          type: boolean
          enum:
          - true
    successWithExecutionId:
      title: Success With Execution ID
      description: Schema for reporting a successful operation with a corresponding execution ID
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
        executionId:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
    notebookPatch:
      title: Notebook Patch
      description: Schema for the body of a Notebook modification request
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1024
        description:
          type: string
          maxLength: 32767
        inputs:
          type: array
          maxItems: 100
          items:
            type: object
            discriminator:
              propertyName: inputType
            oneOf:
            - type: object
              properties:
                inputType:
                  type: string
                  enum:
                  - deviceData
                fileName:
                  oneOf:
                  - type: string
                    pattern: ^(?!\.{1,2}$)[0-9a-zA-Z_.-]{1,255}$
                  - type: string
                    minLength: 4
                    maxLength: 255
                    pattern: .*\{\{.+\}\}.*
                deviceTags:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    properties:
                      key:
                        oneOf:
                        - type: string
                          pattern: ^[0-9a-zA-Z_-]{1,255}$
                        - type: string
                          minLength: 4
                          maxLength: 255
                          pattern: .*\{\{.+\}\}.*
                      value:
                        type: string
                        minLength: 1
                        maxLength: 255
                    additionalProperties: false
                deviceIds:
                  type: array
                  maxItems: 100
                  items:
                    oneOf:
                    - type: string
                      pattern: ^[A-Fa-f\d]{24}$
                    - type: string
                      minLength: 4
                      maxLength: 255
                      pattern: .*\{\{.+\}\}.*
                queryJson:
                  type: string
                  maxLength: 8192
                attributes:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                    pattern: ^[0-9a-zA-Z_-]{1,255}$
                start:
                  type: number
                end:
                  type: number
              required:
              - inputType
              - fileName
              - start
              - end
              additionalProperties: false
            - type: object
              properties:
                inputType:
                  type: string
                  enum:
                  - deviceConnectionHistory
                fileName:
                  oneOf:
                  - type: string
                    pattern: ^(?!\.{1,2}$)[0-9a-zA-Z_.-]{1,255}$
                  - type: string
                    minLength: 4
                    maxLength: 255
                    pattern: .*\{\{.+\}\}.*
                deviceTags:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    properties:
                      key:
                        oneOf:
                        - type: string
                          pattern: ^[0-9a-zA-Z_-]{1,255}$
                        - type: string
                          minLength: 4
                          maxLength: 255
                          pattern: .*\{\{.+\}\}.*
                      value:
                        type: string
                        minLength: 1
                        maxLength: 255
                    additionalProperties: false
                deviceIds:
                  type: array
                  maxItems: 100
                  items:
                    oneOf:
                    - type: string
                      pattern: ^[A-Fa-f\d]{24}$
                    - type: string
                      minLength: 4
                      maxLength: 255
                      pattern: .*\{\{.+\}\}.*
                queryJson:
                  type: string
                  maxLength: 8192
                start:
                  type: number
                end:
                  type: number
              required:
              - inputType
              - fileName
              - start
              - end
              additionalProperties: false
            - type: object
              properties:
                inputType:
                  type: string
                  enum:
                  - deviceMetadata
                fileName:
                  oneOf:
                  - type: string
                    pattern: ^(?!\.{1,2}$)[0-9a-zA-Z_.-]{1,255}$
                  - type: string
                    minLength: 4
                    maxLength: 255
                    pattern: .*\{\{.+\}\}.*
                deviceTags:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    properties:
                      key:
                        oneOf:
                        - type: string
                          pattern: ^[0-9a-zA-Z_-]{1,255}$
                        - type: string
                          minLength: 4
                          maxLength: 255
                          pattern: .*\{\{.+\}\}.*
                      value:
                        type: string
                        minLength: 1
                        maxLength: 255
                    additionalProperties: false
                deviceIds:
                  type: array
                  maxItems: 100
                  items:
                    oneOf:
                    - type: string
                      pattern: ^[A-Fa-f\d]{24}$
                    - type: string
                      minLength: 4
                      maxLength: 255
                      pattern: .*\{\{.+\}\}.*
                queryJson:
                  type: string
                  maxLength: 8192
                format:
                  type: string
                  enum:
                  - csv
                  - json
                  default: csv
              required:
              - inputType
              - fileName
              additionalProperties: false
            - type: object
              properties:
                inputType:
                  type: string
                  enum:
                  - dataTable
                fileName:
                  oneOf:
                  - type: string
                    pattern: ^(?!\.{1,2}$)[0-9a-zA-Z_.-]{1,255}$
                  - type: string
                    minLength: 4
                    maxLength: 255
                    pattern: .*\{\{.+\}\}.*
                dataTableId:
                  oneOf:
                  - type: string
                    pattern: ^[A-Fa-f\d]{24}$
                  - type: string
                    minLength: 4
                    maxLength: 255
                    pattern: .*\{\{.+\}\}.*
                queryJson:
                  type: string
                  maxLength: 8192
              required:
              - inputType
              - fileName
              - dataTableId
              additionalProperties: false
            - type: object
              properties:
                inputType:
                  type: string
                  enum:
                  - eventData
                fileName:
                  oneOf:
                  - type: string
                    pattern: ^(?!\.{1,2}$)[0-9a-zA-Z_.-]{1,255}$
                  - type: string
