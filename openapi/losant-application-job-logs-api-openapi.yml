openapi: 3.2.0
info:
  title: Platform Application Job Logs API
  version: 1.31.0
  description: User API for accessing platform data
servers:
- url: https://api.losant.com
security:
- bearerAuth: []
tags:
- name: Application Job Logs
paths:
  /applications/{applicationId}/jobLogs:
    get:
      operationId: applicationJobLogs.get
      summary: Returns the job logs for an application
      tags:
      - Application Job Logs
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: sortField
        in: query
        required: false
        description: Field to sort the results by
        schema:
          type: string
          enum:
          - name
          - status
          - resourceType
          - runQueuedAt
          - runStartedAt
          - runCompletedAt
          default: runQueuedAt
        example: status
      - name: sortDirection
        in: query
        required: false
        description: Direction to sort the results by
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        example: asc
      - name: page
        in: query
        required: false
        description: Which page of results to return
        schema:
          type: string
          default: 0
        example: 0
      - name: perPage
        in: query
        required: false
        description: How many items to return per page
        schema:
          type: string
          default: 100
        example: 10
      - name: query
        in: query
        required: false
        description: Filter application job logs by a query.
        schema:
          $ref: '#/components/schemas/advancedApplicationJobLogQuery'
      responses:
        '200':
          description: Collection of application job logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationJobLogs'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - applicationJobLogs.get
  /applications/{applicationId}/jobLogs/{jobId}:
    get:
      operationId: applicationJobLog.get
      summary: Returns the job log for the given ID
      tags:
      - Application Job Logs
      parameters:
      - name: applicationId
        in: path
        required: true
        description: ID associated with the application
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a97
      - name: jobId
        in: path
        required: true
        description: ID associated with the job execution
        schema:
          type: string
          pattern: ^[A-Fa-f\d]{24}$
        example: 575ec8687ae143cd83dc4a98
      responses:
        '200':
          description: An application job log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationJobLog'
        '400':
          description: Error if malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Error if application job log was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-losant-auth-scopes:
      - applicationJobLog.get
